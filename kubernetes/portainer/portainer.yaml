---
# Portainer's server, with its own login. Its Ingress is in portainer.vault.yaml.
# The claim holds the tunnel key every Edge key names, so an empty claim means re-keying every agent.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portainer
  namespace: portainer
spec:
  storageClassName: local-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: portainer
spec:
  replicas: 1
  # Two at once would open the same database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      nodeSelector:
        homelab.local/portainer: "true"
      automountServiceAccountToken: false
      containers:
        - name: portainer
          image: portainer/portainer-ee
          ports:
            - name: https
              containerPort: 9443
            - name: edge
              containerPort: 8000
          env:
            - name: TZ
              value: America/Chicago
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /api/system/status
              port: https
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portainer
---
apiVersion: v1
kind: Service
metadata:
  name: portainer
  namespace: portainer
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: self-signed@file
spec:
  selector:
    app: portainer
  ports:
    - name: https
      port: 9443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: portainer-edge
  namespace: portainer
  labels:
    svccontroller.k3s.cattle.io/lbpool: portainer
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: portainer
  ports:
    - name: edge
      port: 8000
      targetPort: edge
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-traefik
  namespace: portainer
spec:
  podSelector:
    matchLabels:
      app: portainer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 9443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-agents
  namespace: portainer
spec:
  podSelector:
    matchLabels:
      app: portainer
  policyTypes:
    - Ingress
  ingress:
    # Edge agents dial the tunnel from the internet, and on the LAN through the UDM's forward, so every address.
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8000
---
# Fails and retries in its pod, so Container Crash Loop (k3s), while Portainer's newest scheduled backup is over 26 hours old.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-freshness
  namespace: portainer
spec:
  schedule: "@hourly"
  jobTemplate:
    spec:
      backoffLimit: 6
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            homelab.local/portainer: "true"
          # Portainer's folders are root's.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          containers:
            - name: backup-freshness
              image: alpine:3
              command: ["sh", "-c", "find /backups -name '*.tar.gz' -mmin -1560 | grep -q ."]
              volumeMounts:
                - name: data
                  mountPath: /backups
                  subPath: scheduled-backups
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: portainer
                readOnly: true
