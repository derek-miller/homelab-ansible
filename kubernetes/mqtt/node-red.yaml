---
# Node-RED, which turns Proxmox notifications and UPS readings into Discord alerts. Its webhook URLs and token, routes and the UPS's address are in mqtt.vault.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: node-red
  namespace: mqtt
spec:
  storageClassName: local-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: mqtt
spec:
  replicas: 1
  # Two at once would share one flows file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      nodeSelector:
        homelab.local/mqtt: "true"
      containers:
        - name: node-red
          image: nodered/node-red
          envFrom:
            - secretRef:
                name: node-red
          env:
            - name: TZ
              value: America/Chicago
          ports:
            - name: http
              containerPort: 1880
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: node-red
---
apiVersion: v1
kind: Service
metadata:
  name: node-red
  namespace: mqtt
spec:
  selector:
    app: node-red
  ports:
    - name: http
      port: 1880
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-traefik-node-red
  namespace: mqtt
spec:
  podSelector:
    matchLabels:
      app: node-red
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 1880
