---
# YouTrack, signing in through Keycloak itself. Its Ingress is in youtrack.vault.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: youtrack
spec:
  storageClassName: local-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conf
  namespace: youtrack
spec:
  storageClassName: local-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logs
  namespace: youtrack
  annotations:
    k8up.io/backup: "false"
spec:
  storageClassName: local-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# YouTrack's own scheduled database backups, the consistent copy of data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
  namespace: youtrack
spec:
  storageClassName: local-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtrack
  namespace: youtrack
spec:
  replicas: 1
  # Two at once would open the same database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: youtrack
  template:
    metadata:
      labels:
        app: youtrack
    spec:
      nodeSelector:
        homelab.local/youtrack: "true"
      securityContext:
        runAsUser: 13001
        runAsGroup: 13001
        runAsNonRoot: true
      terminationGracePeriodSeconds: 60
      containers:
        - name: youtrack
          image: jetbrains/youtrack:2026.1.12458
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: America/Chicago
          volumeMounts:
            - name: data
              mountPath: /opt/youtrack/data
            - name: conf
              mountPath: /opt/youtrack/conf
            - name: logs
              mountPath: /opt/youtrack/logs
            - name: backups
              mountPath: /opt/youtrack/backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: conf
          persistentVolumeClaim:
            claimName: conf
        - name: logs
          persistentVolumeClaim:
            claimName: logs
        - name: backups
          persistentVolumeClaim:
            claimName: backups
---
apiVersion: v1
kind: Service
metadata:
  name: youtrack
  namespace: youtrack
spec:
  selector:
    app: youtrack
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-traefik
  namespace: youtrack
spec:
  podSelector:
    matchLabels:
      app: youtrack
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
# Unready, so Container Unhealthy (k3s), while YouTrack's newest backup is over 26 hours old.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-freshness
  namespace: youtrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backup-freshness
  template:
    metadata:
      labels:
        app: backup-freshness
    spec:
      nodeSelector:
        homelab.local/youtrack: "true"
      securityContext:
        runAsUser: 13001
        runAsGroup: 13001
        runAsNonRoot: true
      containers:
        - name: backup-freshness
          image: alpine:3
          command: ["sleep", "infinity"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "find /backups -name '*.tar.gz' -mmin -1560 | grep -q ."]
            periodSeconds: 60
          volumeMounts:
            - name: backups
              mountPath: /backups
              readOnly: true
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: backups
            readOnly: true
