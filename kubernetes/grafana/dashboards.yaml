              },
              "query": "SELECT\n  time,\n  concat(\n    substring('                    ', 1, 10 - cast(rnk as int)),\n    CAST(client AS VARCHAR)\n  ) AS metric,\n  value\nFROM (\n  SELECT\n    $__dateBin(time) AS time,\n    unifi_client.client AS client,\n    min(t.rnk) AS rnk,\n    avg(unifi_client.rssi) AS value\n  FROM unifi_client\n  JOIN (\n    SELECT c, rnk FROM (\n      SELECT\n        client AS c,\n        ROW_NUMBER() OVER (ORDER BY avg(rssi) ASC) AS rnk\n      FROM unifi_client\n      WHERE $__timeFilter(time) AND type = 'wireless' AND rssi <= -65\n      GROUP BY 1\n    ) r WHERE rnk <= 10\n  ) t ON unifi_client.client = t.c\n  WHERE $__timeFilter(time)\n    AND unifi_client.type = 'wireless'\n    AND unifi_client.rssi <= -65\n  GROUP BY 1, 2\n) ORDER BY time, rnk",
              "rawQuery": true,
              "rawSql": "SELECT\n  time,\n  concat(\n    substring('                    ', 1, 10 - cast(rnk as int)),\n    CAST(client AS VARCHAR)\n  ) AS metric,\n  value\nFROM (\n  SELECT\n    $__dateBin(time) AS time,\n    unifi_client.client AS client,\n    min(t.rnk) AS rnk,\n    avg(unifi_client.rssi) AS value\n  FROM unifi_client\n  JOIN (\n    SELECT c, rnk FROM (\n      SELECT\n        client AS c,\n        ROW_NUMBER() OVER (ORDER BY avg(rssi) ASC) AS rnk\n      FROM unifi_client\n      WHERE $__timeFilter(time) AND type = 'wireless' AND rssi <= -65\n      GROUP BY 1\n    ) r WHERE rnk <= 10\n  ) t ON unifi_client.client = t.c\n  WHERE $__timeFilter(time)\n    AND unifi_client.type = 'wireless'\n    AND unifi_client.rssi <= -65\n  GROUP BY 1, 2\n) ORDER BY time, rnk",
              "refId": "A",
              "resultFormat": "time_series"
            }
          ],
          "title": "Weak Client Map — Weakest 10 (RSSI ≤ -65)",
          "type": "state-timeline"
