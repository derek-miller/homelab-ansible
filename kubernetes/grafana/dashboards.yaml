---
# Grafana provisions these at every start, and its UI can't save an edit to them; a change goes
# here as the dashboard's JSON model. A dashboard taken out of its file is deleted from Grafana.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-providers
  namespace: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: finite-labs
        folder: Finite Labs
        folderUid: ag30jqpcnot1cc
        type: file
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards/finite-labs
      - name: home
        folder: Home
        folderUid: eg30jqr4r30g0b
        type: file
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards/home
      - name: homelab
        folder: Homelab
        folderUid: dg30jqry8dvcwf
        type: file
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards/homelab
