              "query": "SELECT\n  $__dateBin(time) AS time,\n  concat(\n    substring(\n      '                          ',\n      1,\n      10 - cast(t.rnk as int)\n    ),\n    unifi_port.switch,\n    ' ',\n    unifi_port.name\n  ) AS metric,\n  avg(unifi_port.rx_mcast_pps) AS value\nFROM\n  unifi_port\n  JOIN (\n    SELECT\n      concat(switch, ' ', name) AS p,\n      ROW_NUMBER() OVER (\n        ORDER BY\n          max(rx_mcast_pps) DESC\n      ) as rnk\n    FROM\n      unifi_port\n    WHERE\n      $__timeFilter(time)\n      AND switch IN (${switch:singlequote})\n    GROUP BY\n      1\n    ORDER BY\n      2\n    LIMIT\n      10\n  ) t ON concat(unifi_port.switch, ' ', unifi_port.name) = t.p\nWHERE\n  $__timeFilter(time)\nGROUP BY\n  1,\n  2\nORDER BY\n  1,\n  3 DESC",
