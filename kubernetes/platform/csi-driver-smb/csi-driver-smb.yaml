---
# csi-driver-smb publishes no OCI chart.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-smb
  namespace: kube-system
spec:
  interval: 1h
  url: https://kubernetes-csi.github.io/csi-driver-smb
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-smb
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: csi-driver-smb
      version: 1.x
      sourceRef:
        kind: HelmRepository
        name: csi-driver-smb
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    feature:
      enableInlineVolume: false
    # Only static volumes, which the node plugin mounts alone, with no API access.
    controller:
      replicas: 0
    rbac:
      create: false
    windows:
      enabled: false
