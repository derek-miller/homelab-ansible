---
# Ships every container's log on every node to the store in kubernetes/logs. Its login is in vlagent.vault.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-logs-collector
  namespace: vlagent
spec:
  interval: 1h
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-logs-collector
  ref:
    semver: 0.x
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vlagent
  namespace: vlagent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs-collector
  values:
    fullnameOverride: vlagent
    remoteWrite:
      # Buffers on the node's disk while the store is away.
      - url: http://victoria-logs.logs.svc.cluster.local:9428
        maxDiskUsagePerURL: 1GiB
    env:
      - name: VL_remoteWrite_basicAuth_username
        valueFrom:
          secretKeyRef:
            name: vlagent-auth
            key: username
      - name: VL_remoteWrite_basicAuth_password
        valueFrom:
          secretKeyRef:
            name: vlagent-auth
            key: password
