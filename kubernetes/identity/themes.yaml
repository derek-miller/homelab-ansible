      </g>
      <rect x="112" y="220" width="288" height="72" rx="10" fill="url(#blade)"/>
      <circle cx="150" cy="256" r="11" fill="#34D399"/>
      <g stroke="#9A5512" stroke-width="7" stroke-linecap="round" opacity="0.55">
        <line x1="270" y1="240" x2="270" y2="272"/>
        <line x1="292" y1="240" x2="292" y2="272"/>
        <line x1="314" y1="240" x2="314" y2="272"/>
        <line x1="336" y1="240" x2="336" y2="272"/>
        <line x1="358" y1="240" x2="358" y2="272"/>
      </g>
    </svg>
  finitelabs-theme.properties: |
    parent=keycloak.v2
    import=common/keycloak
    styles=css/styles.css css/finitelabs.css
  finitelabs.css: |
    :root.login-pf {
      --fl-font: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --fl-page:
        radial-gradient(60% 55% at 60% 62%, rgba(236, 120, 170, 0.28), transparent 70%),
        radial-gradient(70% 60% at 30% 30%, rgba(140, 120, 230, 0.3), transparent 70%),
        #f8f9fa;
      --fl-text: #212529;
      --fl-muted: #6c757d;
      --fl-strong: #404040;
      --fl-card: rgba(255, 255, 255, 0.65);
      --fl-border: rgba(0, 0, 0, 0.1);
      --fl-field: rgba(255, 255, 255, 0.7);
      --fl-field-border: rgba(0, 0, 0, 0.2);
      --fl-button: #212529;
      --fl-button-text: #f8f9fa;
      --fl-button-hover: #404040;

      --pf-v5-global--FontFamily--text: var(--fl-font);
      --pf-v5-global--FontFamily--text--vf: var(--fl-font);
      --pf-v5-global--FontFamily--heading: var(--fl-font);
      --pf-v5-global--FontFamily--heading--vf: var(--fl-font);
      --pf-v5-global--Color--100: var(--fl-text);
      --pf-v5-global--Color--200: var(--fl-muted);
      --pf-v5-global--primary-color--100: var(--fl-text);
      --pf-v5-global--primary-color--200: var(--fl-strong);
      --pf-v5-global--link--Color: var(--fl-text);
      --pf-v5-global--link--Color--hover: var(--fl-strong);
    }

    :root.login-pf.pf-v5-theme-dark {
      --fl-page:
        radial-gradient(60% 55% at 55% 58%, rgba(214, 40, 120, 0.55), transparent 70%),
        radial-gradient(70% 60% at 30% 35%, rgba(88, 60, 190, 0.55), transparent 70%),
        radial-gradient(90% 80% at 80% 90%, rgba(70, 40, 140, 0.5), transparent 75%),
        #050308;
      --fl-text: #f8f9fa;
      --fl-muted: #a7a9ac;
      --fl-strong: #d0d0d0;
      --fl-card: rgba(10, 10, 15, 0.7);
      --fl-border: rgba(255, 255, 255, 0.1);
      --fl-field: rgba(255, 255, 255, 0.05);
      --fl-field-border: rgba(255, 255, 255, 0.22);
      --fl-button: #f8f9fa;
      --fl-button-text: #050308;
      --fl-button-hover: #d0d0d0;
    }

    .login-pf body {
      background: var(--fl-page);
      background-attachment: fixed;
      min-height: 100vh;
      font-family: var(--fl-font);
    }

    #kc-header {
      margin-bottom: 28px;
    }

    #kc-header-wrapper {
      width: 240px;
      max-width: 100%;
      height: 57px;
      margin: 0 auto;
      font-size: 0;
      color: transparent !important;
      background-color: var(--fl-text);
      -webkit-mask: url("../img/logo.svg") center / contain no-repeat;
      mask: url("../img/logo.svg") center / contain no-repeat;
    }

    .login-pf .pf-v5-c-login__main {
      --pf-v5-c-login__main--BackgroundColor: var(--fl-card);
      --pf-v5-c-login__main--BoxShadow: none;
      border: 1px solid var(--fl-border);
      border-radius: 8px;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .login-pf .pf-v5-c-login__main-header {
      border-top: 0;
    }

    .login-pf #kc-page-title {
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .login-pf .pf-v5-c-login__main a:not(.pf-v5-c-button) {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .login-pf .pf-v5-c-button:is(.pf-m-primary, .pf-m-secondary, .pf-m-tertiary) {
      --pf-v5-c-button--BorderRadius: 30px;
      --pf-v5-c-button--after--BorderRadius: 30px;
      --pf-v5-c-button--FontWeight: 500;
      --pf-v5-c-button--PaddingTop: 0.625rem;
      --pf-v5-c-button--PaddingBottom: 0.625rem;
    }

    .login-pf .pf-v5-c-button.pf-m-primary {
      --pf-v5-c-button--m-primary--BackgroundColor: var(--fl-button);
      --pf-v5-c-button--m-primary--Color: var(--fl-button-text);
      --pf-v5-c-button--m-primary--hover--BackgroundColor: var(--fl-button-hover);
      --pf-v5-c-button--m-primary--hover--Color: var(--fl-button-text);
      --pf-v5-c-button--m-primary--focus--BackgroundColor: var(--fl-button-hover);
      --pf-v5-c-button--m-primary--focus--Color: var(--fl-button-text);
      --pf-v5-c-button--m-primary--active--BackgroundColor: var(--fl-button-hover);
      --pf-v5-c-button--m-primary--active--Color: var(--fl-button-text);
    }

    .login-pf .pf-v5-c-button:is(.pf-m-secondary, .pf-m-tertiary) {
      --pf-v5-c-button--m-secondary--Color: var(--fl-text);
      --pf-v5-c-button--m-secondary--hover--Color: var(--fl-text);
      --pf-v5-c-button--m-secondary--focus--Color: var(--fl-text);
      --pf-v5-c-button--m-secondary--active--Color: var(--fl-text);
      --pf-v5-c-button--m-secondary--after--BorderColor: var(--fl-field-border);
      --pf-v5-c-button--m-secondary--hover--after--BorderColor: var(--fl-text);
      --pf-v5-c-button--m-secondary--focus--after--BorderColor: var(--fl-text);
      --pf-v5-c-button--m-secondary--active--after--BorderColor: var(--fl-text);
      --pf-v5-c-button--m-tertiary--Color: var(--fl-text);
      --pf-v5-c-button--m-tertiary--after--BorderColor: var(--fl-field-border);
      --pf-v5-c-button--m-tertiary--hover--Color: var(--fl-text);
      --pf-v5-c-button--m-tertiary--hover--after--BorderColor: var(--fl-text);
    }

    .login-pf .pf-v5-c-form-control {
      --pf-v5-c-form-control--BackgroundColor: var(--fl-field);
      --pf-v5-c-form-control--before--BorderTopColor: var(--fl-field-border);
      --pf-v5-c-form-control--before--BorderRightColor: var(--fl-field-border);
      --pf-v5-c-form-control--before--BorderLeftColor: var(--fl-field-border);
      --pf-v5-c-form-control--after--BorderBottomColor: var(--fl-field-border);
      --pf-v5-c-form-control--hover--after--BorderBottomColor: var(--fl-text);
      --pf-v5-c-form-control--focus--after--BorderBottomColor: var(--fl-text);
    }
