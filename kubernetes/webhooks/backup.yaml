---
# The login and the repository's password are in infra.vault.yaml.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
  namespace: webhooks
spec:
  # Root reads every file whatever its owner.
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  backend:
    rest:
      url: http://rest-server.backup.svc.cluster.local:8000/webhooks/
      userSecretRef:
        name: backup
        key: username
      # k8up's spelling.
      passwordSecretReg:
        name: backup
        key: password
    repoPasswordSecretRef:
      name: backup
      key: repository-password
    envFrom:
      - configMapRef:
          name: backup
  backup:
    schedule: "@daily-random"
    activeDeadlineSeconds: 3600
  prune:
    schedule: "@weekly-random"
    activeDeadlineSeconds: 3600
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 3
  check:
    schedule: "@weekly-random"
    activeDeadlineSeconds: 3600
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup
  namespace: webhooks
data:
  # The other nodes refuse a new pod for its first few seconds, and restic doesn't retry its first call.
  SLEEP_DURATION: 30s
---
# The proxy's image has no sqlite3, so the copy can't be made in its own pod.
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: inbox-db
  namespace: webhooks
spec:
  backupCommand: python -c "import sqlite3, sys; m = sqlite3.connect(':memory:'); sqlite3.connect('file:/data/inbox.db?mode=rw', uri=True).backup(m); sys.stdout.buffer.write(m.serialize())"
  fileExtension: .sqlite3
  pod:
    spec:
      nodeSelector:
        homelab.local/webhooks: "true"
      # The proxy's own user, so any file SQLite creates stays the proxy's.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: db
          image: python:3-alpine
          command: [sleep, infinity]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup
  namespace: webhooks
spec:
  podSelector:
    matchLabels:
      k8upjob: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backup
          podSelector:
            matchLabels:
              app: rest-server
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-apiserver
  namespace: webhooks
spec:
  podSelector:
    matchLabels:
      k8upjob: "true"
  policyTypes:
    - Egress
  egress:
    # The backup command runs through pods/exec. Policy sees the kubernetes Service after DNAT, as the server's port 6443.
    - ports:
        - protocol: TCP
          port: 6443
