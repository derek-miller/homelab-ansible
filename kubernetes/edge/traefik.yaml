---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web
  namespace: edge
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-apiserver
  namespace: edge
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Policy sees the kubernetes Service after DNAT, as the server's port 6443.
    - ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-swarm-traefik
  namespace: edge
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Policy sees the Swarm Traefik's published port after Docker's DNAT, on docker_gwbridge.
    - to:
        - ipBlock:
            cidr: 172.19.0.0/16
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traefik
  namespace: edge
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 128Mi
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: traefik
  namespace: edge
spec:
  interval: 1h
  url: oci://ghcr.io/traefik/helm/traefik
  ref:
    semver: 42.x
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
# The domain and the ACME email are in traefik.vault.yaml's traefik-values.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: edge
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: traefik
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: Secret
      name: traefik-values
  values:
    ingressClass:
      enabled: false
    providers:
      kubernetesCRD:
        safeNaming: true
      kubernetesIngress:
        enabled: false
      file:
        enabled: true
        content:
          http:
            routers:
              swarm:
                rule: PathPrefix(`/`)
                priority: 1
                service: swarm
            services:
              swarm:
                loadBalancer:
                  serversTransport: swarm
                  servers:
                    # Traefik renders the file as a Go template; the Swarm Traefik publishes 7443 on this node.
                    - url: https://{{ env `NODE_IP` }}:7443
            serversTransports:
              swarm:
                insecureSkipVerify: true
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        http:
          tls:
            certResolver: letsencrypt
    certificatesResolvers:
      letsencrypt:
        acme:
          storage: /data/acme.json
          dnsChallenge:
            provider: cloudflare
            resolvers:
              - 1.1.1.1:53
              - 1.0.0.1:53
    env:
      - name: NODE_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
    envFrom:
      - secretRef:
          name: traefik-cloudflare
    persistence:
      enabled: true
      existingClaim: traefik
    nodeSelector:
      homelab.local/edge: "true"
    accessLog:
      enabled: true
    service:
      labels:
        svccontroller.k3s.cattle.io/lbpool: edge
      spec:
        externalTrafficPolicy: Local
