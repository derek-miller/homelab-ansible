    <title>{{.StatusCode}} {{.Title}}</title>
    <style>
      :root { --page: radial-gradient(60% 55% at 60% 62%, rgba(236, 120, 170, .28), transparent 70%), radial-gradient(70% 60% at 30% 30%, rgba(140, 120, 230, .3), transparent 70%), #f8f9fa; --text: #212529; --muted: #6c757d; --card: rgba(255, 255, 255, .65); --border: rgba(0, 0, 0, .1); --line: rgba(0, 0, 0, .2); --button: #212529; --button-text: #f8f9fa; --button-hover: #404040; }
      @media (prefers-color-scheme: dark) { :root { --page: radial-gradient(60% 55% at 55% 58%, rgba(214, 40, 120, .55), transparent 70%), radial-gradient(70% 60% at 30% 35%, rgba(88, 60, 190, .55), transparent 70%), radial-gradient(90% 80% at 80% 90%, rgba(70, 40, 140, .5), transparent 75%), #050308; --text: #f8f9fa; --muted: #a7a9ac; --card: rgba(10, 10, 15, .7); --border: rgba(255, 255, 255, .1); --line: rgba(255, 255, 255, .22); --button: #f8f9fa; --button-text: #050308; --button-hover: #d0d0d0; } }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px 16px; background: var(--page); background-attachment: fixed; color: var(--text); font: 400 15px/1.5 Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .logo { width: 220px; max-width: 70%; height: auto; fill: currentColor; }
      main { width: 100%; max-width: 400px; padding: 32px 28px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
      .code { font-size: 48px; font-weight: 300; line-height: 1; color: var(--muted); }
      h1 { margin: 8px 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -.3px; }
      p { color: var(--muted); font-weight: 300; overflow-wrap: anywhere; }
      .actions { display: grid; gap: 10px; margin-top: 24px; }
      .button { display: block; width: 100%; padding: 11px 16px; border-radius: 30px; font: inherit; font-weight: 500; text-align: center; text-decoration: none; cursor: pointer; color: var(--button-text); background: var(--button); border: 1px solid var(--button); }
      .button:hover, .button:focus-visible { background: var(--button-hover); border-color: var(--button-hover); }
      .button.secondary { color: var(--text); background: transparent; border-color: var(--line); }
      .button.secondary:hover, .button.secondary:focus-visible { background: transparent; border-color: var(--text); }
      .button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
      .request { margin-top: 20px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
      footer { font-size: 12px; color: var(--muted); }
    </style>
    </head>
