---
# Each sign-in's error page, mounted as its --custom-templates-dir.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-pages
  namespace: edge
data:
  error.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{.StatusCode}} {{.Title}}</title>
    <style>
      :root { --page: radial-gradient(120% 90% at 50% 30%, #f7f8fa, #e3e7ec 80%); --text: #1d2128; --muted: #5f6b7a; --card: #fff; --border: #d5dae1; --shadow: 0 1px 3px rgba(13, 11, 16, .08); --line: #c4cad3; --code: #c76f1a; }
      @media (prefers-color-scheme: dark) { :root { --page: radial-gradient(120% 90% at 50% 30%, #22252c, #0d0b10 75%); --text: #e8eaed; --muted: #9aa3ae; --card: rgba(24, 27, 33, .92); --border: #2c323c; --shadow: none; --line: #3a414c; --code: #f6b34b; } }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px 16px; background: var(--page); background-attachment: fixed; color: var(--text); font: 400 15px/1.5 Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mark { width: 56px; height: 56px; }
      main { width: 100%; max-width: 400px; padding: 32px 28px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
      .code { font-size: 48px; font-weight: 300; line-height: 1; color: var(--code); }
      h1 { margin: 8px 0 6px; font-size: 24px; font-weight: 700; }
      p { color: var(--muted); overflow-wrap: anywhere; }
      .actions { display: grid; gap: 10px; margin-top: 24px; }
      .button { display: block; width: 100%; padding: 11px 16px; border-radius: 6px; font: inherit; font-weight: 500; text-align: center; text-decoration: none; cursor: pointer; color: #1f1405; background: linear-gradient(#f6b34b, #e5892b); border: 1px solid #d9822a; }
      .button:hover, .button:focus-visible { background: linear-gradient(#efa43d, #d97b22); }
      .button.secondary { color: var(--text); background: transparent; border-color: var(--line); }
      .button.secondary:hover, .button.secondary:focus-visible { border-color: var(--muted); }
      .button:focus-visible { outline: 2px solid #e5892b; outline-offset: 2px; }
      .request { margin-top: 20px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
      footer { font-size: 12px; color: var(--muted); }
    </style>
    </head>
    <body>
    <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <radialGradient id="disc" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#22252C"/><stop offset="1" stop-color="#0D0B10"/></radialGradient>
        <linearGradient id="rail" x1="0" x2="1"><stop offset="0" stop-color="#4A5260"/><stop offset=".5" stop-color="#363D48"/><stop offset="1" stop-color="#21252D"/></linearGradient>
        <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6B34B"/><stop offset="1" stop-color="#E5892B"/></linearGradient>
      </defs>
      <circle cx="256" cy="256" r="248" fill="url(#disc)"/>
      <rect x="128" y="104" width="64" height="304" rx="10" fill="url(#rail)"/>
      <rect x="320" y="104" width="64" height="304" rx="10" fill="url(#rail)"/>
      <g fill="#0D0B10" opacity=".75"><rect x="152" y="128" width="16" height="16" rx="3"/><rect x="152" y="176" width="16" height="16" rx="3"/><rect x="152" y="320" width="16" height="16" rx="3"/><rect x="152" y="368" width="16" height="16" rx="3"/><rect x="344" y="128" width="16" height="16" rx="3"/><rect x="344" y="176" width="16" height="16" rx="3"/><rect x="344" y="320" width="16" height="16" rx="3"/><rect x="344" y="368" width="16" height="16" rx="3"/></g>
      <rect x="112" y="220" width="288" height="72" rx="10" fill="url(#blade)"/>
      <circle cx="150" cy="256" r="11" fill="#34D399"/>
      <g stroke="#9A5512" stroke-width="7" stroke-linecap="round" opacity=".55"><path d="M270 240v32M292 240v32M314 240v32M336 240v32M358 240v32"/></g>
    </svg>
    <main>
      <div class="code">{{.StatusCode}}</div>
      <h1>{{.Title}}</h1>
      {{if .Message}}<p>{{.Message}}</p>{{end}}
      {{if .Redirect}}
      <div class="actions">
        <form method="GET" action="{{.ProxyPrefix}}/sign_in">
          <input type="hidden" name="rd" value="{{.Redirect}}">
          <button type="submit" class="button">Sign in</button>
        </form>
        <a class="button secondary" href="{{.Redirect}}">Go back</a>
      </div>
      {{end}}
      {{if .RequestID}}<p class="request">Request ID {{.RequestID}}</p>{{end}}
    </main>
    {{if and .Footer (ne .Footer "-")}}<footer>{{.Footer}}</footer>{{end}}
    </body>
    </html>
