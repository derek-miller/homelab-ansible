---
# htransformation v0.4.1 (MIT, github.com/tomMoulard/htransformation), which Traefik loads as a
# local plugin so it starts without downloading it. traefik.yaml mounts each key at its path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-htransformation
  namespace: edge
data:
  .traefik.yml: |
    displayName: Header transformation
    type: middleware

    import: github.com/tomMoulard/htransformation

    summary: 'Transform some headers with some other ones, see https://github.com/traefik/traefik/issues/6047'

    testData:
      Rules:
        - Rule:
          Name: 'Header renaming'
          Header: 'X-Traefik-*'
          Value: 'X-custom'
          Type: 'Rename'
        - Rule:
          Name: 'Header addition'
          Header: 'NewHeader'
          Value: 'True'
          Type: 'Set'
        - Rule:
          Name: 'Header deletion'
          Header: 'Cache-Control'
          Type: 'Del'
        - Rule:
          Name: 'Header joining'
          Header: 'Accept-Language'
          Sep: ', '
          Values:
            - 'Foo'
            - 'Bar'
          Type: 'Join'
  go.mod: |
    module github.com/tomMoulard/htransformation

    go 1.24
  LICENSE: |
    MIT License

    Copyright (c) 2021-2022 Tom Moulard

    Permission is hereby granted, free of charge, to any person obtaining a copy
    of this software and associated documentation files (the "Software"), to deal
    in the Software without restriction, including without limitation the rights
