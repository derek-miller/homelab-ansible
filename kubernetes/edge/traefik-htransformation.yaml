    copies of the Software, and to permit persons to whom the Software is
    furnished to do so, subject to the following conditions:

    The above copyright notice and this permission notice shall be included in all
    copies or substantial portions of the Software.

    THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
    IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
    FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
    AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
    LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
    OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
    SOFTWARE.
  htransformation.go: |
    package htransformation

    import (
    	"bufio"
    	"context"
    	"fmt"
    	"net"
    	"net/http"

    	"github.com/tomMoulard/htransformation/pkg/handler/deleter"
    	"github.com/tomMoulard/htransformation/pkg/handler/join"
    	"github.com/tomMoulard/htransformation/pkg/handler/rename"
    	"github.com/tomMoulard/htransformation/pkg/handler/rewrite"
    	"github.com/tomMoulard/htransformation/pkg/handler/set"
    	"github.com/tomMoulard/htransformation/pkg/types"
    )

    // HeadersTransformation holds the necessary components of a Traefik plugin.
    type HeadersTransformation struct {
    	name         string
    	next         http.Handler
    	reqHandlers  []types.Handler
    	respHandlers []types.Handler
    }

    // Config holds configuration to be passed to the plugin.
    type Config struct {
    	Rules []types.Rule
    }

    // CreateConfig populates the Config data object.
    func CreateConfig() *Config {
    	return &Config{
    		Rules: []types.Rule{},
    	}
    }

    // New instantiates and returns the required components used to handle an HTTP request.
    func New(_ context.Context, next http.Handler, config *Config, name string) (http.Handler, error) {
    	handlerBuilder := map[types.RuleType]func(types.Rule) (types.Handler, error){
    		types.Delete:           deleter.New,
    		types.Join:             join.New,
    		types.Rename:           rename.New,
    		types.RewriteValueRule: rewrite.New,
    		types.Set:              set.New,
    	}

    	reqHandlers := make([]types.Handler, 0, len(config.Rules))
    	respHandlers := make([]types.Handler, 0, len(config.Rules))

    	for _, rule := range config.Rules {
    		newHandler, ok := handlerBuilder[rule.Type]
    		if !ok {
    			return nil, fmt.Errorf("%w: %s", types.ErrInvalidRuleType, rule.Name)
    		}

    		handler, err := newHandler(rule)
    		if err != nil {
    			return nil, fmt.Errorf("%w: %s", err, rule.Name)
    		}

    		if err := handler.Validate(); err != nil {
    			return nil, fmt.Errorf("%w: %s", err, rule.Name)
    		}

    		if rule.SetOnResponse {
    			respHandlers = append(respHandlers, handler)
    		} else {
    			reqHandlers = append(reqHandlers, handler)
    		}
    	}

    	return &HeadersTransformation{
    		name:         name,
    		next:         next,
    		reqHandlers:  reqHandlers,
    		respHandlers: respHandlers,
    	}, nil
    }

    // Iterate over every header to match the ones specified in the config and
    // return nothing if regexp failed.
    func (u *HeadersTransformation) ServeHTTP(responseWriter http.ResponseWriter, request *http.Request) {
    	for _, handler := range u.reqHandlers {
    		handler.Handle(responseWriter, request)
    	}

    	wrappedResponseWriter := newWrappedResponseWriter(responseWriter, func(rw http.ResponseWriter) {
    		for _, handler := range u.respHandlers {
    			handler.Handle(rw, request)
    		}
    	})

    	u.next.ServeHTTP(wrappedResponseWriter, request)
    }

    type wrappedResponseWriter struct {
    	rw         http.ResponseWriter
    	handler    func(http.ResponseWriter)
    	headerSent bool
    }

    func newWrappedResponseWriter(rw http.ResponseWriter, handler func(http.ResponseWriter)) http.ResponseWriter {
    	return &wrappedResponseWriter{
    		rw:         rw,
    		handler:    handler,
    		headerSent: false,
    	}
    }

    func (wrw *wrappedResponseWriter) handleResponseHeader() {
    	if wrw.headerSent {
    		return
    	}

    	wrw.headerSent = true
    	wrw.handler(wrw.rw)
    }

    func (wrw *wrappedResponseWriter) Header() http.Header {
    	return wrw.rw.Header()
    }

    func (wrw *wrappedResponseWriter) Write(p []byte) (int, error) {
    	wrw.handleResponseHeader()

    	n, err := wrw.rw.Write(p)
    	if err != nil {
    		return 0, fmt.Errorf("write response: %w", err)
    	}

    	return n, nil
    }

    func (wrw *wrappedResponseWriter) WriteHeader(statusCode int) {
    	wrw.handleResponseHeader()
    	wrw.rw.WriteHeader(statusCode)
    }

    func (wrw *wrappedResponseWriter) Hijack() (net.Conn, *bufio.ReadWriter, error) {
    	hijacker, ok := wrw.rw.(http.Hijacker)
    	if !ok {
    		return nil, nil, types.ErrNotHTTPHijacker
    	}

    	conn, rw, err := hijacker.Hijack()
    	if err != nil {
    		return nil, nil, fmt.Errorf("hijack: %w", err)
    	}

    	return conn, rw, nil
    }
  pkg_handler_deleter_delete.go: |
    package deleter

    import (
    	"net/http"

    	"github.com/tomMoulard/htransformation/pkg/types"
    	"github.com/tomMoulard/htransformation/pkg/utils/header"
    )

    type Deleter struct {
    	rule *types.Rule
    }

    func New(rule types.Rule) (types.Handler, error) {
    	return &Deleter{rule: &rule}, nil
    }

    func (d *Deleter) Validate() error {
    	return nil
    }

    func (d *Deleter) Handle(rw http.ResponseWriter, req *http.Request) {
    	if d.rule.SetOnResponse {
    		rw.Header().Del(d.rule.Header)

    		return
    	}

    	header.Delete(req, d.rule.Header)
    }
  pkg_handler_join_join.go: |
    package join

    import (
    	"net/http"
    	"strings"

    	"github.com/tomMoulard/htransformation/pkg/types"
    )

    type Join struct {
    	rule *types.Rule
    }

    func New(rule types.Rule) (types.Handler, error) {
    	return &Join{rule: &rule}, nil
    }

    func (j *Join) Validate() error {
    	if len(j.rule.Values) == 0 || j.rule.Sep == "" {
    		return types.ErrMissingRequiredFields
    	}

    	return nil
    }

    func (j *Join) Handle(rw http.ResponseWriter, req *http.Request) {
    	var val []string
    	if strings.EqualFold(j.rule.Header, "Host") {
    		val = []string{req.Host}
    	} else {
    		var ok bool
    		val, ok = req.Header[j.rule.Header]

    		if !ok {
    			return
    		}
    	}

    	newHeaderVal := val[0]
    	for _, value := range j.rule.Values {
    		newHeaderVal += j.rule.Sep + getValue(value, j.rule.HeaderPrefix, req)
    	}

    	if j.rule.SetOnResponse {
    		rw.Header().Set(j.rule.Name, newHeaderVal)

    		return
    	}

    	if strings.EqualFold(j.rule.Header, "Host") {
    		req.Host = newHeaderVal
    	} else {
    		req.Header.Set(j.rule.Header, newHeaderVal)
    	}
    }

    // getValue checks if prefix exists, the given prefix is present,
    // and then proceeds to read the existing header (after stripping the prefix)
    // to return as value.
    func getValue(ruleValue, valueIsHeaderPrefix string, req *http.Request) string {
    	actualValue := ruleValue

    	if valueIsHeaderPrefix != "" && strings.HasPrefix(ruleValue, valueIsHeaderPrefix) {
    		header := strings.TrimPrefix(ruleValue, valueIsHeaderPrefix)
    		// If the resulting value after removing the prefix is empty,
    		// we return the actual value,
    		// which is the prefix itself.
    		// This is because doing a req.Header.Get("") would not fly well.
    		if header == "" {
    			return actualValue
    		}

    		if strings.EqualFold(header, "Host") {
    			actualValue = req.Host
    		} else {
    			actualValue = req.Header.Get(header)
    		}
    	}

    	return actualValue
    }
  pkg_handler_rename_rename.go: |
    package rename

    import (
    	"fmt"
    	"net/http"
    	"regexp"

    	"github.com/tomMoulard/htransformation/pkg/types"
    	"github.com/tomMoulard/htransformation/pkg/utils/header"
    )

    type Rename struct {
    	rule *types.Rule
    }

    func New(rule types.Rule) (types.Handler, error) {
    	re, err := regexp.Compile(rule.Header)
    	if err != nil {
    		return nil, fmt.Errorf("%w: %s", types.ErrInvalidRegexp, rule.Name)
    	}

    	rule.Regexp = re

    	return &Rename{rule: &rule}, nil
    }

    func (r *Rename) Validate() error {
    	if r.rule.Value == "" {
    		return types.ErrMissingRequiredFields
    	}

    	return nil
    }

    func (r *Rename) Handle(rw http.ResponseWriter, req *http.Request) {
    	originalHost := req.Header.Get("Host") // Eventually X-Forwarded-Host
    	req.Header.Set("Host", req.Host)

    	for headerName, headerValues := range req.Header {
    		if matched := r.rule.Regexp.Match([]byte(headerName)); !matched {
    			continue
    		}

    		if r.rule.SetOnResponse {
    			rw.Header().Del(headerName)
    		} else {
    			header.Delete(req, headerName)
    		}

    		for _, val := range headerValues {
    			if r.rule.SetOnResponse {
    				rw.Header().Set(r.rule.Value, val)
    			} else {
    				header.Set(req, r.rule.Value, val)
    			}
    		}
    	}

    	req.Header.Set("Host", originalHost)
    }
  pkg_handler_rewrite_rewrite.go: |
    package rewrite

    import (
    	"fmt"
    	"net/http"
    	"regexp"
    	"strings"

    	"github.com/tomMoulard/htransformation/pkg/types"
    	"github.com/tomMoulard/htransformation/pkg/utils/header"
    )

    type Rewrite struct {
    	rule            *types.Rule
    	ruleValueRegexp *regexp.Regexp
    }

    func New(rule types.Rule) (types.Handler, error) {
    	reg, err := regexp.Compile(rule.Header)
    	if err != nil {
    		return nil, fmt.Errorf("%w: %s: %q", types.ErrInvalidRegexp, rule.Name, rule.Header)
    	}

    	rule.Regexp = reg

    	reg, err = regexp.Compile(rule.Value)
    	if err != nil {
    		return nil, fmt.Errorf("%w: %s: %q", types.ErrInvalidRegexp, rule.Name, rule.Value)
    	}

    	return &Rewrite{
    		rule:            &rule,
    		ruleValueRegexp: reg,
    	}, nil
    }

    func (r *Rewrite) Validate() error {
    	if r.rule.ValueReplace == "" {
    		return types.ErrMissingRequiredFields
    	}

    	return nil
    }

    func (r *Rewrite) replaceHeaderValue(headerValue string) string {
    	parts := strings.Split(headerValue, ";")
    	for i, part := range parts {
    		part = strings.TrimSpace(part)
    		parts[i] = r.ruleValueRegexp.ReplaceAllStringFunc(part, func(match string) string {
    			captures := r.ruleValueRegexp.FindStringSubmatch(match)
    			if len(captures) == 0 || captures[0] == "" {
    				return match
    			}

    			replaced := r.rule.ValueReplace

    			for j, capture := range captures[1:] {
    				replaced = strings.ReplaceAll(replaced, fmt.Sprintf("$%d", j+1), capture)
    			}

    			return replaced
    		})
    	}

    	return strings.Join(parts, ";")
    }

    func (r *Rewrite) Handle(rw http.ResponseWriter, req *http.Request) {
    	headers := req.Header
    	if r.rule.SetOnResponse {
    		headers = rw.Header()
    	}

    	originalHost := req.Header.Get("Host") // Eventually X-Forwarded-Host
    	req.Header.Set("Host", req.Host)

    	for headerName, headerValues := range headers {
    		if matched := r.rule.Regexp.Match([]byte(headerName)); !matched {
    			continue
    		}

    		if r.rule.SetOnResponse {
    			rw.Header().Del(headerName)
    		} else {
    			header.Delete(req, headerName)
    		}

    		for _, headerValue := range headerValues {
    			replacedValue := r.replaceHeaderValue(headerValue)
    			if r.rule.SetOnResponse {
    				rw.Header().Add(headerName, replacedValue)
    			} else {
    				header.Add(req, headerName, replacedValue)
    			}
    		}
    	}

    	req.Header.Set("Host", originalHost)
    }
  pkg_handler_set_set.go: |
    package set

    import (
    	"net/http"

    	"github.com/tomMoulard/htransformation/pkg/types"
    	"github.com/tomMoulard/htransformation/pkg/utils/header"
    )

    type Set struct {
    	rule *types.Rule
    }

    func New(rule types.Rule) (types.Handler, error) {
    	return &Set{rule: &rule}, nil
    }

    func (s *Set) Validate() error {
    	if s.rule.Header == "" {
    		return types.ErrMissingRequiredFields
    	}

    	return nil
    }

    func (s *Set) Handle(rw http.ResponseWriter, req *http.Request) {
    	if s.rule.SetOnResponse {
    		rw.Header().Set(s.rule.Header, s.rule.Value)

    		return
    	}

    	header.Set(req, s.rule.Header, s.rule.Value)
    }
  pkg_types_types.go: |
    package types

    import (
    	"errors"
    	"net/http"
    	"regexp"
    )

    // RuleType define the possible types of rules.
    type RuleType string

    const (
    	// Set will set the value of a header.
    	Set RuleType = "Set"
    	// Join will concatenate the values of headers.
    	Join RuleType = "Join"
    	// Delete will delete the value of a header.
    	Delete RuleType = "Del"
    	// Rename will rename a header.
    	Rename RuleType = "Rename"
    	// RewriteValueRule will replace the value of a header with the provided value.
    	RewriteValueRule RuleType = "RewriteValueRule"
    )

    // Rule struct so that we get traefik config.
    type Rule struct {
    	Header       string         `yaml:"Header"`       // header value
    	HeaderPrefix string         `yaml:"HeaderPrefix"` // header prefix to find header
    	Name         string         `yaml:"Name"`         // rule name
    	Regexp       *regexp.Regexp `yaml:"-"`            // Used for rewrite, rename header matching
    	Sep          string         `yaml:"Sep"`          // separator to use for join
    	Type         RuleType       `yaml:"Type"`         // Differentiate rule types
    	Value        string         `yaml:"Value"`
    	ValueReplace string         `yaml:"ValueReplace"` // value used as replacement in rewrite
    	Values       []string       `yaml:"Values"`       // values to join
    	// if SetOnResponse is true, the header will be changed on the response. It will be on the request otherwise (default).
    	SetOnResponse bool `yaml:"SetOnResponse"`
    }

    var ErrMissingRequiredFields = errors.New("missing required fields")

    var ErrInvalidRuleType = errors.New("invalid rule type")

    var ErrInvalidRegexp = errors.New("invalid regexp")

    var ErrNotHTTPHijacker = errors.New("not an http.Hijacker")

    type Handler interface {
    	Validate() error
    	Handle(rw http.ResponseWriter, req *http.Request)
    }
  pkg_utils_header_add.go: |
    package header

    import (
    	"net/http"
    	"strings"
    )

    func Add(req *http.Request, header string, value string) {
    	if strings.EqualFold(header, "Host") {
    		req.Host += value
    	} else {
    		req.Header.Add(header, value)
    	}
    }
  pkg_utils_header_delete.go: |
    package header

    import (
    	"net/http"
    	"strings"
    )

    func Delete(req *http.Request, header string) {
    	if strings.EqualFold(header, "Host") {
    		req.Host = ""
    	} else {
    		req.Header.Del(header)
    	}
    }
  pkg_utils_header_set.go: |
    package header

    import (
    	"net/http"
    	"strings"
    )

    func Set(req *http.Request, header string, value string) {
    	if strings.EqualFold(header, "Host") {
    		req.Host = value
    	} else {
    		req.Header.Set(header, value)
    	}
    }
