---
# The login and the repository's password are in backup.vault.yaml.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
  namespace: sourcebot
spec:
  # Root reads every file whatever its owner.
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  backend:
    rest:
      url: http://rest-server.backup.svc.cluster.local:8000/sourcebot/
      userSecretRef:
        name: backup
        key: username
      # k8up's spelling.
      passwordSecretReg:
        name: backup
        key: password
    repoPasswordSecretRef:
      name: backup
      key: repository-password
    envFrom:
      - configMapRef:
          name: backup
  backup:
    schedule: "@daily-random"
    # Its claims hold about 120G, which a backup that has to send them all, such as the first, needs hours for.
    activeDeadlineSeconds: 21600
  prune:
    schedule: "@weekly-random"
    activeDeadlineSeconds: 3600
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 3
  check:
    schedule: "@weekly-random"
    activeDeadlineSeconds: 3600
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup
  namespace: sourcebot
data:
  # The other nodes refuse a new pod for its first few seconds, and restic doesn't retry its first call.
  SLEEP_DURATION: 30s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup
  namespace: sourcebot
spec:
  podSelector:
    matchLabels:
      k8upjob: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backup
          podSelector:
            matchLabels:
              app: rest-server
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-apiserver
  namespace: sourcebot
spec:
  podSelector:
    matchLabels:
      k8upjob: "true"
  policyTypes:
    - Egress
  egress:
    # The backup command runs through pods/exec. Policy sees the kubernetes Service after DNAT, as the server's port 6443.
    - ports:
        - protocol: TCP
          port: 6443
