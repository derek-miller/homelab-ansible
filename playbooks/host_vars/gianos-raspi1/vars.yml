        EDGE_INSECURE_POLL: 1
    homebridge:
      container_name: homebridge
      restart: unless-stopped
      image: homebridge/homebridge:latest
      network_mode: host
      logging:
        driver: json-file
        options:
          max-size: "10mb"
          max-file: "1"
      volumes:
        - homebridge:/homebridge
      environment:
        TZ: America/Chicago
    homeassistant:
      container_name: homeassistant
      restart: unless-stopped
      image: ghcr.io/home-assistant/home-assistant:stable
      network_mode: host
      volumes:
        - homeassistant-config:/config
        - /run/dbus:/run/dbus:ro
      environment:
        TZ: America/Chicago
    docker-volume-backup:
      container_name: docker-volume-backup
      image: offen/docker-volume-backup:latest
      restart: unless-stopped
      init: true
      networks:
        - apps
      healthcheck:
        test: ["CMD-SHELL", "find \"$$BACKUP_ARCHIVE\" -name 'backup-*' -mmin -1560 | grep -q ."]
        interval: 1h
        timeout: 30s
        retries: 2
        start_period: 27h
        start_interval: 5m
      environment:
        BACKUP_CRON_EXPRESSION: "0 0 * * *"
        BACKUP_ARCHIVE: "{{ docker_volume_backup_root }}/{{ inventory_hostname }}"
        BACKUP_FILENAME: backup-%Y-%m-%dT%H-%M-%S.tar.gz
        BACKUP_PRUNING_PREFIX: backup-
        BACKUP_RETENTION_DAYS: 7
        AGE_PUBLIC_KEYS: "{{ docker_volume_backup_age_public_key }}"
        NOTIFICATION_URLS: "{{ docker_volume_backup_notification_urls }}"
        BACKUP_EXCLUDE_REGEXP: ^.*-(wal|shm|journal)$$
      volumes:
        - type: bind
          source: /mnt
          target: /mnt
          bind:
            propagation: rslave
        # volumes to backup:
        - homeassistant-config:/backup/homeassistant-config:ro
        - homebridge:/backup/homebridge:ro
        - portainer-agent-data:/backup/portainer-agent-data:ro

