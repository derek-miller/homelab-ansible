  3263386665303561643337383064353031623538356231300a653433663638383537373834643737
  32303838303333653830316437653535633461656332613030363062313664643939333932636233
  3137316534633534340a316130316435323439626236656664363535306636366332353331323337
  32343436333936346265346363636434323562373138386365363462343164383135

authorized_keys:
  - key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMNxxAEcT71BAXlVhmi76gjI26BkXwjAgcLaPLIMI+i8 dmiller
    user: rackmini
    state: present
  - key: ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBPUgzXYNTvTCcUHjzdXvy2LZA6YFZKrHrfsse3ipP2ldbhnmU/Io9I/lUligmdaCFktcxwgzZRYawWJI1IsUnZA= dmiller
    user: rackmini
    state: present
  - key: ssh-rsa  dmiller
    user: rackmini
    state: present
  - key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJniPGaqku3O/fD8Lv4OfLIjKY0gOkR8RQCTIypqTWxK openclaw-webhook-proxy
    key_options: restrict,command="export PATH=/usr/local/bin:/opt/homebrew/bin:$PATH; exec openclaw logs --follow --json --limit 1000 --max-bytes 1000000"
    user: rackmini
    state: present
  - key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFn3mE/7wxAjoRYCCh0AUX90wi1dgTyLpVRiiHawg+x3 homebridge-cert
    key_options: restrict,command="/usr/local/bin/homebridge-tls-install"
    user: rackmini
    state: present

mac_user: rackmini

sudoers:
  - user: rackmini
    passwordless: true

# Override the macos group default of GMT — rackmini1 is a workstation +
# user-facing host (Plex, Homebridge), so keep its clock in local time.
timezone: America/Chicago

tailscale_host_args: --accept-routes

homebridge_ui_port: 443

# The versions repos the bot works on pin in .node-version (control4-zigbee3).
nodenv_versions:
  - 24.21.0

# The webhook proxy keeps its own copies in kubernetes/webhooks/openclaw-webhook-proxy.vault.yaml; change both.
openclaw_hooks_token: "{{ vault_openclaw_hooks_token }}"
openclaw_hooks_timeout_seconds: 3600

openclaw_hooks:
  enabled: true
  token: "{{ openclaw_hooks_token }}"
  defaultSessionKey: hook:ingress
  allowRequestSessionKey: true
  allowedSessionKeyPrefixes:
    - "ticket:"
    - "hook:"
  allowedAgentIds:
    - main
  mappings:
    - id: webhook-proxy
      match:
        path: proxy
      action: agent
      name: !unsafe "{{name}}"
      sessionKey: !unsafe "{{sessionKey}}"
      messageTemplate: !unsafe "{{message}}"
      wakeMode: now
      # The webhook proxy waits for the completion line the gateway logs only when this is false.
      deliver: false
      timeoutSeconds: "{{ openclaw_hooks_timeout_seconds }}"
      allowUnsafeExternalContent: true
