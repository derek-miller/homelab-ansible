---
ansible_surrogate_user: ansible
ansible_surrogate_ssh_group: ssh
# The PATH every become runs with, through the surrogate's sudoers entry.
ansible_surrogate_secure_path: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

docker_volume_backup_root: /mnt/Backups/Volumes
# The k3s restic server's repositories, one per namespace, as the hosts mount the Backups drive.
k3s_backup_root: /mnt/Backups/Restic
k3s_migrate_transit_dir: /mnt/Backups/migrate
# Where Homebridge's UI writes its nightly backups (its scheduledBackupPath), as the Linux hosts mount the share.
homebridge_backup_dir: /mnt/Backups/Homebridge/instance-backups
# A label whose host changed in [node_labels] moves only with k3s_migrate_labels.
k3s_migrate_labels: false
k3s_migrate_force: false
# The namespace whose k3s claims tags=k3s-restore puts back: all of them, or those listed with commas,
# each from its newest snapshot, or its newest from before a UTC time such as 2026-10-29T12:00.
k3s_restore_namespace: ""
k3s_restore_claims: ""
k3s_restore_before: ""
