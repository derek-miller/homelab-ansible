    token: "{{ influxdb3_write_token }}"
    organization: ""
    bucket: "{{ influxdb3_metrics_database }}"
    namedrop:
      - syslog
  - url: "{{ influxdb3_url }}"
    token: "{{ influxdb3_write_token }}"
    organization: ""
    bucket: "{{ influxdb3_logs_database }}"
    namepass:
      - syslog

