    body_file: node-red-notification-body.json
    headers:
      Content-Type: application/json
      X-Webhook-Token: "{{ '{{ secrets.token }}' }}"
    secrets:
      token: "{{ node_red_webhook_token }}"
  - name: discord
    url: "https://discord.com/api/webhooks/{{ '{{ secrets.token }}' }}"
    body_file: discord-notification-body.json
    headers:
      Content-Type: application/json
    secrets:
      token: "{{ proxmox_discord_webhook_token }}"

# The second matcher is the first inverted, so each notification goes out once. Backup logs and
# forwarded mail outgrow a Discord message, so they stay with node-red, which trims them.
proxmox_notification_matchers:
  - name: straight-to-discord
    comment: Replication, fencing and LAN watchdog warnings and errors
    match-severity: warning,error,unknown
    match-field: exact:type=replication,fencing,lan-watchdog
    target: discord
  - name: through-node-red
    comment: Everything straight-to-discord leaves
    match-severity: warning,error,unknown
    match-field: exact:type=replication,fencing,lan-watchdog
    invert-match: 1
    target: node-red
  # PVE re-injects this built-in whenever the file omits it, and it matches
  # everything. Overriding it disabled is the only way to retire it.
  - name: default-matcher
    comment: Superseded by the matchers above
    mode: all
    target: mail-to-root
    disable: 1

proxmox_ha_resources:
  - sid: vm:100
    state: started
    max_restart: 2
    max_relocate: 1
  # rackvm1, the k3s server and the public ingress.
  - sid: vm:201
    state: started
    max_restart: 2
    max_relocate: 1
# strict: only nodes holding a replica. Unrestricted, HA would try a node with
# no copy of the disks and the failover would fail.
# converge string-compares `nodes` against `ha-manager rules config`, and PVE
# re-encodes it sorted with falsy priorities dropped. Unsorted or `:0` never converges.
proxmox_ha_rules:
  - rule: vm100-nodes
    type: node-affinity
    resources: vm:100
    nodes: pve1:2,pve2:1
    strict: 1
  - rule: vm201-nodes
    type: node-affinity
    resources: vm:201
    nodes: pve1:2,pve2:1
    strict: 1

