---
k3s_server_host: "{{ groups['k3s_server'] | first }}"
k3s_server_address: "{{ hostvars[k3s_server_host].proxmox_guest.address | regex_replace('/.*$', '') }}"
k3s_node_ip: "{{ proxmox_guest.address | regex_replace('/.*$', '') }}"

# On the data disk beside Docker's data-root; the unit waits for its mount.
k3s_data_dir: /mnt/data/k3s
# Where the local-path provisioner makes each volume, as <namespace>/<claim>/data.
k3s_local_storage_path: /mnt/data/volumes

k3s_tls_san:
  - "{{ inventory_hostname }}.ts.{{ cloudflare_zone }}"

k3s_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          62303538613438646466343366313438656165653836333534653561396437656638383462316237
          3838363662316365343666613163333834613065613734350a636561333130646130316439313361
          36323738623632343465383461326433393537366538626138626666353337323536393065616433
          3237303865616364390a323461363162653933373832623863326262313866613938353533656236
          66623566623463356336363563613831646237313738646531613963346266393234613330356162
          65663336343363373235343261343563336635386232383237303862323632303165313932316435
          63373433343665613966333738346531393738396136353736343030386234343137626164623962
          34363737656563366264

# Apps name the images the build hosts make registry.homelab.local/<name>, which
# every node pulls from the image registry the k3s server's host_vars describe.
image_registry_name: registry.homelab.local
k3s_registries: >-
  {{ {'mirrors': {image_registry_name: {'endpoint': ['https://' ~ hostvars[k3s_server_host].image_registry_host]}},
      'configs': {hostvars[k3s_server_host].image_registry_host:
                    {'auth': {'username': 'k3s', 'password': hostvars[k3s_server_host].image_registry_pull_password}}}}
     if hostvars[k3s_server_host].image_registry_host is defined else {} }}
docker_build_images_registry: "{{ hostvars[k3s_server_host].image_registry_host | default('') }}"
docker_build_images_registry_username: builder
docker_build_images_registry_password: "{{ hostvars[k3s_server_host].image_registry_push_password | default('') }}"
