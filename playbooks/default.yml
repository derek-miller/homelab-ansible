---
- name: set up connection before gathering facts
  hosts: all
  gather_facts: no
  roles:
    - ansible/setup/connection
  tags:
    - always

- name: connect and gather facts
  hosts: all
  tasks:
    - name: node summary
      debug:
        msg: >-
          {{ ansible_all_ipv4_addresses | join(' ') }},
          {{ ansible_distribution }} {{ ansible_distribution_version }},
          {{ ansible_processor_vcpus }} CPU(s),
          {{ ansible_memtotal_mb }} MB memory
  tags:
    - always
    - connect

- name: bootstrap connection credentials
  hosts: all
  roles:
    - role: ansible/setup/bootstrap
      when: bootstrap|default(false)|bool
  tags:
    - bootstrap

- name: set up ansible environment on remote
  hosts: all
  roles:
    - ansible/remote
  tags:
    - always
    - base-setup  # not part of base tag since really a setup task but needs apt mirrors, etc. from previous base plays
    - ansible-remote

- name: common
  hosts: all
  roles:
    - common
  tags:
    - always
    - base
    - common

- name: telegraf
  hosts: all
  roles:
    - role: generic/telegraf
    - role: generic/telegraf-syslog
  tags:
    - telegraf

- hosts: raspberry-pi
  roles:
    - role: generic/raspberry-pi
  tags:
    - raspberry-pi

- hosts: tailscale
  # A failure later in the play must not drop a pending tailscaled restart: a
  # later run sees nothing changed and never restarts it.
  force_handlers: true
  roles:
    - role: generic/tailscale
  tasks:
    - name: publish the tailscale addresses
      when: tailscale_state == 'present' and not ansible_check_mode
      block:
        - name: add Cloudflare DNS record for tailscale ipv4 address
          community.general.cloudflare_dns:
            zone: "{{ cloudflare_zone }}"
            account_email: "{{ cloudflare_email }}"
            account_api_token: "{{ cloudflare_api_key }}"
            type: "A"
            record: "{{ inventory_hostname }}.ts"
            value: "{{ tailscale_node_ipv4 }}"
            ttl: 1
            proxied: no
            solo: yes
          when: create_cloudflare_ipv4_dns_record is defined and create_cloudflare_ipv4_dns_record is truthy
        - name: add Cloudflare DNS record for tailscale ipv6 address
          community.general.cloudflare_dns:
            zone: "{{ cloudflare_zone }}"
            account_email: "{{ cloudflare_email }}"
            account_api_token: "{{ cloudflare_api_key }}"
            type: "AAAA"
            record: "{{ inventory_hostname }}.ts"
            value: "{{ tailscale_node_ipv6 }}"
            ttl: 1
            proxied: no
            solo: yes
          when: create_cloudflare_ipv6_dns_record is defined and create_cloudflare_ipv6_dns_record is truthy
    - name: remove the tailscale DNS records
      when: tailscale_state == 'absent'
      block:
        - name: remove Cloudflare DNS record for tailscale ipv4 address
          community.general.cloudflare_dns:
            zone: "{{ cloudflare_zone }}"
            account_email: "{{ cloudflare_email }}"
            account_api_token: "{{ cloudflare_api_key }}"
            type: "A"
            record: "{{ inventory_hostname }}.ts"
            state: absent
          when: create_cloudflare_ipv4_dns_record is defined and create_cloudflare_ipv4_dns_record is truthy
        - name: remove Cloudflare DNS record for tailscale ipv6 address
          community.general.cloudflare_dns:
            zone: "{{ cloudflare_zone }}"
            account_email: "{{ cloudflare_email }}"
            account_api_token: "{{ cloudflare_api_key }}"
            type: "AAAA"
            record: "{{ inventory_hostname }}.ts"
            state: absent
          when: create_cloudflare_ipv6_dns_record is defined and create_cloudflare_ipv6_dns_record is truthy
  tags:
    - tailscale

- hosts: smb-shares
  roles:
    - role: generic/smb-mount
      smb_share_host: "{{ smb_share_configs[smb_share_config].host }}"
      smb_share_username: "{{ smb_share_configs[smb_share_config].username }}"
      smb_share_password: "{{ smb_share_configs[smb_share_config].password }}"
      smb_mount_options: "{{ smb_share_configs[smb_share_config].mount_options }}"
      smb_mount_dir: /mnt
  tags:
    - smb-mount
    - smb-shares

- hosts: project-files
  roles:
    - role: generic/project-files
  tags:
    - project-files

- hosts: disk-mounts
  roles:
    - role: generic/disk-mount
  tags:
    - disk-mount

- hosts: docker
  pre_tasks:
    - name: read the installed Docker Engine version
      command: dpkg-query -W -f=${Version} docker-ce
      register: _docker_engine_installed
      changed_when: false
      failed_when: false
      check_mode: no
      tags:
        - docker-daemon

    # dockerd refuses to start on a daemon.json key it does not know, and the
    # role below restarts it on every node at once.
    - name: the installed engine must understand default-stop-timeout
      assert:
        that: >-
          'default-stop-timeout' not in (docker_daemon_options | default({}))
          or _docker_engine_installed.rc != 0
          or (_docker_engine_installed.stdout | regex_replace('^[0-9]+:', '') | regex_replace('-.*$', ''))
             is version('29.7.0', '>=')
        fail_msg: >-
          {{ inventory_hostname }} runs docker-ce {{ _docker_engine_installed.stdout }}, which has no
          default-stop-timeout. Upgrade it with the docker-upgrade play (RUNBOOK.md) first.
        quiet: yes
      tags:
        - docker-daemon
  roles:
    - role: galaxy/docker
      # Necessary so telegraf can read from the socket
      docker_users: "{{ additional_docker_users|default([]) + ['telegraf'] }}"
      tags:
        - docker-daemon
    - role: generic/docker-stats
      docker_stats_state: "{{ 'present' if docker_service_enabled else 'absent' }}"
      tags:
        - docker-stats
  post_tasks:
    - name: give docker.service longer to stop than its containers get
      when: "'default-stop-timeout' in (docker_daemon_options | default({}))"
      block:
        - name: create the docker.service drop-in directory
          file:
            path: /etc/systemd/system/docker.service.d
            state: directory
            mode: '0755'

        - name: set docker.service's stop timeout
          copy:
            dest: /etc/systemd/system/docker.service.d/stop-timeout.conf
            content: |
              [Service]
              TimeoutStopSec={{ docker_daemon_options['default-stop-timeout'] | int + 60 }}
            mode: '0644'
          register: _docker_stop_timeout_dropin
      tags:
        - docker-daemon

    - name: remove docker.service's stop timeout
      file:
        path: /etc/systemd/system/docker.service.d/stop-timeout.conf
        state: absent
      register: _docker_stop_timeout_removed
      when: "'default-stop-timeout' not in (docker_daemon_options | default({}))"
      tags:
        - docker-daemon

    - name: reload systemd units
      systemd:
        daemon_reload: yes
      when: >-
        (_docker_stop_timeout_dropin is changed)
        or (_docker_stop_timeout_removed is changed)
      tags:
        - docker-daemon
  tags:
    - docker

# Rolling Docker Engine upgrade of the swarm, run only on request (RUNBOOK.md).
# It writes daemon.json itself rather than through galaxy/docker, whose restart
# handler would bounce the node again after it is back in service.
- hosts: docker_swarm_worker:docker_swarm_manager
  serial: 1
  order: reverse_sorted
  any_errors_fatal: true
  vars:
    _docker_upgrade_peer: >-
      {{ groups['docker_swarm_manager'] | reject('equalto', inventory_hostname)
         | select('in', ansible_play_hosts_all) | first | default('') }}
    _docker_upgrade_stack: "{{ hostvars[groups['docker_swarm_manager'][0]].docker_stack_name }}"
    _docker_upgrade_ignore: >-
      {{ docker_upgrade_ignore_services | default([])
         | map('regex_escape') | map('regex_replace', '^', _docker_upgrade_stack ~ '_') | join('|') }}
    _docker_upgrade_ignore_names: >-
      {{ docker_upgrade_ignore_services | default([])
         | map('regex_replace', '^', _docker_upgrade_stack ~ '_') | join(' ') }}
    _docker_upgrade_daemon_json: "{{ docker_daemon_options | default({}) | to_nice_json }}"
    # A task waiting out its restart delay is desired-state ready, not running.
    _docker_upgrade_tasks_cmd: >-
      docker node ps {{ inventory_hostname }}
      --filter desired-state=running --filter desired-state=ready
      --format '{% raw %}{{.Name}}|{{.CurrentState}}|{{.ID}}{% endraw %}'
    # Upgrading any of these restarts dockerd; the plugins below do not.
    docker_upgrade_packages:
      - docker-ce
      - docker-ce-cli
      - docker-ce-rootless-extras
      - containerd.io
    docker_upgrade_plugin_packages:
      - docker-buildx-plugin
      - docker-compose-plugin
  tasks:
    - name: another swarm manager must be in this run
      assert:
        that: _docker_upgrade_peer | length > 0
        fail_msg: >-
          {{ inventory_hostname }} is drained and made active again through another swarm
          manager, but none is in this run. Add one to hosts=.
        quiet: yes

    - name: refresh the apt cache
      apt:
        update_cache: yes

    - name: upgrade the Docker CLI plugins in place
      apt:
        name: "{{ docker_upgrade_plugin_packages }}"
        state: latest

    - name: list engine packages with a newer version available
      shell: >-
        apt-get -s install --only-upgrade {{ docker_upgrade_packages | join(' ') }}
        | awk '/^Inst /{print $2}'
      register: _docker_upgradable
      changed_when: false
      check_mode: no

    - name: read daemon.json
      slurp:
        src: /etc/docker/daemon.json
      register: _docker_daemon_json
      failed_when: false

    - name: every swarm node is ready, every manager reachable, and none but this one is drained
      command: >-
        docker node ls
        --format '{% raw %}{{.Hostname}} {{.ManagerStatus}} {{.Status}} {{.Availability}}{% endraw %}'
      register: _docker_upgrade_nodes
      changed_when: false
      check_mode: no
      delegate_to: "{{ _docker_upgrade_peer }}"
      failed_when: >-
        _docker_upgrade_nodes.rc != 0
        or (_docker_upgrade_nodes.stdout_lines | reject('search', ' Ready ') | list | length > 0)
        or (_docker_upgrade_nodes.stdout_lines | select('search', ' Unreachable ') | list | length > 0)
        or (_docker_upgrade_nodes.stdout_lines | reject('match', inventory_hostname ~ ' ')
            | reject('search', ' Active$') | list | length > 0)

    - name: report what this node needs
      debug:
        msg: >-
          {{ inventory_hostname }}: engine packages to upgrade:
          {{ _docker_upgradable.stdout_lines | join(', ') or 'none' }};
          daemon.json {{ 'up to date' if (_docker_daemon_json.content | default('') | b64decode)
          == _docker_upgrade_daemon_json else 'to be rewritten' }}

    - name: skip a node that is already up to date
      meta: end_host
      when:
        - _docker_upgradable.stdout_lines | length == 0
        - (_docker_daemon_json.content | default('') | b64decode) == _docker_upgrade_daemon_json
        - _docker_upgrade_nodes.stdout_lines | select('match', inventory_hostname ~ ' ')
          | select('search', ' Active$') | list | length > 0

    - name: stop here in a dry run
      meta: end_host
      when: ansible_check_mode

    - name: drain the node
      command: "docker node update --availability drain {{ inventory_hostname }}"
      delegate_to: "{{ _docker_upgrade_peer }}"

    - name: wait for the node's tasks to stop
      command: "docker node ps {{ inventory_hostname }} --filter desired-state=running -q"
      register: _docker_upgrade_running
      changed_when: false
      delegate_to: "{{ _docker_upgrade_peer }}"
      until: _docker_upgrade_running.stdout | trim | length == 0
      retries: 30
      delay: 10

    - name: wait for the node's task containers to exit
      command: docker ps -q --filter label=com.docker.swarm.task
      register: _docker_upgrade_containers
      changed_when: false
      until: _docker_upgrade_containers.stdout | trim | length == 0
      retries: 30
      delay: 5

    - name: upgrade the Docker engine packages
      apt:
        name: "{{ docker_upgrade_packages }}"
        state: latest

    - name: read the upgraded Docker Engine version
      command: dpkg-query -W -f=${Version} docker-ce
      register: _docker_upgraded
      changed_when: false

    - name: the upgraded engine must understand default-stop-timeout
      assert:
        that: >-
          'default-stop-timeout' not in (docker_daemon_options | default({}))
          or (_docker_upgraded.stdout | regex_replace('^[0-9]+:', '') | regex_replace('-.*$', ''))
             is version('29.7.0', '>=')
        fail_msg: "{{ inventory_hostname }} is still on docker-ce {{ _docker_upgraded.stdout }}."
        quiet: yes

    - name: write daemon.json
      copy:
        content: "{{ _docker_upgrade_daemon_json }}"
        dest: /etc/docker/daemon.json
        mode: '0644'
      when: docker_daemon_options | default({}) | length > 0

    - name: restart Docker
      systemd:
        name: docker
        state: restarted
        daemon_reload: yes

    - name: wait for Docker to rejoin the swarm
      command: docker info --format '{% raw %}{{.Swarm.LocalNodeState}}{% endraw %}'
      register: _docker_upgrade_swarm
      changed_when: false
      until: _docker_upgrade_swarm.stdout | trim == 'active'
      retries: 30
      delay: 5

    - name: wait for the manager to see the node ready
      command: "docker node inspect {{ inventory_hostname }} --format '{% raw %}{{.Status.State}}{% endraw %}'"
      register: _docker_upgrade_state
      changed_when: false
      delegate_to: "{{ _docker_upgrade_peer }}"
      until: _docker_upgrade_state.stdout | trim == 'ready'
      retries: 30
      delay: 5

    - name: make the node active
      command: "docker node update --availability active {{ inventory_hostname }}"
      delegate_to: "{{ _docker_upgrade_peer }}"

    - name: wait for the node's tasks to be running
      command: "{{ _docker_upgrade_tasks_cmd }}"
      register: _docker_upgrade_tasks
      changed_when: false
      delegate_to: "{{ _docker_upgrade_peer }}"
      until: >-
        _docker_upgrade_tasks.stdout_lines | length > 0
        and (_docker_upgrade_tasks.stdout_lines
             | reject('match', '^(' ~ _docker_upgrade_ignore ~ ')\.')
             | reject('search', '\|Running ')
             | list | length == 0)
      retries: 60
      delay: 10

    # A crash-looping task replaces itself with a new task ID on each restart.
    # One that restarts while its dependencies come up (oauth2-proxy while
    # Keycloak starts) settles within a few rounds; a crash loop never does.
    - name: wait for the node's tasks to stay up for 30 s
      shell: |
        set -o pipefail
        list() {
          {{ _docker_upgrade_tasks_cmd }} \
            | awk -F'|' -v ign=' {{ _docker_upgrade_ignore_names }} ' \
                '{ split($1, p, "."); if (index(ign, " " p[1] " ") == 0) print }' \
            | sort
        }
        before=$(list) || { echo "could not list the node's tasks"; exit 0; }
        sleep 30
        after=$(list) || { echo "could not list the node's tasks"; exit 0; }
        printf '%s\n' "$after" | grep -v '|Running ' || true
        [ "$(printf '%s\n' "$before" | cut -d'|' -f3)" = "$(printf '%s\n' "$after" | cut -d'|' -f3)" ] \
          || echo "a task was replaced within 30 s"
      args:
        executable: /bin/bash
      register: _docker_upgrade_settled
      changed_when: false
      delegate_to: "{{ _docker_upgrade_peer }}"
      until: _docker_upgrade_settled.stdout | trim | length == 0
      retries: 5
      delay: 1

    - name: report the node's engine version
      debug:
        msg: "{{ inventory_hostname }}: docker-ce {{ _docker_upgraded.stdout }}"
  tags:
    - never
    - docker-upgrade

- hosts: docker
  tasks:
    - name: log in to Docker Hub
      community.docker.docker_login:
        username: "{{ docker_hub_username }}"
        password: "{{ docker_hub_password }}"
      when: docker_hub_username is defined and docker_hub_password is defined
    - name: log out of Docker Hub
      community.docker.docker_login:
        state: absent
      when: docker_hub_username is not defined or docker_hub_password is not defined
  tags:
    - docker
    - docker-swarm
    - docker-compose
    - docker-build-images

- hosts: docker_swarm_manager:docker_swarm_worker
  roles:
    - role: generic/docker/swarm
  tags:
    - docker
    - docker-swarm
    - docker-migrate-labels

- hosts: docker
  pre_tasks:
    # [docker] also holds the non-swarm compose Pis (no drain, no manager), so
    # only guard when the run holds a swarm node. Play-wide, not group_names:
    # the assert is run_once, so a per-host test would read only the first host.
    - name: a swarm manager must be in this run to restore a swarm node
      assert:
        that: groups['docker_swarm_manager'] | intersect(ansible_play_hosts) | length > 0
        fail_msg: >-
          Restoring a swarm node drains it through a manager, but no swarm manager
          is in this run. Add one to hosts=: the node itself if it is a manager,
          otherwise a manager alongside it.
        quiet: yes
      run_once: yes
      when:
        - docker_restore_volumes | default(false) | bool
        - (groups['docker_swarm_manager'] + groups['docker_swarm_worker'])
          | intersect(ansible_play_hosts) | length > 0

    - name: drain node before volume restore
      command: "docker node update --availability drain {{ inventory_hostname }}"
      delegate_to: "{{ docker_swarm_delegate_manager }}"
      when:
        - docker_restore_volumes | default(false) | bool
        - "'docker_swarm_manager' in group_names or 'docker_swarm_worker' in group_names"
  roles:
    - role: generic/docker/restore-volumes
      when: docker_restore_volumes | default(false) | bool
  post_tasks:
    - name: activate node after volume restore
      command: "docker node update --availability active {{ inventory_hostname }}"
      delegate_to: "{{ docker_swarm_delegate_manager }}"
      when:
        - docker_restore_volumes | default(false) | bool
        - "'docker_swarm_manager' in group_names or 'docker_swarm_worker' in group_names"
  tags:
    - docker
    - docker-restore-volumes

- hosts: docker-build-images
  roles:
    - role: generic/docker/build-images
  tags:
    - docker
    - docker-build-images

- hosts: docker_swarm_manager[0]
  tasks:
    - name: deploy docker stack
      when: docker_stack_definition is defined
      docker_stack:
        state: "{{ docker_stack_state|default('present') }}"
        name: "{{ docker_stack_name|default(inventory_hostname) }}"
        prune: yes
        compose:
          - "{{ docker_stack_definition }}"
      # A service the build play just restarted can still be finishing its
      # update, and swarm rejects a write made against the version read before.
      register: _stack_deploy
      until: _stack_deploy is succeeded or 'out of sequence' not in (_stack_deploy.stderr | default(''))
      retries: 3
      delay: 15
      tags:
        - docker-stack

  tags:
    - docker
    - docker-swarm

- hosts: docker
  tasks:
    - name: retry compose containers whose last start failed
      when: docker_compose_definition is defined
      block:
        - name: install docker-compose-retry.service
          copy:
            dest: /etc/systemd/system/docker-compose-retry.service
            content: |
              [Unit]
              Description=Start compose containers whose last start failed
              After=docker.service

              [Service]
              Type=oneshot
              ExecStart=/bin/sh -c 'for c in $$(docker ps -aq --filter label=com.docker.compose.project --filter status=exited --filter status=created); do [ -n "$$(docker inspect --format "{% raw %}{{.State.Error}}{% endraw %}" $$c)" ] && docker start $$c; done; true'
            mode: '0644'

        - name: install docker-compose-retry.timer
          copy:
            dest: /etc/systemd/system/docker-compose-retry.timer
            content: |
              [Unit]
              Description=Start compose containers whose last start failed

              [Timer]
              OnBootSec=5min
              OnUnitActiveSec=15min

              [Install]
              WantedBy=timers.target
            mode: '0644'
          register: _compose_retry_timer

        - name: enable docker-compose-retry.timer
          systemd:
            name: docker-compose-retry.timer
            state: started
            enabled: yes
            daemon_reload: yes
          when: not (ansible_check_mode and _compose_retry_timer is changed)

    - name: create docker containers
      when: docker_compose_definition is defined
      block:
        - name: create docker containers (parallel pull)
          community.docker.docker_compose_v2:
            docker_cli: "{{ docker_cli|default(omit) }}"
            state: "{{ docker_compose_state|default('present') }}"
            remove_images: all
            remove_volumes: yes
            remove_orphans: yes
            project_name: "{{ docker_compose_project_name|default(inventory_hostname) }}"
            definition: "{{ docker_compose_definition }}"
            pull: always
      rescue:
        - name: fail if not a rate limit error
          fail:
            msg: "{{ ansible_failed_result.msg }}"
          when: "'toomanyrequests' not in (ansible_failed_result.msg | default(''))"

        - name: pull docker images sequentially (rate limit fallback)
          community.docker.docker_image:
            name: "{{ item.value.image }}"
            source: pull
            force_source: true
          loop: "{{ docker_compose_definition.services | dict2items }}"
          loop_control:
            label: "{{ item.value.image }}"
            pause: 5
          retries: 3
          delay: 60
          register: docker_pull_result
          until: docker_pull_result is not failed

        - name: create docker containers (images pre-pulled)
          community.docker.docker_compose_v2:
            docker_cli: "{{ docker_cli|default(omit) }}"
            state: "{{ docker_compose_state|default('present') }}"
            remove_images: all
            remove_volumes: yes
            remove_orphans: yes
            project_name: "{{ docker_compose_project_name|default(inventory_hostname) }}"
            definition: "{{ docker_compose_definition }}"
            pull: never
  tags:
    - docker
    - docker-compose

- name: prune unused docker resources
  hosts: docker
  tasks:
    - name: prune stopped containers, unused images, networks, and volumes
      community.docker.docker_prune:
        containers: yes
        images: yes
        images_filters:
          dangling: "false"
          # Local builds can't be pulled back, and one may be unused right now:
          # a one-shot job between runs, a runner between jobs, or a rebuild
          # whose service hasn't restarted yet. They're pruned below instead.
          "label!": homelab.local-build
        networks: yes
        volumes: yes
        builder_cache: yes
        timeout: 300
    - name: list local builds and the containers using them
      community.docker.docker_host_info:
        images: yes
        images_filters:
          label: homelab.local-build
        containers: yes
        containers_all: yes
        verbose_output: yes
      register: _local_builds
    - name: remove local builds that are neither latest nor in use
      community.docker.docker_image_remove:
        name: "{{ item.Id }}"
        force: yes
      loop: >-
        {{ _local_builds.images
           | rejectattr('Id', 'in', _local_builds.containers | map(attribute='ImageID') | list) | list }}
      loop_control:
        label: "{{ item.RepoTags | default([], true) | join(',') or item.Id }}"
      when: item.RepoTags | default([], true) | select('search', ':latest$') | list | length == 0
  tags:
    - docker
    - docker-prune

- hosts: k3s_server
  roles:
    - role: generic/k3s
    - role: generic/flux
      tags:
        - flux
  tags:
    - k3s

- hosts: k3s_agent
  serial: 1
  roles:
    - role: generic/k3s
  tags:
    - k3s

- hosts: control4-driver-scraper
  roles:
    - role: generic/control4-driver-scraper
  tags:
    - control4-driver-scraper

- hosts: control4-director-stats
  roles:
    - role: generic/control4-director-stats
  tags:
    - control4-director-stats

- hosts: vnc
  roles:
    - role: generic/vnc
  tags:
    - vnc

- hosts: network-ups-tools
  roles:
    - role: generic/network-ups-tools
    - role: generic/network-ups-tools-stats
  tags:
    - network-ups-tools

- hosts: tplink-plug-stats
  roles:
    - role: generic/tplink-plug-stats
  tags:
    - tplink-plug-stats

- hosts: volume-backup-stats
  roles:
    - role: generic/volume-backup-stats
  tags:
    - volume-backup-stats

- hosts: qemu-guest-agent
  roles:
    - role: generic/qemu-guest-agent
  tags:
    - qemu-guest-agent

# After the shares, since Homebridge reads its TLS cert from one at startup.
# Near the end because these groups hold one host: a failure there fails the
# whole play, which would stop the run before the fleet-wide plays.
- hosts: homebridge
  roles:
    - role: generic/homebridge
  tags:
    - homebridge

- hosts: plex
  roles:
    - role: generic/plex
  tags:
    - plex

# Last, so a host whose image kept its previous build still ran everything else.
- name: report images that kept their previous build
  hosts: docker-build-images
  gather_facts: no
  tasks:
    - name: fail if an image could not be rebuilt
      fail:
        msg: >-
          {{ docker_build_images_failed | join(', ') }} kept the previous build;
          the error is further up.
      when: docker_build_images_failed | default([]) | length > 0
  tags:
    - docker
    - docker-build-images
