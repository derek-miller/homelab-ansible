---
- name: set up connection before gathering facts
  hosts: all
  gather_facts: no
  roles:
    - ansible/setup/connection
  tags:
    - always

- name: connect and gather facts
  hosts: all
  tasks:
    - name: node summary
      debug:
        msg: >-
          {{ ansible_all_ipv4_addresses | join(' ') }},
          {{ ansible_distribution }} {{ ansible_distribution_version }},
          {{ ansible_processor_vcpus }} CPU(s),
          {{ ansible_memtotal_mb }} MB memory
  tags:
    - always
    - connect

- name: bootstrap connection credentials
  hosts: all
  roles:
    - role: ansible/setup/bootstrap
      when: bootstrap|default(false)|bool
  tags:
    - bootstrap

- name: set up ansible environment on remote
  hosts: all
  roles:
    - ansible/remote
  tags:
    - always
    - base-setup  # not part of base tag since really a setup task but needs apt mirrors, etc. from previous base plays
    - ansible-remote

- name: common
  hosts: all
  roles:
    - common
  tags:
    - always
    - base
    - common

- name: telegraf
  hosts: all
  roles:
    - role: generic/telegraf
    - role: generic/telegraf-syslog
  tags:
    - telegraf

- hosts: raspberry-pi
  roles:
    - role: generic/raspberry-pi
  tags:
    - raspberry-pi

- hosts: tailscale
  # A failure later in the play must not drop a pending tailscaled restart: a
  # later run sees nothing changed and never restarts it.
  force_handlers: true
  roles:
    - role: generic/tailscale
  tasks:
    - name: publish the tailscale addresses
      when: tailscale_state == 'present' and not ansible_check_mode
      block:
        - name: add Cloudflare DNS record for tailscale ipv4 address
          community.general.cloudflare_dns:
            zone: "{{ cloudflare_zone }}"
            account_email: "{{ cloudflare_email }}"
            account_api_token: "{{ cloudflare_api_key }}"
            type: "A"
            record: "{{ inventory_hostname }}.ts"
            value: "{{ tailscale_node_ipv4 }}"
            ttl: 1
            proxied: no
            solo: yes
          when: create_cloudflare_ipv4_dns_record is defined and create_cloudflare_ipv4_dns_record is truthy
        - name: add Cloudflare DNS record for tailscale ipv6 address
          community.general.cloudflare_dns:
            zone: "{{ cloudflare_zone }}"
            account_email: "{{ cloudflare_email }}"
            account_api_token: "{{ cloudflare_api_key }}"
            type: "AAAA"
            record: "{{ inventory_hostname }}.ts"
            value: "{{ tailscale_node_ipv6 }}"
            ttl: 1
            proxied: no
            solo: yes
          when: create_cloudflare_ipv6_dns_record is defined and create_cloudflare_ipv6_dns_record is truthy
    - name: remove the tailscale DNS records
      when: tailscale_state == 'absent'
      block:
        - name: remove Cloudflare DNS record for tailscale ipv4 address
          community.general.cloudflare_dns:
            zone: "{{ cloudflare_zone }}"
            account_email: "{{ cloudflare_email }}"
            account_api_token: "{{ cloudflare_api_key }}"
            type: "A"
            record: "{{ inventory_hostname }}.ts"
            state: absent
          when: create_cloudflare_ipv4_dns_record is defined and create_cloudflare_ipv4_dns_record is truthy
        - name: remove Cloudflare DNS record for tailscale ipv6 address
          community.general.cloudflare_dns:
            zone: "{{ cloudflare_zone }}"
            account_email: "{{ cloudflare_email }}"
            account_api_token: "{{ cloudflare_api_key }}"
            type: "AAAA"
            record: "{{ inventory_hostname }}.ts"
            state: absent
          when: create_cloudflare_ipv6_dns_record is defined and create_cloudflare_ipv6_dns_record is truthy
  tags:
    - tailscale

- hosts: smb-shares
  roles:
    - role: generic/smb-mount
      smb_share_host: "{{ smb_share_configs[smb_share_config].host }}"
      smb_share_username: "{{ smb_share_configs[smb_share_config].username }}"
      smb_share_password: "{{ smb_share_configs[smb_share_config].password }}"
      smb_mount_options: "{{ smb_share_configs[smb_share_config].mount_options }}"
      smb_mount_dir: /mnt
  tags:
    - smb-mount
    - smb-shares

- hosts: project-files
  roles:
    - role: generic/project-files
  tags:
    - project-files

- hosts: disk-mounts
  roles:
    - role: generic/disk-mount
  tags:
    - disk-mount

- hosts: docker
  roles:
    - role: galaxy/docker
      # Necessary so telegraf can read from the socket
      docker_users: "{{ additional_docker_users|default([]) + ['telegraf'] }}"
      docker_packages_state: latest
      docker_compose_package_state: latest
      tags:
        - docker-daemon
    - role: generic/docker-stats
      docker_stats_state: "{{ 'present' if docker_service_enabled else 'absent' }}"
      tags:
        - docker-stats
  tags:
    - docker

- hosts: docker
  tasks:
    - name: log in to Docker Hub
      community.docker.docker_login:
        username: "{{ docker_hub_username }}"
        password: "{{ docker_hub_password }}"
      when: docker_hub_username is defined and docker_hub_password is defined
    - name: log out of Docker Hub
      community.docker.docker_login:
        state: absent
      when: docker_hub_username is not defined or docker_hub_password is not defined
  tags:
    - docker
    - docker-compose
    - docker-build-images

- hosts: k3s_server
  any_errors_fatal: true
  tasks:
    - import_role:
        name: generic/flux
        tasks_from: migrate.yml
      when: docker_migrate_labels | bool
  tags:
    - k3s-migrate-labels

- hosts: docker
  roles:
    - role: generic/docker/restore-volumes
      when: docker_restore_volumes | default(false) | bool
  tags:
    - docker
    - docker-restore-volumes

- hosts: docker-build-images
  roles:
    - role: generic/docker/build-images
  tags:
    - docker
    - docker-build-images

- hosts: docker
  roles:
    - role: generic/docker/compose-retry
      docker_compose_retry_state: "{{ 'present' if docker_compose_definition is defined else 'absent' }}"
  tasks:
    - name: create docker containers
      when: docker_compose_definition is defined
      block:
        - name: create docker containers (parallel pull)
          community.docker.docker_compose_v2:
            docker_cli: "{{ docker_cli|default(omit) }}"
            state: "{{ docker_compose_state|default('present') }}"
            remove_images: all
            remove_volumes: yes
            remove_orphans: yes
            project_name: "{{ docker_compose_project_name|default(inventory_hostname) }}"
            definition: "{{ docker_compose_definition }}"
            pull: always
      rescue:
        - name: fail if not a rate limit error
          fail:
            msg: "{{ ansible_failed_result.msg }}"
          when: "'toomanyrequests' not in (ansible_failed_result.msg | default(''))"

        - name: pull docker images sequentially (rate limit fallback)
          community.docker.docker_image:
            name: "{{ item.value.image }}"
            source: pull
            force_source: true
          loop: "{{ docker_compose_definition.services | dict2items }}"
          loop_control:
            label: "{{ item.value.image }}"
            pause: 5
          retries: 3
          delay: 60
          register: docker_pull_result
          until: docker_pull_result is not failed

        - name: create docker containers (images pre-pulled)
          community.docker.docker_compose_v2:
            docker_cli: "{{ docker_cli|default(omit) }}"
            state: "{{ docker_compose_state|default('present') }}"
            remove_images: all
            remove_volumes: yes
            remove_orphans: yes
            project_name: "{{ docker_compose_project_name|default(inventory_hostname) }}"
            definition: "{{ docker_compose_definition }}"
            pull: never
  tags:
    - docker
    - docker-compose

- name: prune unused docker resources
  hosts: docker
  tasks:
    - name: prune stopped containers, unused images, networks, and volumes
      community.docker.docker_prune:
        containers: yes
        images: yes
        images_filters:
          dangling: "false"
          # Local builds can't be pulled back, and one may be unused right now:
          # a one-shot job between runs, or a rebuild whose service hasn't
          # restarted yet. They're pruned below instead.
          "label!": homelab.local-build
        networks: yes
        volumes: yes
        builder_cache: yes
        timeout: 300
    - name: list local builds and the containers using them
      community.docker.docker_host_info:
        images: yes
        images_filters:
          label: homelab.local-build
        containers: yes
        containers_all: yes
        verbose_output: yes
      register: _local_builds
    - name: remove local builds that are neither latest nor in use
      community.docker.docker_image_remove:
        name: "{{ item.Id }}"
        force: yes
      loop: >-
        {{ _local_builds.images
           | rejectattr('Id', 'in', _local_builds.containers | map(attribute='ImageID') | list) | list }}
      loop_control:
        label: "{{ item.RepoTags | default([], true) | reject('search', '/') | join(',') or item.Id }}"
      when: item.RepoTags | default([], true) | select('search', ':latest$') | list | length == 0
  tags:
    - docker
    - docker-prune

- hosts: k3s_server
  roles:
    - role: generic/k3s
    - role: generic/k3s-stats
      tags:
        - k3s-stats
  tags:
    - k3s

- hosts: k3s_agent
  serial: 1
  roles:
    - role: generic/k3s
    - role: generic/k3s-stats
      tags:
        - k3s-stats
  tags:
    - k3s

# After the agents, so a node that joins in this run has its labels before the apps go on.
- hosts: k3s_server
  roles:
    - role: generic/flux
  tags:
    - k3s
    - flux

- hosts: k3s_server
  tasks:
    - import_role:
        name: generic/flux
        tasks_from: restore.yml
      when: not ansible_check_mode
  tags:
    - never
    - k3s-restore

- hosts: control4-director-stats
  roles:
    - role: generic/control4-director-stats
  tags:
    - control4-director-stats

- hosts: vnc
  roles:
    - role: generic/vnc
  tags:
    - vnc

- hosts: network-ups-tools
  roles:
    - role: generic/network-ups-tools
    - role: generic/network-ups-tools-stats
  tags:
    - network-ups-tools

- hosts: tplink-plug-stats
  roles:
    - role: generic/tplink-plug-stats
  tags:
    - tplink-plug-stats

- hosts: volume-backup-stats
  roles:
    - role: generic/volume-backup-stats
  tags:
    - volume-backup-stats

- hosts: qemu-guest-agent
  roles:
    - role: generic/qemu-guest-agent
  tags:
    - qemu-guest-agent

# After the shares, since Homebridge reads its TLS cert from one at startup.
# Near the end because these groups hold one host: a failure there fails the
# whole play, which would stop the run before the fleet-wide plays.
- hosts: homebridge
  roles:
    - role: generic/homebridge
  tags:
    - homebridge

- hosts: plex
  roles:
    - role: generic/plex
  tags:
    - plex

- hosts: openclaw
  roles:
    - role: generic/openclaw
  tags:
    - openclaw

- hosts: nodenv
  roles:
    - role: generic/nodenv
  tags:
    - nodenv

# Last, so a host whose image kept its previous build still ran everything else.
- name: report images that kept their previous build
  hosts: docker-build-images
  gather_facts: no
  tasks:
    - name: fail if an image could not be rebuilt
      fail:
        msg: >-
          {{ docker_build_images_failed | join(', ') }} kept the previous build;
          the error is further up.
      when: docker_build_images_failed | default([]) | length > 0

    - name: fail if an image could not be pushed
      fail:
        msg: >-
          {{ docker_build_images_push_failed | join(', ') }} did not reach the image
          registry; as root on this host, docker login and docker push say why.
      when: docker_build_images_push_failed | default([]) | length > 0
  tags:
    - docker
    - docker-build-images
