---
- name: configure hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: additional authorized ssh keys
  authorized_key:
    user: "{{ item.user }}"
    key: "{{ item.key }}"
    state: "{{ item.state|default('present') }}"
  with_items: "{{ authorized_keys|default([]) }}"

- name: additional sudoers
  template:
    src: sudoers.d/ansible-managed.jinja2
    dest: "/etc/sudoers.d/ansible-managed"
    owner: root
    group: "{{ root_group }}"
    mode: 0440
    validate: "{{ 'visudo -cf %s' }}"
  when: sudoers|default([])|length > 0

- name: delete additional sudoers file
  file:
    path: "/etc/sudoers.d/ansible-managed"
    state: absent
  when: sudoers|default([])|length == 0

- name: update time zone database (apt)
  apt:
    name: tzdata
    state: latest
  notify: restart cron
  when: ansible_os_family == 'Debian'

- name: set time zone
  timezone:
    name: "{{ timezone }}"
  notify: restart cron
  when: timezone != ''

- name: update apt cache
  apt:
    update_cache: yes
  register: result
  until: result is succeeded
  changed_when: false
  when: ansible_os_family == 'Debian'

# The homebrew module turns off Homebrew's own auto-update, so without this
# its state: latest compares against a stale index and never upgrades.
- name: update homebrew metadata
  command: brew update
  become_user: "{{ mac_user }}"
  register: result
  until: result is succeeded
  changed_when: false
  when: ansible_os_family == 'Darwin'

- name: install common packages (apt)
  apt:
    name: "{{ common_pkgs.apt }}"
    state: present
  when: ansible_os_family == 'Debian'

- name: install common packages (homebrew)
  community.general.homebrew:
    name: "{{ common_pkgs.homebrew }}"
    state: present
  become_user: "{{ mac_user }}"
  when: ansible_os_family == 'Darwin'

- meta: flush_handlers
