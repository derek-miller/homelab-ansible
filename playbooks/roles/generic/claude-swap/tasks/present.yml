---
- name: install uv
  community.general.homebrew:
    name: uv
    state: latest
  become_user: "{{ claude_swap_user }}"

- name: install claude-swap
  command: "{{ claude_swap_uv_bin }} tool install claude-swap"
  args:
    creates: "{{ claude_swap_cswap_bin }}"
  become_user: "{{ claude_swap_user }}"
  notify: reload claude-swap-notify

- name: upgrade claude-swap
  command: "{{ claude_swap_uv_bin }} tool upgrade claude-swap"
  register: _cs_upgrade
  changed_when: "'Updated claude-swap' in _cs_upgrade.stderr + _cs_upgrade.stdout"
  become_user: "{{ claude_swap_user }}"
  notify: reload claude-swap-notify

- name: create claude-swap-notify directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ claude_swap_user }}"
    mode: '0755'
  loop:
    - "{{ claude_swap_notify_script | dirname }}"
    - "{{ claude_swap_notify_plist | dirname }}"

- name: install claude-swap-notify script
  copy:
    src: claude-swap-notify.py
    dest: "{{ claude_swap_notify_script }}"
    owner: "{{ claude_swap_user }}"
    mode: '0644'
  notify: reload claude-swap-notify

- name: install claude-swap-notify LaunchAgent
  template:
    src: launchagent.plist.j2
    dest: "{{ claude_swap_notify_plist }}"
    owner: "{{ claude_swap_user }}"
    mode: '0600'
  no_log: true
  notify: reload claude-swap-notify

# Keychain access needs the logged-in GUI session, so gui/<uid>, not user/<uid>.
- name: check whether claude-swap-notify is loaded
  command: "launchctl print gui/{{ _cs_uid.stdout }}/{{ claude_swap_notify_label }}"
  register: _cs_loaded
  changed_when: false
  failed_when: false

- name: bootstrap claude-swap-notify into gui/<uid>
  command: "launchctl bootstrap gui/{{ _cs_uid.stdout }} {{ claude_swap_notify_plist }}"
  when: _cs_loaded.rc != 0
