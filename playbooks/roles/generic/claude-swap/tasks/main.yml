---
- assert:
    that:
      - ansible_os_family == 'Darwin'
      - claude_swap_state in ('present', 'absent')
    fail_msg: "generic/claude-swap only supports macOS hosts (got {{ ansible_os_family }})"
    quiet: yes

- name: look up the claude-swap-notify user's uid
  command: "id -u {{ claude_swap_user }}"
  register: _cs_uid
  changed_when: false

- include_tasks: present.yml
  when: claude_swap_state == 'present'

- include_tasks: absent.yml
  when: claude_swap_state == 'absent'
