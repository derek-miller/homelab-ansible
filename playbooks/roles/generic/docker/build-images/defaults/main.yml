---
# Registry every build is also pushed to, as <registry>/<name>:<input hash> and
# :latest; empty pushes nowhere.
docker_build_images_registry: ""
docker_build_images_registry_username: ""
docker_build_images_registry_password: ""

available_docker_images:
  sourcebot:
    repo: https://github.com/sourcebot-dev/sourcebot.git
    version: v5.1.16
    patches:
      # Strips the Sentry sourcemap-upload secret mounts: RUN --mount requires
      # BuildKit, which the docker_image build path doesn't use, and no Sentry
      # token is supplied anyway.
      - sourcebot/no-buildkit.patch
      - sourcebot/vault-entitlements.patch
      # Fixed 6GiB web heap instead of upstream's 50%-of-cgroup-limit: with no
      # container memory limit, Node reads 50% of the whole VM. supervisord.conf
      # overrides NODE_OPTIONS for the web program, so an env var can't do this.
      - sourcebot/web-heap-cap.patch
    image_name: sourcebot
    hide_build_log: true
  openclaw-webhook-proxy:
    dockerfile: openclaw-webhook-proxy/Dockerfile
    build_files:
      - openclaw-webhook-proxy/server.mjs
      - openclaw-webhook-proxy/admin.html
    image_name: openclaw-webhook-proxy
  unifi-collector:
    dockerfile: unifi-collector/Dockerfile
    build_files:
      - unifi-collector/collector.py
    image_name: unifi-collector
  c4-release-notifier:
    dockerfile: c4-release-notifier/Dockerfile
    build_files:
      - c4-release-notifier/notifier.py
    image_name: c4-release-notifier
  gha-runner:
    dockerfile: gha-runner/Dockerfile
    build_files:
      - gha-runner/start.sh
    image_name: gha-runner
    # Each task takes the newest build when it starts; restarting the service
    # would cancel jobs in flight.
    rollout: false
  control4-driver-scraper:
    repo: git@github.com:derek-miller/control4-driver-scraper.git
    version: master
    # Read-only deploy key registered on the private GitHub repo.
    ssh_key: vault/control4-driver-scraper-id_ed25519
    image_name: control4-driver-scraper
    hide_build_log: true
