---
- name: "{{ volume_name }} | set full volume name"
  set_fact:
    full_volume_name: "{{ docker_restore_volume_prefix }}_{{ volume_name }}"

- name: "{{ volume_name }} | check if docker volume exists"
  command: "docker volume inspect {{ full_volume_name }}"
  register: volume_inspect
  failed_when: false
  changed_when: false
  check_mode: false

- name: "{{ volume_name }} | check if volume has data"
  command: >-
    docker run --rm
    -v {{ full_volume_name }}:/volume:ro
    alpine
    sh -c 'ls -A /volume | head -1'
  register: volume_contents
  changed_when: false
  check_mode: false
  when: volume_inspect.rc == 0

- name: "{{ volume_name }} | skip restore (volume has data)"
  debug:
    msg: >-
      Skipping {{ full_volume_name }}: volume already has data.
      Set docker_restore_volumes_force=yes to overwrite.
  when:
    - volume_inspect.rc == 0
    - volume_contents.stdout | default('') | length > 0
    - not (docker_restore_volumes_force | bool)

- name: "{{ volume_name }} | show restore command"
  debug:
    msg: >-
      Will run: {{ docker_restore_archive_cat }} | docker run --rm -i
      -v {{ full_volume_name | quote }}:/restore
      alpine tar -xzf - --strip-components=2 -C /restore {{ ('backup/' ~ volume_name ~ '/') | quote }}
  when:
    - ansible_check_mode
    - volume_inspect.rc != 0
      or volume_contents.stdout | default('') | length == 0
      or (docker_restore_volumes_force | bool)

- name: "{{ volume_name }} | create docker volume"
  command: "docker volume create {{ full_volume_name }}"
  when: volume_inspect.rc != 0

- name: "{{ volume_name }} | restore volume data from backup"
  shell: >-
    set -o pipefail;
    {{ docker_restore_archive_cat }}
    | docker run --rm -i
    -v {{ full_volume_name | quote }}:/restore
    alpine
    tar -xzf - --strip-components=2 -C /restore {{ ('backup/' ~ volume_name ~ '/') | quote }}
  args:
    executable: /bin/bash
  when: >-
    volume_inspect.rc != 0
    or volume_contents.stdout | default('') | length == 0
    or (docker_restore_volumes_force | bool)
  register: restore_result

# The archive no longer carries SQLite -wal/-shm/-journal (backups exclude them),
# and tar overlays rather than replaces, so a sidecar left in the target from a
# prior restore would be replayed onto the freshly restored .db and corrupt it.
- name: "{{ volume_name }} | drop stale SQLite sidecars left in the target volume"
  command: >-
    docker run --rm
    -v {{ full_volume_name | quote }}:/restore
    alpine
    find /restore -type f \( -name '*-wal' -o -name '*-shm' -o -name '*-journal' \) -delete
  when: restore_result is changed

- name: "{{ volume_name }} | fix volume root ownership to match contents"
  command: >-
    docker run --rm
    -v {{ full_volume_name }}:/volume
    alpine
    sh -c 'entry=$(ls -A /volume | head -1); if [ -n "$entry" ]; then owner=$(stat -c "%u:%g" "/volume/$entry"); chown "$owner" /volume; fi'
  when: restore_result is changed
