---
# Stop first: apt runs the units' prerm while they are still live otherwise, and
# a driver mid-poll leaves the enumerator failed before it is even removed.
- name: stop the nut units
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - nut-monitor
    - nut-server
    - nut-driver.target
  failed_when: false

# The metapackages alone leave nut-server and nut-client behind, so their units
# keep running against the configuration deleted below and the driver
# enumerator fails on the missing ups.conf.
- name: uninstall nut
  apt:
    name:
      - nut
      - nut-snmp
      - nut-server
      - nut-client
    state: absent
    purge: yes
    autoremove: yes
  register: uninstall_nut_result

- name: delete nut configuration
  file:
    path: /etc/nut
    state: absent

- name: reload systemd
  systemd:
    daemon_reload: yes
  when: uninstall_nut_result.changed

# Removing the packages strands the enumerator and its per-device instances in
# a failed state, and they outlive the apt change that produced them.
- name: find failed nut units
  command: systemctl list-units 'nut*' --state=failed --no-legend --plain
  register: failed_nut_units
  changed_when: false

- name: clear the failed nut units
  command: systemctl reset-failed 'nut*'
  when: failed_nut_units.stdout | trim | length > 0
