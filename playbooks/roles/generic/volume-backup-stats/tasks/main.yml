---
- assert:
    that: volume_backup_stats_state in ('present', 'absent')
    quiet: yes

- assert:
    that: volume_backup_stats_root|length > 0 or volume_backup_stats_restic_root|length > 0
    fail_msg: Set volume_backup_stats_root or volume_backup_stats_restic_root to the directory the backups are written to.
    quiet: yes
  when: volume_backup_stats_state == 'present'

- include_role:
    name: generic/telegraf/plugin
  vars:
    telegraf_plugin_conf_src: telegraf.conf.jinja2
    telegraf_plugin_conf: volume-backup-stats.conf
    telegraf_plugin_state: "{{ volume_backup_stats_state }}"
