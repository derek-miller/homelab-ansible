---
- name: find the installed forward units
  find:
    paths: /etc/systemd/system
    patterns: tcp-forward-*.service
  register: _tcp_forward_installed

- name: stop and disable the forwards
  systemd:
    name: "{{ item.path | basename }}"
    state: stopped
    enabled: no
  loop: "{{ _tcp_forward_installed.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: remove the forward units
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _tcp_forward_installed.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: reload systemd
  systemd:
    daemon_reload: yes
  when: _tcp_forward_installed.matched > 0

- name: remove socat
  apt:
    name: socat
    state: absent
    purge: yes
