---
k3s_state: present

# server or agent. Agents join k3s_server_address.
k3s_role: agent

# A release channel (stable, latest, v1.36) or an exact release such as
# v1.36.5+k3s1 to hold back. The server moves at most one minor per deploy
# either way, and agents run whatever the server runs.
k3s_version: stable

# On the data disk beside Docker's data-root; the unit waits for its mount.
k3s_data_dir: /mnt/data/k3s

# Must be on the interface flannel carries pod traffic over.
k3s_node_ip: ""

k3s_server_address: ""
k3s_token: ""

k3s_server_disable:
  - traefik
  - servicelb
  - local-storage

k3s_tls_san: []

# Debian's 128 instances runs out once kubelet, containerd and Docker all watch.
k3s_sysctls:
  fs.inotify.max_user_instances: 8192
  fs.inotify.max_user_watches: 524288

# kube-proxy otherwise resizes nf_conntrack_max by core count, shrinking it
# under Docker on a 4-core node, and sets route_localnet for localhost NodePorts.
k3s_kube_proxy_args:
  - conntrack-max-per-core=0
  - iptables-localhost-nodeports=false

# Merged over the generated /etc/rancher/k3s/config.yaml.
k3s_config_extra: {}
