---
# artis3n parses `tailscale status`, which a dry run never produces, so a dry
# run would fail every host here.
- name: install and configure tailscale (artis3n)
  include_role:
    name: artis3n.tailscale.machine
  when: not ansible_check_mode

- name: note that dry runs don't preview tailscale
  debug:
    msg: A dry run doesn't preview tailscale; artis3n needs a live status.
  when: ansible_check_mode
