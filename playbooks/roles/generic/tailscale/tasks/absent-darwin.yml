---
- name: check for the tailscale CLI
  stat:
    path: "{{ homebrew_prefix }}/bin/tailscale"
  register: _tailscale_cli

- name: log the node out of the tailnet
  command: tailscale logout
  register: _tailscale_logout
  changed_when: _tailscale_logout.rc == 0
  failed_when: false
  when: _tailscale_cli.stat.exists

- name: check for the tailscaled LaunchDaemon
  stat:
    path: "/Library/LaunchDaemons/{{ tailscale_launchd_label }}.plist"
  register: _tailscaled_plist

- name: unload tailscaled
  community.general.launchd:
    name: "{{ tailscale_launchd_label }}"
    state: unloaded
  when: _tailscaled_plist.stat.exists

- name: remove tailscaled LaunchDaemon
  file:
    path: "/Library/LaunchDaemons/{{ tailscale_launchd_label }}.plist"
    state: absent

- name: brew uninstall tailscale
  community.general.homebrew:
    name: tailscale
    state: absent
  become_user: "{{ mac_user }}"

- name: remove tailscale state
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /Library/Tailscale
    - "{{ ansible_facts.env.HOME }}/.local/state/artis3n-tailscale"
