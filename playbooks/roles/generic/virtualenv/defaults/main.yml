---
virtualenv_state: present
virtualenv_owner: root
virtualenv_group: "{{ root_group }}"
virtualenv_site_packages: no
virtualenv_python: "{{ python_base_interpreter }}"
virtualenv_pip_conf: "{{ virtualenv_path }}/pip.conf"
virtualenv_pip_index: "{{ pip_default_index_url }}"
# A pip-compiled lock in the calling role's files/, installed with pip-sync.
virtualenv_requirements: ''
