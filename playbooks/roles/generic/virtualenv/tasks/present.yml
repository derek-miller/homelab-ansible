---
# The pip module only builds a venv when one is absent — it won't rebuild an
# existing venv whose base interpreter or site-packages setting changed. Compare
# pyvenv.cfg with both, and remove the venv on a mismatch so it's recreated below.
- name: check existing venv base interpreter
  slurp:
    src: "{{ virtualenv_path }}/pyvenv.cfg"
  register: virtualenv_pyvenv_cfg
  failed_when: false

# A dry run ahead of a minor bump probes an interpreter not installed yet.
- name: check the interpreter's Python version
  command: "{{ virtualenv_python }} --version"
  register: virtualenv_python_version
  changed_when: false
  failed_when: virtualenv_python_version.rc != 0 and not ansible_check_mode
  check_mode: no
  when: virtualenv_pyvenv_cfg.content is defined

- name: remove a venv built with a different Python minor or site-packages setting
  file:
    path: "{{ virtualenv_path }}"
    state: absent
  register: virtualenv_rebuild
  vars:
    _venv_minor: >-
      {{ virtualenv_pyvenv_cfg.content | b64decode
         | regex_search('(?m)^version(_info)? *= *[0-9]+[.][0-9]+') | default('', true)
         | regex_replace('^.*= *', '') }}
    _python_minor: "{{ virtualenv_python_version.stdout | regex_search('[0-9]+[.][0-9]+') | default('', true) }}"
    _venv_site_packages: >-
      {{ virtualenv_pyvenv_cfg.content | b64decode
         | regex_search('(?m)^include-system-site-packages *= *true') is not none }}
  when:
    - virtualenv_pyvenv_cfg.content is defined
    - _venv_minor != _python_minor or _venv_site_packages | bool != virtualenv_site_packages | bool

- name: create virtualenv dir
  file:
    path: "{{ virtualenv_path }}"
    owner: "{{ virtualenv_owner }}"
    group: "{{ virtualenv_group }}"
    mode: 0755
    state: directory

# If a template dest is a symlink, ansible overwrites the symlink target's contents instead of replacing
# the link with a new file (absolute insanity). See https://github.com/ansible/ansible/issues/14469

- name: check if virtualenv pip.conf is a symlink
  stat:
    path: "{{ virtualenv_pip_conf }}"
  register: virtualenv_pip_conf_stat

- name: delete virtualenv pip.conf if it's a symlink
  file:
    path: "{{ virtualenv_pip_conf }}"
    state: absent
  when:
    - virtualenv_pip_conf_stat.stat.exists
    - virtualenv_pip_conf_stat.stat.islnk

- name: create virtualenv pip.conf
  template:
    src: pip.conf.jinja2
    dest: "{{ virtualenv_pip_conf }}"
    owner: "{{ virtualenv_owner }}"
    group: "{{ virtualenv_group }}"
    mode: 0644

- name: create virtualenv and upgrade setuptools
  pip:
    virtualenv: "{{ virtualenv_path }}"
    virtualenv_site_packages: "{{ virtualenv_site_packages }}"
    virtualenv_command: "{{ virtualenv_python }} -m venv"
    name: setuptools{{ setuptools_version_spec }}
    extra_args: --upgrade-strategy only-if-needed
    state: latest

- name: create virtualenv and upgrade pip
  pip:
    virtualenv: "{{ virtualenv_path }}"
    virtualenv_site_packages: "{{ virtualenv_site_packages }}"
    virtualenv_command: "{{ virtualenv_python }} -m venv"
    name: pip{{ pip_version_spec }}
    extra_args: --upgrade-strategy only-if-needed
    state: latest
