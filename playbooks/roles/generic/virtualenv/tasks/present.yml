---
# A dry run ahead of a minor bump probes an interpreter not installed yet.
- name: check the interpreter's Python version
  command: "{{ virtualenv_python }} -B -c 'import sysconfig; print(sysconfig.get_python_version())'"
  register: virtualenv_python_minor
  changed_when: false
  failed_when: virtualenv_python_minor.rc != 0 and not ansible_check_mode
  check_mode: no

- name: check the venv has that Python minor
  stat:
    path: "{{ virtualenv_path }}/lib/python{{ virtualenv_python_minor.stdout }}"
  register: virtualenv_python_lib

# The pip module only builds a venv when one is absent — it won't rebuild an
# existing venv whose base interpreter changed, so it's removed here and
# recreated below.
- name: remove a venv built with a different Python minor
  file:
    path: "{{ virtualenv_path }}"
    state: absent
  when: not virtualenv_python_lib.stat.exists

- name: create virtualenv dir
  file:
    path: "{{ virtualenv_path }}"
    owner: "{{ virtualenv_owner }}"
    group: "{{ virtualenv_group }}"
    mode: 0755
    state: directory

# If a template dest is a symlink, ansible overwrites the symlink target's contents instead of replacing
# the link with a new file (absolute insanity). See https://github.com/ansible/ansible/issues/14469

- name: check if virtualenv pip.conf is a symlink
  stat:
    path: "{{ virtualenv_pip_conf }}"
  register: virtualenv_pip_conf_stat

- name: delete virtualenv pip.conf if it's a symlink
  file:
    path: "{{ virtualenv_pip_conf }}"
    state: absent
  when:
    - virtualenv_pip_conf_stat.stat.exists
    - virtualenv_pip_conf_stat.stat.islnk

- name: create virtualenv pip.conf
  template:
    src: pip.conf.jinja2
    dest: "{{ virtualenv_pip_conf }}"
    owner: "{{ virtualenv_owner }}"
    group: "{{ virtualenv_group }}"
    mode: 0644

- name: create virtualenv and upgrade setuptools
  pip:
    virtualenv: "{{ virtualenv_path }}"
    virtualenv_site_packages: "{{ virtualenv_site_packages }}"
    virtualenv_command: "{{ virtualenv_python }} -m venv"
    name: setuptools{{ setuptools_version_spec }}
    extra_args: --upgrade-strategy only-if-needed
    state: latest

- name: create virtualenv and upgrade pip
  pip:
    virtualenv: "{{ virtualenv_path }}"
    virtualenv_site_packages: "{{ virtualenv_site_packages }}"
    virtualenv_command: "{{ virtualenv_python }} -m venv"
    name: pip{{ pip_version_spec }}
    extra_args: --upgrade-strategy only-if-needed
    state: latest

- name: install the virtualenv's lock
  when: virtualenv_requirements | length > 0
  block:
    - name: copy the virtualenv's lock
      copy:
        src: "{{ virtualenv_requirements }}"
        dest: "{{ virtualenv_path | dirname }}/requirements.txt"
        owner: "{{ virtualenv_owner }}"
        group: "{{ virtualenv_group }}"
        mode: 0644

    - name: install pip-tools for pip-sync
      pip:
        virtualenv: "{{ virtualenv_path }}"
        name: pip-tools
        state: latest

    - name: sync the virtualenv to its lock
      command: "{{ virtualenv_path }}/bin/pip-sync {{ virtualenv_path | dirname }}/requirements.txt"
      register: _virtualenv_pip_sync
      changed_when: "'Everything up-to-date' not in _virtualenv_pip_sync.stdout"
