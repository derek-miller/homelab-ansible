---
- assert:
    that: process_stats_state in ('present', 'absent')
    quiet: yes

- include_role:
    name: generic/telegraf/plugin
  vars:
    telegraf_plugin_conf_src: telegraf.conf.jinja2
    telegraf_plugin_conf: process-stats.conf
    telegraf_plugin_state: "{{ 'present' if process_stats_state == 'present' and process_stats_processes|length > 0 else 'absent' }}"
