---
sourcebot_db_state: present

sourcebot_db_container: sourcebot-postgres
sourcebot_db_user: sourcebot
sourcebot_db_name: sourcebot

# Sourcebot >= 5.1.8 keeps job state in redis (BullMQ) and dropped the postgres
# job tables, so pg_cron only trims its own run log now (it grows forever
# otherwise). Jobs scheduled in the DB but absent from this list are
# unscheduled on the next run.
sourcebot_db_retention_jobs:
  - name: cron-trim-run-details
    schedule: "52 5 * * *"
    sql: >-
      DELETE FROM cron.job_run_details WHERE end_time < now() - interval '7 days'
