---
- name: require the sourcebot postgres container
  assert:
    that: sourcebot_db_cid.stdout | length > 0
    fail_msg: >-
      sourcebot-postgres is not running on {{ inventory_hostname }}; deploy the
      stack before applying the retention setup.
    quiet: yes

- name: converge the retention setup
  vars:
    psql:
      - docker
      - exec
      - "{{ sourcebot_db_cid.stdout }}"
      - psql
      - -U
      - "{{ sourcebot_db_user }}"
      - -d
      - "{{ sourcebot_db_name }}"
      - -tAc
  block:
    - name: wait for postgres to accept connections
      command: >-
        docker exec {{ sourcebot_db_cid.stdout }}
        pg_isready -U {{ sourcebot_db_user }} -d {{ sourcebot_db_name }}
      register: sourcebot_db_ready
      until: sourcebot_db_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: create the pg_cron extension
      command:
        argv: "{{ psql + ['CREATE EXTENSION IF NOT EXISTS pg_cron'] }}"
      register: sourcebot_db_extension
      changed_when: "'already exists' not in sourcebot_db_extension.stderr"

    - name: read the scheduled jobs
      command:
        argv: >-
          {{ psql + ["SELECT jobname || '@@' || schedule || '@@'
             || btrim(regexp_replace(command, '\s+', ' ', 'g')) FROM cron.job"] }}
      register: sourcebot_db_scheduled
      changed_when: false

    - name: unschedule retired retention jobs
      command:
        argv: >-
          {{ psql + ["SELECT cron.unschedule('" ~ item ~ "')"] }}
      loop: >-
        {{ sourcebot_db_scheduled.stdout_lines
           | map('regex_replace', '@@.*$', '')
           | difference(sourcebot_db_retention_jobs | map(attribute='name'))
           | list }}

    - name: schedule the retention jobs
      command:
        argv: >-
          {{ psql + ["SELECT cron.schedule('" ~ item.name ~ "', '" ~ item.schedule
             ~ "', $sb$" ~ (item.sql | regex_replace('\s+', ' ') | trim) ~ "$sb$)"] }}
      loop: "{{ sourcebot_db_retention_jobs }}"
      loop_control:
        label: "{{ item.name }}"
      when: >-
        (item.name ~ '@@' ~ item.schedule ~ '@@'
         ~ (item.sql | regex_replace('\s+', ' ') | trim))
        not in sourcebot_db_scheduled.stdout_lines
