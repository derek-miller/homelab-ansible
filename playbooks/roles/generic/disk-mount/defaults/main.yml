---
disk_mount_state: present

# List of disk mounts to configure via /etc/fstab. Each entry:
#   src:     device identifier (UUID=..., LABEL=..., or /dev/...)
#   device:  optional; when set, create the filesystem on this device first if it
#            has none. Pair with a LABEL= src so the label is applied at mkfs.
#   symlinks: optional list of {src, dest}, applied after the mount with force: yes,
#            which replaces an existing symlink, file, or empty directory. Only a
#            non-empty directory is refused — clear that one deliberately first.
#   path:    mount point
#   fstype:  filesystem type
#   opts:    defaults to "defaults,nofail". On exfat/ntfs set uid=/gid=/fmask=
#            here - the mount point can't be chowned once mounted.
disk_mounts: []
