---
# disk-mount absent — reverse what present.yml did:
#   - remove the mount requirements it gave other units (and their drop-in
#     dirs, if left empty)
#   - remove the symlinks it created
#   - unmount each configured path
#   - remove the fstab entry
#   - remove the (now-empty) mount-point dir

- name: remove mount requirements from units
  file:
    path: "/etc/systemd/system/{{ item.1 }}.d/disk-mount-{{ item.0.path | regex_replace('^/', '') | replace('/', '-') }}.conf"
    state: absent
  loop: "{{ disk_mounts | subelements('required_by', skip_missing=true) }}"
  loop_control:
    label: "{{ item.1 }} -> {{ item.0.path }}"
  notify: reload systemd units

- name: remove drop-in directories left empty
  # rmdir, not file:state=absent: the unit may carry drop-ins of its own.
  command: "rmdir {{ ('/etc/systemd/system/' ~ item.1 ~ '.d') | quote }}"
  loop: "{{ disk_mounts | subelements('required_by', skip_missing=true) }}"
  loop_control:
    label: "{{ item.1 }}.d"
  register: _disk_mount_dropin_rmdir
  failed_when: false
  changed_when: _disk_mount_dropin_rmdir.rc == 0

- name: remove links this disk provided
  file:
    path: "{{ item.1.dest }}"
    state: absent
  when: item.1.dest is defined
  loop: "{{ disk_mounts | subelements('symlinks', skip_missing=true) }}"
  loop_control:
    label: "{{ item.1.dest }}"

- name: unmount + remove fstab entry for each disk
  ansible.posix.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    fstype: "{{ item.fstype }}"
    state: absent
  loop: "{{ disk_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: remove mount-point dirs (only if empty)
  # rmdir, not file:state=absent, so we don't clobber a dir that still
  # contains data (e.g., if something wrote there while unmounted).
  command: "rmdir {{ item.path | quote }}"
  loop: "{{ disk_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  failed_when: false
  changed_when: true
