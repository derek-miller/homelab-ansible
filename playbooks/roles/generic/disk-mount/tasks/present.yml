---
# ansible.posix.mount below creates the mount-point dir on first use
# (root:root:0755 default) — no separate mkdir task needed. This also
# sidesteps a chown failure on already-mounted non-POSIX filesystems
# like exfat/ntfs, which reject file:owner/group.

# `src` (LABEL=/UUID=) is what the mount resolves and is the authority once the
# filesystem exists; `device` is only a target for creating one on a disk that
# has none. Kernel names are not stable across reboots, so a `device` that was
# right at provisioning time can later name a different disk entirely — resolve
# both before anything runs mkfs.
- name: probe managed devices
  shell: |
    set -eu
    src={{ item.src | quote }}
    case "$src" in
      UUID=*)  existing="$(blkid -U "${src#UUID=}" 2>/dev/null || true)" ;;
      LABEL=*) existing="$(blkid -L "${src#LABEL=}" 2>/dev/null || true)" ;;
      *)       existing="" ;;
    esac
    real="$(readlink -f {{ item.device | quote }} 2>/dev/null || true)"
    # readlink -f resolves a missing final component and exits 0, so a
    # nonexistent device yields a plausible path. Only a block device counts.
    [ -b "$real" ] || real=""
    sig=""
    inuse=no
    if [ -b "$real" ]; then
      sig="$(blkid -p -o value -s TYPE -s PTTYPE "$real" 2>/dev/null | tr '\n' ',' | sed 's/,$//' || true)"
      for d in "$real" $(lsblk -nrpo NAME "$real" 2>/dev/null | tail -n +2); do
        if findmnt -n --source "$d" >/dev/null 2>&1; then inuse=yes; fi
      done
    fi
    printf '{"existing":"%s","real":"%s","sig":"%s","inuse":"%s"}' \
      "$existing" "$real" "$sig" "$inuse"
  register: _disk_mount_probe
  changed_when: false
  # Read-only, and --check must still reach a real decision about mkfs.
  check_mode: no
  loop: "{{ disk_mounts | selectattr('device', 'defined') | list }}"
  loop_control:
    label: "{{ item.src }} ({{ item.device }})"

# Only evaluated when src was not found, i.e. the disk is genuinely fresh.
# mke2fs does refuse a device with mounted partitions, but that is a last line
# of defence inside another tool, not something this role should lean on.
- name: refuse to create a filesystem on an unsafe device
  assert:
    that:
      - _probe.real | length > 0
      - _probe.inuse == 'no'
      - _probe.sig | length == 0
    fail_msg: >-
      Refusing to run mkfs on {{ item.item.device }}
      ({{ _probe.real if _probe.real | length > 0 else 'unresolved' }}):
      {{ 'it does not exist or is not a block device' if _probe.real | length == 0
         else 'it or one of its partitions is mounted' if _probe.inuse == 'yes'
         else 'it already carries ' ~ _probe.sig }}.
      {{ item.item.src }} is not present on this host, so this would have put a
      new filesystem on the wrong disk. Compare `device` against
      `lsblk -o NAME,SIZE,LABEL` and wipe the target deliberately if it is
      genuinely the one you meant.
    quiet: yes
  vars:
    _probe: "{{ item.stdout | from_json }}"
  when: (item.stdout | from_json).existing | length == 0
  loop: "{{ _disk_mount_probe.results }}"
  loop_control:
    label: "{{ item.item.device }}"

- name: create filesystems on empty managed devices
  community.general.filesystem:
    dev: "{{ item.item.device }}"
    fstype: "{{ item.item.fstype }}"
    opts: >-
      {{ ('-L ' ~ item.item.src | regex_replace('^LABEL=', ''))
         if item.item.src.startswith('LABEL=') else omit }}
    state: present
  when: (item.stdout | from_json).existing | length == 0
  loop: "{{ _disk_mount_probe.results }}"
  loop_control:
    label: "{{ item.item.device }} ({{ item.item.fstype }})"

# If another subsystem (e.g. udisks2's GUI auto-mount) has the device
# mounted at a different path, our fstab entry would be ignored until
# the next reboot. Unmount the device from any stale location first so
# the ansible.posix.mount below can land it at the canonical path.
- name: discover currently-mounted paths for managed devices
  shell: |
    set -eu
    src={{ item.src | quote }}
    case "$src" in
      UUID=*)  dev="$(blkid -U "${src#UUID=}" 2>/dev/null || true)" ;;
      LABEL=*) dev="$(blkid -L "${src#LABEL=}" 2>/dev/null || true)" ;;
      *)       dev="$src" ;;
    esac
    [ -n "$dev" ] || exit 0
    /bin/findmnt -n -o TARGET --source "$dev" 2>/dev/null || true
  register: _disk_mount_current
  changed_when: false
  loop: "{{ disk_mounts }}"
  loop_control:
    label: "{{ item.src }}"

- name: unmount device from stale location
  # A block device can be mounted at several targets at once (findmnt returns
  # one line each), so iterate per-target via stdout_lines rather than treating
  # the whole multi-line stdout as a single path. shell (not command) so paths
  # with spaces like "/media/pi/Extreme Pro" survive as one argument via quote.
  shell: "/usr/bin/umount {{ item.1 | trim | quote }}"
  when:
    - item.1 | trim | length > 0
    - (item.1 | trim) != item.0.item.path
  loop: "{{ _disk_mount_current.results | subelements('stdout_lines', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.item.src }} (from {{ item.1 | trim }})"

- name: configure persistent fstab mount
  ansible.posix.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.opts | default('defaults,nofail') }}"
    state: mounted
  loop: "{{ disk_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  notify: reload systemd units

- name: link fixed paths that this disk has moved
  file:
    src: "{{ item.1.src }}"
    dest: "{{ item.1.dest }}"
    state: link
    force: yes
    follow: no
  loop: "{{ disk_mounts | subelements('symlinks', skip_missing=true) }}"
  loop_control:
    label: "{{ item.1.dest }} -> {{ item.1.src }}"
