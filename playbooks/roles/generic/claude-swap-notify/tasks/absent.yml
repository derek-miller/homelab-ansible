---
- name: bootout claude-swap-notify
  command: "launchctl bootout gui/{{ _csn_uid.stdout }}/{{ claude_swap_notify_label }}"
  register: _csn_bootout
  changed_when: _csn_bootout.rc == 0
  failed_when: false

- name: remove claude-swap-notify files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ claude_swap_notify_plist }}"
    - "{{ claude_swap_notify_script }}"
    - "{{ claude_swap_notify_log }}"
