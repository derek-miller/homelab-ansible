---
claude_swap_notify_state: present

claude_swap_notify_user: "{{ mac_user | mandatory }}"
claude_swap_notify_home: "/Users/{{ claude_swap_notify_user }}"

# Both are what `uv tool install claude-swap` creates; this role does not install cswap.
claude_swap_notify_cswap_bin: "{{ claude_swap_notify_home }}/.local/bin/cswap"
claude_swap_notify_python: "{{ claude_swap_notify_home }}/.local/share/uv/tools/claude-swap/bin/python"

claude_swap_notify_webhook_url: "{{ undef(hint='Set claude_swap_notify_webhook_url to a Discord webhook URL') }}"

# Extra flags for `cswap auto`; settings.json in cswap's backup root holds the defaults.
claude_swap_notify_auto_args: []

claude_swap_notify_label: homelab.claude-swap-notify
claude_swap_notify_script: "{{ claude_swap_notify_home }}/.local/libexec/claude-swap-notify.py"
claude_swap_notify_plist: "{{ claude_swap_notify_home }}/Library/LaunchAgents/{{ claude_swap_notify_label }}.plist"
claude_swap_notify_log: "{{ claude_swap_notify_home }}/Library/Logs/claude-swap-notify.log"
