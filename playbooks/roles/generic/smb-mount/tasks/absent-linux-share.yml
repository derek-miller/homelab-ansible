---
- set_fact:
    smb_mount_service_name: "{{ smb_mount_dir | mandatory | regex_replace('^\\/+|\\/+$', '')  | replace('/', '-') }}-{{ smb_share_name | mandatory }}"
- set_fact:
    smb_mount_path: "{{ smb_mount_dir | regex_replace('\\/+$', '') }}/{{ smb_share_name }}"

# Automount cleanup

- name: check if {{ smb_mount_service_name }}.automount is a valid service
  stat:
    path: /etc/systemd/system/{{ smb_mount_service_name }}.automount
  register: systemd_automount_stat

- name: stop {{ smb_mount_service_name }}.automount
  when: systemd_automount_stat.stat.exists
  systemd:
    name: "{{ smb_mount_service_name }}.automount"
    state: stopped
    enabled: no

- name: delete {{ smb_mount_service_name }}.automount service
  file:
    path: /etc/systemd/system/{{ smb_mount_service_name }}.automount
    state: absent
  register: systemd_automount_delete_result

# Mount cleanup

- name: check if {{ smb_mount_service_name }}.mount is a valid service
  stat:
    path: /etc/systemd/system/{{ smb_mount_service_name }}.mount
  register: systemd_mount_stat

- name: stop {{ smb_mount_service_name }}.mount
  when: systemd_mount_stat.stat.exists
  systemd:
    name: "{{ smb_mount_service_name }}.mount"
    state: stopped
    enabled: no

- name: delete {{ smb_mount_service_name }}.mount service
  file:
    path: /etc/systemd/system/{{ smb_mount_service_name }}.mount
    state: absent
  register: systemd_mount_delete_result

- when: systemd_automount_delete_result.changed or systemd_mount_delete_result.changed
  name: reload systemd
  systemd:
    daemon_reload: yes

# rmdir, never a recursive delete: a share still mounted here, by hand or by
# a unit already gone, would have its NAS contents removed.
- name: remove the emptied {{ smb_mount_path }}
  command: "rmdir {{ smb_mount_path }}"
  args:
    removes: "{{ smb_mount_path }}"
  register: _smb_rmdir
  failed_when: false
  changed_when: _smb_rmdir is changed and _smb_rmdir.rc == 0
