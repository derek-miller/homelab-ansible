---
- include_tasks: absent-linux-share.yml
  with_items: "{{ smb_share_names | mandatory }}"
  loop_control:
    loop_var: smb_share_name

- name: delete cifs credentials file
  file:
    path: "{{ smb_credentials_path | mandatory }}"
    state: absent

- name: uninstall cifs dependencies
  apt:
    name: cifs-utils
    state: absent
    purge: yes
