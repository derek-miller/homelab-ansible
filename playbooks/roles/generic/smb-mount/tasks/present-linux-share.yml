---
- name: configure {{ smb_mount_service_name }}.mount service
  template:
    src: systemd_mount.j2
    dest: /etc/systemd/system/{{ smb_mount_service_name }}.mount
  register: systemd_mount_result

- name: configure {{ smb_mount_service_name }}.automount service
  template:
    src: systemd_automount.j2
    dest: /etc/systemd/system/{{ smb_mount_service_name }}.automount
  register: systemd_automount_result

- when: systemd_mount_result.changed or systemd_automount_result.changed
  name: reload systemd
  systemd:
    daemon_reload: yes

- name: start {{ smb_mount_service_name }}.automount
  systemd:
    name: "{{ smb_mount_service_name }}.automount"
    state: "{{ 'restarted' if systemd_automount_result.changed else 'started' }}"
    enabled: yes

- name: start {{ smb_mount_service_name }}.mount
  systemd:
    name: "{{ smb_mount_service_name }}.mount"
    state: "{{ 'restarted' if systemd_mount_result.changed else 'started' }}"
    enabled: yes
