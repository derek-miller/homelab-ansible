---
# ---- root-level mount directory ----------------------------------------
# macOS's sealed system volume is read-only at /, so a root-level path like
# /mnt has to be declared in /etc/synthetic.conf. We use the SYMLINK form
# ("name\tpath") because a bare-token synthetic dir at /mnt and the
# underlying /System/Volumes/Data/mnt are different inodes, and the shares
# mount on the latter. With a symlink, /mnt resolves to the same inode.
- name: ensure the synthetic link target exists
  file:
    path: "{{ smb_mount_darwin_target }}"
    state: directory
    owner: root
    group: "{{ root_group }}"
    mode: '0755'

- name: declare the synthetic link
  lineinfile:
    path: /etc/synthetic.conf
    regexp: '^{{ smb_mount_dir | basename }}\t'
    line: "{{ smb_mount_dir | basename }}\t{{ smb_mount_darwin_target }}"
    create: yes
    owner: root
    group: "{{ root_group }}"
    mode: '0644'

- name: probe whether the synthetic link is in place
  stat:
    path: "{{ smb_mount_dir }}"
  register: _synthetic_probe

# apfs.util -t stitches new synthetic entries but does not convert an
# already-stitched empty dir into a symlink. The actual transition
# only happens at boot.
- name: pause for reboot to materialize the synthetic link
  pause:
    seconds: 600
    prompt: |

      ====================================================================
      MANUAL STEP REQUIRED — reboot to apply /etc/synthetic.conf
      ====================================================================

      {{ smb_mount_dir }} must be a symlink to {{ smb_mount_darwin_target }}, and
      synthetic.conf changes only apply at boot.  On the Mac, run:

        sudo /sbin/shutdown -r now

      then log in at the Mac (FileVault keeps SSH down until someone
      does) and press Ctrl+C, then C, here. The play otherwise resumes
      on its own after 10 minutes.
  when: _synthetic_probe.stat.lnk_target | default('') != smb_mount_darwin_target

# ---- mounts ------------------------------------------------------------
- name: remove the autofs SMB map
  file:
    path: /etc/auto_smb
    state: absent
  notify: reload autofs

- name: flush handlers
  meta: flush_handlers

- name: read the mount table
  command: /sbin/mount
  register: _smb_mount_table
  changed_when: false
  check_mode: no

# Never touch a path in the mount table: chown goes through to the NAS, and a
# stat on an autofs trigger mounts the share as root.
- name: create the mount points
  file:
    path: "{{ smb_mount_darwin_target }}/{{ item }}"
    state: directory
    owner: "{{ mac_user }}"
    group: staff
    mode: '0555'
  loop: "{{ smb_share_names }}"
  when: "' on ' ~ smb_mount_darwin_target ~ '/' ~ item ~ ' (' not in _smb_mount_table.stdout"

- name: write the share credentials
  copy:
    content: |
      {{ smb_share_username }}:{{ smb_share_password | urlencode }}@{{ smb_share_host }}
    dest: "{{ smb_mount_darwin_credentials_path }}"
    owner: "{{ mac_user }}"
    group: staff
    mode: '0400'
  no_log: true
  notify: restart smb-mount

- name: create the script directory
  file:
    path: "{{ smb_mount_darwin_script | dirname }}"
    state: directory
    owner: root
    group: "{{ root_group }}"
    mode: '0755'

- name: install the mount script
  copy:
    src: smb-mount
    dest: "{{ smb_mount_darwin_script }}"
    owner: root
    group: "{{ root_group }}"
    mode: '0755'
  notify: restart smb-mount

# launchd won't start a job whose log directory is missing.
- name: create the log directory
  file:
    path: "{{ smb_mount_darwin_log | dirname }}"
    state: directory
    owner: "{{ mac_user }}"
    group: staff
    mode: '0755'

- name: install the mount LaunchDaemon
  template:
    src: smb-mount.launchd.plist.j2
    dest: "/Library/LaunchDaemons/{{ smb_mount_darwin_label }}.plist"
    owner: root
    group: "{{ root_group }}"
    mode: '0644'
  register: _smb_mount_plist
  notify: restart smb-mount

# A dry run doesn't write the plist, so a first install has no job to start.
- name: start the mount LaunchDaemon
  community.general.launchd:
    name: "{{ smb_mount_darwin_label }}"
    state: started
  when: not (ansible_check_mode and _smb_mount_plist is changed)

- name: flush handlers
  meta: flush_handlers

- name: wait for each share to be mounted by {{ mac_user }}
  shell: >-
    /sbin/mount | grep -F ' on {{ smb_mount_darwin_target }}/{{ item }} (smbfs, '
    | grep -v automounted | grep -qF 'mounted by {{ mac_user }})'
  register: _smb_mounted
  until: _smb_mounted.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  loop: "{{ smb_share_names }}"
