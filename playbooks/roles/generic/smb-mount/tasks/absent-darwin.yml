---
- name: check for the mount LaunchDaemon
  stat:
    path: "/Library/LaunchDaemons/{{ smb_mount_darwin_label }}.plist"
  register: _smb_mount_plist

- name: unload the mount LaunchDaemon
  community.general.launchd:
    name: "{{ smb_mount_darwin_label }}"
    state: unloaded
  when: _smb_mount_plist.stat.exists

- name: remove the mount LaunchDaemon, its script, credentials and log
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/Library/LaunchDaemons/{{ smb_mount_darwin_label }}.plist"
    - "{{ smb_mount_darwin_script }}"
    - "{{ smb_mount_darwin_credentials_path }}"
    - "{{ smb_mount_darwin_log }}"

- name: remove the autofs SMB map
  file:
    path: /etc/auto_smb
    state: absent
  notify: reload autofs

- name: flush handlers
  meta: flush_handlers

- name: read the mount table
  command: /sbin/mount
  register: _smb_mount_table
  changed_when: false
  check_mode: no

- name: unmount the shares
  command: "/sbin/umount {{ smb_mount_darwin_target }}/{{ item }}"
  become_user: "{{ mac_user }}"
  loop: "{{ smb_share_names }}"
  when: "' on ' ~ smb_mount_darwin_target ~ '/' ~ item ~ ' (smbfs,' in _smb_mount_table.stdout"

- name: remove the synthetic link declaration
  lineinfile:
    path: /etc/synthetic.conf
    regexp: '^{{ smb_mount_dir | basename }}\t'
    state: absent

# rmdir, never a recursive delete: a share still mounted under the target
# would have its NAS contents removed. Anything left behind stays.
- name: remove the emptied mount directories
  command: "rmdir {{ smb_mount_darwin_target }}/{{ item }}"
  args:
    removes: "{{ smb_mount_darwin_target }}/{{ item }}"
  loop: "{{ smb_share_names }}"
  when: "' on ' ~ smb_mount_darwin_target ~ '/' ~ item ~ ' (autofs,' not in _smb_mount_table.stdout"
  register: _smb_rmdir
  failed_when: false
  changed_when: _smb_rmdir is changed and _smb_rmdir.rc == 0

- name: remove the emptied synthetic link target
  command: "rmdir {{ smb_mount_darwin_target }}"
  args:
    removes: "{{ smb_mount_darwin_target }}"
  register: _smb_rmdir
  failed_when: false
  changed_when: _smb_rmdir is changed and _smb_rmdir.rc == 0
