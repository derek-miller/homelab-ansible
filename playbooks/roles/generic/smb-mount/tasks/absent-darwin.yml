---
# Tear down autofs config. The /etc/auto_master line removal requires a
# GUI-Terminal one-liner because writes to it fail over SSH (and even from
# a boot-time LaunchDaemon — see defaults/main.yml).

- name: remove autofs SMB map file
  file:
    path: "{{ smb_mount_map_path }}"
    state: absent
  notify: reload autofs

- name: probe /etc/auto_master for stale map entry
  command: "grep -qE '^/-[[:space:]]+{{ smb_mount_map_path | basename }}$' /etc/auto_master"
  register: _automaster_probe
  changed_when: false
  failed_when: false

- name: prompt user to remove map line from /etc/auto_master via GUI Terminal
  pause:
    seconds: 600
    prompt: |

      =====================================================================
      MANUAL STEP REQUIRED — remove autofs map line from /etc/auto_master
      =====================================================================

      Writing /etc/auto_master fails over SSH on this host. In a
      Terminal.app window on the Mac (NOT over SSH), paste:

        sudo /usr/bin/sed -i '' "/^\/-[[:space:]]\\{1,\\}{{ smb_mount_map_path | basename }}$/d" /etc/auto_master

      Then press Ctrl+C, then C, here. The play otherwise resumes on its
      own after 10 minutes.
  when: _automaster_probe.rc == 0

- name: flush handlers
  meta: flush_handlers

- name: remove the synthetic link declaration
  lineinfile:
    path: /etc/synthetic.conf
    regexp: '^{{ smb_mount_dir | basename }}\t'
    state: absent

# rmdir, never a recursive delete: a share still mounted under the target
# would have its NAS contents removed. Anything left behind stays.
- name: remove the emptied mount directories
  command: "rmdir {{ smb_mount_darwin_target }}/{{ item }}"
  args:
    removes: "{{ smb_mount_darwin_target }}/{{ item }}"
  loop: "{{ smb_share_names }}"
  register: _smb_rmdir
  failed_when: false
  changed_when: _smb_rmdir is changed and _smb_rmdir.rc == 0

- name: remove the emptied synthetic link target
  command: "rmdir {{ smb_mount_darwin_target }}"
  args:
    removes: "{{ smb_mount_darwin_target }}"
  register: _smb_rmdir
  failed_when: false
  changed_when: _smb_rmdir is changed and _smb_rmdir.rc == 0
