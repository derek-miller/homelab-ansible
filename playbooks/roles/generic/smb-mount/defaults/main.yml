---
smb_mount_state: present

# smb_share_config and smb_share_names come from the inventory; the play passes
# the rest from smb_share_configs[smb_share_config] (see default.yml):
# smb_share_host, smb_share_username, smb_share_password, smb_mount_options
# (Linux) and smb_mount_dir. Each share mounts at <smb_mount_dir>/<name>; on
# macOS it mounts as mac_user, and smb_mount_dir must be top-level.
smb_share_names: []

# ---- macOS ----------------------------------------------------------------
# mount_smbfs options. smb_mount_options from the share config are mount.cifs
# syntax, so macOS keeps its own.
#   nobrowse — keep the shares out of Finder's list of volumes
#   noowners — ignore the uid/gid the SMB server reports; files appear
#              owned by the accessing process. Without this, if unas
#              exports a share root as root:wheel 700, the Mac user can't
#              read it (even though SMB session authenticated as them).
#   soft     — return errors instead of hanging when the server is
#              unreachable. Prevents a dead unas from wedging processes.
#   rw       — read/write
#   nosuid   — defense-in-depth on a network share
smb_mount_darwin_options: "nobrowse,noowners,soft,rw,nosuid"
