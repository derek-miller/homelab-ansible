---
smb_mount_state: present

# smb_share_config and smb_share_names come from the inventory; the play passes
# the rest from smb_share_configs[smb_share_config] (see default.yml):
# smb_share_host, smb_share_username, smb_share_password, smb_mount_options
# (Linux) and smb_mount_dir. Each share mounts at <smb_mount_dir>/<name>.
smb_share_names: []

# ---- macOS ----------------------------------------------------------------
# Name of the autofs map file installed under /etc. Override per-host if
# you need to manage multiple disjoint SMB share sets via separate maps.
smb_mount_map_name: smb

# Full path of the autofs map file. Derived from smb_mount_map_name.
smb_mount_map_path: "/etc/auto_{{ smb_mount_map_name }}"

# Registering the direct-map line in /etc/auto_master is a manual,
# GUI-Terminal-only step. Confirmed on-host across every automatable
# mechanism: direct SSH write, a boot-time LaunchDaemon (launchd's own
# process tree, not SSH), and SSH with Full Disk Access explicitly
# granted to sshd — all fail identically with EPERM. Only an interactive
# local Terminal.app session succeeds, which points at something tied to
# live local authentication rather than process identity or connection
# path — nothing scriptable. The role detects whether the line is
# present and pauses with the exact command to run locally when it's
# missing (see present-darwin.yml/absent-darwin.yml).
#
# macOS OS updates periodically reset /etc/auto_master to the stock
# system default and strip this line, so this manual step recurs after
# updates — re-run this role (`make run hosts=<host> tags=smb-mount`)
# after an update and follow the prompt if it appears.

# mount_smbfs options passed via autofs. smb_mount_options from the share
# config are mount.cifs syntax, so macOS keeps its own.
#   noowners — ignore the uid/gid the SMB server reports; files appear
#              owned by the accessing process. Without this, if unas
#              exports a share root as root:wheel 700, the Mac user can't
#              read it (even though SMB session authenticated as them).
#   soft     — return errors instead of hanging when the server is
#              unreachable. Prevents a dead unas from wedging processes.
#   rw       — read/write
#   nosuid   — defense-in-depth on a network share
smb_mount_darwin_options: "noowners,soft,rw,nosuid"
