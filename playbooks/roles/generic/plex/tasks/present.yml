---
# Library and config (~/Library/Application Support/Plex Media Server/) live
# outside the .app and survive a cask reinstall.
- name: install Plex Media Server via homebrew cask
  community.general.homebrew_cask:
    name: "{{ plex_cask_name }}"
    state: "{{ plex_cask_state }}"
  become_user: "{{ mac_user }}"
