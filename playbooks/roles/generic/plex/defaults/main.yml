---
plex_state: present

# `present` adopts the existing install without forcing a version; `latest`
# lets `brew upgrade --cask plex-media-server` pick up newer releases.
plex_cask_state: present

# The cask name as of 2026. Brew periodically renames casks; verify via
# `brew search plex-media-server`.
plex_cask_name: plex-media-server

# When plex_state=absent, should state/cache/prefs/logs be deleted?
#
#   false (default): conservative teardown — remove the .app, but leave the
#                    library database, server identity (Plex claim token),
#                    watch history, metadata, and caches intact so a
#                    subsequent plex_state=present re-deploy brings
#                    everything back.
#   true:            scorched-earth — also wipe Application Support,
#                    Caches, Preferences plist and Logs. Use when
#                    decommissioning the host entirely.
plex_wipe_state: false
