---
flux_state: present

# The manifest tree Flux applies. Files that are vault-encrypted are
# decrypted on the way; every image is pinned to its tag's current digest.
flux_apps_path: ""

# Each deploy moves a chart to its newest release matching N.x or N.M.x; an
# exact version holds it back. The operator's release brings the newest Flux
# 2.x it ships.
flux_operator_chart_version: 0.x
reloader_chart_version: 2.x
zot_chart_version: 0.x
traefik_chart_version: 42.x
flux_distribution_version: 2.x

flux_registry_user: flux
flux_registry_password: ""
# bcrypt htpasswd line for flux_registry_user and flux_registry_password.
flux_registry_htpasswd: ""
flux_registry_path: /mnt/data/volumes/zot

# Traefik answers on the server's ports 80 and 443 with a Let's Encrypt
# wildcard for flux_ingress_domain, and passes any request no route claims to
# flux_ingress_fallback_url.
flux_ingress_domain: ""
flux_ingress_acme_email: ""
flux_ingress_cloudflare_email: ""
flux_ingress_cloudflare_api_key: ""
flux_ingress_fallback_url: ""
flux_ingress_path: /mnt/data/volumes/traefik

flux_apply_timeout: 5m

# The web UI signs users in with this OIDC client, and flux_web_admin may run
# its actions.
flux_web_base_url: ""
flux_web_issuer_url: ""
flux_web_client_id: ""
flux_web_client_secret: ""
flux_web_admin: ""
