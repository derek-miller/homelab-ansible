---
# Stops a label's apps, noting what migrate_resume.yml brings back.
- name: "{{ move.label }} | stop its apps"
  environment:
    KUBECONFIG: "{{ _flux_kubeconfig }}"
  block:
    - name: "{{ move.label }} | pause Flux"
      command: flux suspend kustomization apps -n flux-system

    - name: "{{ move.label }} | pause its charts"
      command: "flux suspend helmrelease {{ item | quote }} -n {{ move.label }}"
      loop: "{{ _flux_move_charts }}"
      loop_control:
        label: "{{ move.label }}"
      no_log: true

    - name: "{{ move.label }} | note its workloads' replicas on them"
      command: >-
        k3s kubectl -n {{ move.label }} annotate {{ item.kind }} {{ item.name | quote }}
        {{ _flux_replicas_annotation }}={{ item.replicas }} --overwrite --field-manager={{ _flux_mover_field_manager }}
      loop: "{{ _flux_move_workloads }}"
      loop_control:
        label: "{{ move.label }}"
      no_log: true

    # A backup or scheduled job started meanwhile would claim a volume or save a half-written one; Flux puts them
    # back when it resumes. Foreground, so a scheduled job's pods are gone before the volumes are touched.
    - name: "{{ move.label }} | pause its backups and scheduled jobs"
      command: "k3s kubectl -n {{ move.label }} delete schedules.k8up.io,cronjobs --all --cascade=foreground --timeout=2m"

    # A pod started while the label moves or is restored would claim its volumes.
    - name: "{{ move.label }} | scale its workloads to zero"
      command: "k3s kubectl -n {{ move.label }} scale {{ item.kind }} {{ item.name | quote }} --replicas=0"
      loop: "{{ _flux_move_workloads }}"
      loop_control:
        label: "{{ move.label }}"
      no_log: true
