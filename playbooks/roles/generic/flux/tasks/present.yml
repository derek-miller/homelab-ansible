---
- name: check the inputs
  assert:
    that:
      - flux_apps_path | length > 0
      - flux_registry_password | length > 0
      - flux_registry_htpasswd.startswith(flux_registry_user ~ ':')
      - flux_web_base_url | length > 0
      - flux_web_issuer_url | length > 0
      - flux_web_client_id | length > 0
      - flux_web_client_secret | length > 0
      - flux_web_admin | length > 0
    quiet: yes

- name: create the registry's volume
  file:
    path: "{{ flux_registry_path }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: get tokens for the charts that float
  uri:
    url: "https://ghcr.io/token?scope=repository:{{ item.value.repo }}:pull"
  loop: "{{ _flux_charts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value.version.endswith('.x')
  register: _flux_chart_tokens
  until: _flux_chart_tokens is succeeded
  retries: 3
  delay: 10
  check_mode: no

# The list runs oldest first, so a second page would hide the newest.
- name: list the floating charts' tags
  uri:
    url: "https://ghcr.io/v2/{{ item.item.value.repo }}/tags/list?n=1000"
    headers:
      Authorization: "Bearer {{ item.json.token }}"
  loop: "{{ _flux_chart_tokens.results | selectattr('json', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.key }}"
  register: _flux_chart_tags
  until: _flux_chart_tags is succeeded
  failed_when: _flux_chart_tags.status != 200 or _flux_chart_tags.link is defined
  retries: 3
  delay: 10
  check_mode: no

- name: choose each chart's release
  set_fact:
    _flux_chart_releases: "{{ _flux_chart_releases | default({}) | combine({item.key: _release}) }}"
  vars:
    _release: >-
      {{ item.value.version if not item.value.version.endswith('.x')
         else _flux_chart_tag_lists[item.key]
           | select('match', '^' ~ (item.value.version[:-2] | regex_escape)
                    ~ '\.\d+' * (3 - item.value.version[:-2].split('.') | length) ~ '$')
           | community.general.version_sort | last }}
  loop: "{{ _flux_charts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: write the Flux Operator manifest
  template:
    src: flux-operator.yaml.jinja2
    dest: "{{ _flux_manifests_dir }}/flux-operator.yaml"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: write the registry manifest
  template:
    src: zot.yaml.jinja2
    dest: "{{ _flux_manifests_dir }}/zot.yaml"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: wait for k3s to install each chart's release
  command: >-
    k3s kubectl -n {{ item.value.namespace }} get {{ item.value.workload }}
    -o 'jsonpath={.metadata.labels.helm\.sh/chart}'
  loop: "{{ _flux_charts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: _flux_chart_installed
  until: _flux_chart_installed.stdout == item.key ~ '-' ~ _flux_chart_releases[item.key]
  retries: 30
  delay: 10
  changed_when: false
  when: not ansible_check_mode

- name: wait for each chart's workload to roll out
  command: >-
    k3s kubectl -n {{ item.value.namespace }}
    rollout status {{ item.value.workload }} --timeout=5m
  loop: "{{ _flux_charts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  when: not ansible_check_mode

- name: wait for the FluxInstance API
  command: >-
    k3s kubectl get crd fluxinstances.fluxcd.controlplane.io
    -o 'jsonpath={.status.conditions[?(@.type=="Established")].status}'
  register: _flux_crd
  until: _flux_crd.stdout == 'True'
  retries: 30
  delay: 10
  changed_when: false
  when: not ansible_check_mode

- name: write the FluxInstance manifest
  template:
    src: flux.yaml.jinja2
    dest: "{{ _flux_manifests_dir }}/flux.yaml"
    owner: root
    group: root
    mode: '0600'
  register: _flux_instance_manifest
  no_log: true

# Otherwise the reconcile below can still run against the previous spec.
- name: wait for k3s to apply the FluxInstance manifest
  when: _flux_instance_manifest is changed and not ansible_check_mode
  block:
    - name: hash the FluxInstance manifest
      stat:
        path: "{{ _flux_manifests_dir }}/flux.yaml"
        checksum_algorithm: sha256
      register: _flux_instance_file

    - name: wait for k3s to apply the FluxInstance manifest
      command: k3s kubectl -n kube-system get addon flux -o 'jsonpath={.spec.checksum}'
      register: _flux_instance_addon
      until: _flux_instance_addon.stdout == _flux_instance_file.stat.checksum
      retries: 12
      delay: 5
      changed_when: false

- name: choose a reconcile request
  set_fact:
    _flux_reconcile_request: "{{ now(utc=true).isoformat() }}"

# Ready alone can still be the previous operator's verdict.
- name: ask the Flux Operator to reconcile Flux
  command: >-
    k3s kubectl -n flux-system annotate fluxinstance flux --overwrite
    reconcile.fluxcd.io/requestedAt={{ _flux_reconcile_request | quote }}
  register: _flux_reconcile
  until: _flux_reconcile is succeeded
  retries: 12
  delay: 5
  changed_when: false
  when: not ansible_check_mode

- name: wait for Flux
  command: >-
    k3s kubectl -n flux-system get fluxinstance flux
    -o 'jsonpath={.status.lastHandledReconcileAt} {.status.conditions[?(@.type=="Ready")].status}'
  register: _flux_ready
  until: _flux_ready.stdout == _flux_reconcile_request ~ ' True'
  retries: 30
  delay: 10
  changed_when: false
  when: not ansible_check_mode

- name: read the Flux version the instance runs
  command: >-
    k3s kubectl -n flux-system get fluxinstance flux
    -o 'jsonpath={.status.lastAppliedRevision}'
  register: _flux_applied
  changed_when: false
  failed_when: not ansible_check_mode and (_flux_applied.rc != 0 or _flux_version is not match('^\d+\.\d+\.\d+$'))
  check_mode: no

- name: read the flux CLI version
  command: /usr/local/bin/flux --version
  register: _flux_cli
  changed_when: false
  failed_when: false
  check_mode: no

- name: install the flux CLI the instance runs
  when:
    - _flux_version | length > 0
    - _flux_cli.stdout | default('') != 'flux version ' ~ _flux_version
  vars:
    _flux_release_url: "https://github.com/fluxcd/flux2/releases/download/v{{ _flux_version }}"
  block:
    - name: download the flux CLI
      get_url:
        url: "{{ _flux_release_url }}/flux_{{ _flux_version }}_linux_amd64.tar.gz"
        checksum: "sha256:{{ _flux_release_url }}/flux_{{ _flux_version }}_checksums.txt"
        dest: /root/flux_linux_amd64.tar.gz
        mode: '0600'
        timeout: 60
      register: _flux_download
      until: _flux_download is succeeded
      retries: 3
      delay: 15

    - name: unpack the flux CLI
      unarchive:
        src: /root/flux_linux_amd64.tar.gz
        dest: /usr/local/bin
        remote_src: yes
        include:
          - flux
        owner: root
        group: root
        mode: '0755'
      when: not ansible_check_mode
  always:
    - name: remove the flux CLI download
      file:
        path: /root/flux_linux_amd64.tar.gz
        state: absent

- include_tasks: labels.yml

- name: report each label whose apps wait to move
  debug:
    msg: >-
      {{ item }} runs on {{ _flux_held_nodes[item] }}, the inventory says
      {{ _flux_inventory_nodes[item] }}. Its k3s apps stay put until a run with
      docker_migrate_labels=yes.
  loop: "{{ _flux_inventory_nodes.keys() | sort }}"
  when: _flux_held_nodes[item] != _flux_inventory_nodes[item]

- name: refuse to deploy while a label move is unfinished
  fail:
    msg: >-
      A label move stopped part way, leaving {{ _flux_stopped_labels | join(', ') }} scaled down.
      Run the move again with docker_migrate_labels=yes to finish it.
  when: _flux_stopped_labels | length > 0

- include_tasks: place.yml
  vars:
    _flux_place_nodes: "{{ _flux_label_placement }}"

- name: write the sync manifest
  template:
    src: flux-sync.yaml.jinja2
    dest: "{{ _flux_manifests_dir }}/flux-sync.yaml"
    owner: root
    group: root
    mode: '0600'
  register: _flux_sync
  no_log: true

- name: wait for k3s to apply the sync manifest
  command: k3s kubectl -n flux-system get kustomization apps -o name
  register: _flux_sync_applied
  until: _flux_sync_applied is succeeded
  retries: 12
  delay: 5
  changed_when: false
  when: not ansible_check_mode

- include_tasks: deliver.yml
  when: not (ansible_check_mode and _flux_sync is changed)
