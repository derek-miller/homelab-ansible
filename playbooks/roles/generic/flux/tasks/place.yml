---
- name: read each node's labels
  command: >-
    k3s kubectl get nodes
    -o 'jsonpath={range .items[*]}{.metadata.name} {.metadata.labels}{"\n"}{end}'
  register: _flux_place_read
  changed_when: false
  failed_when: not ansible_check_mode and _flux_place_read.rc != 0
  check_mode: no

- name: put each label on its node
  command: "k3s kubectl label node {{ item.key | quote }} --overwrite {{ item.value | map('quote') | join(' ') }}"
  loop: "{{ _flux_place_changes | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
