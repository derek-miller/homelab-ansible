---
# Deleting the sync prunes every app Flux applied. Run this before k3s absent.
- name: find the Flux manifests
  stat:
    path: "{{ _flux_manifests_dir }}/{{ item }}.yaml"
  loop: "{{ _flux_manifests | reverse | list }}"
  register: _flux_manifest_files

- name: delete what each manifest created
  command: >-
    k3s kubectl delete --ignore-not-found --wait --timeout=10m
    -f {{ item.stat.path | quote }}
  loop: "{{ _flux_manifest_files.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: list the Flux Operator's CRDs
  command: k3s kubectl get crd -o name
  register: _flux_crds
  changed_when: false
  check_mode: no

- name: delete the Flux Operator's CRDs
  command: "k3s kubectl delete --ignore-not-found {{ item | quote }}"
  loop: "{{ _flux_crds.stdout_lines | default([]) | select('search', '\\.fluxcd\\.controlplane\\.io$') | list }}"

- name: delete the namespace the operator's chart created
  command: k3s kubectl delete namespace --ignore-not-found --wait --timeout=5m flux-system
  register: _flux_namespaces
  changed_when: "'deleted' in _flux_namespaces.stdout"

- name: remove the manifests
  file:
    path: "{{ _flux_manifests_dir }}/{{ item }}.yaml"
    state: absent
  loop: "{{ _flux_manifests }}"

# Only once the files are gone; k3s recreates an AddOn whose file still exists.
- name: delete the manifests' AddOns
  command: "k3s kubectl -n kube-system delete addon --ignore-not-found {{ _flux_manifests | map('quote') | join(' ') }}"
  register: _flux_addons
  changed_when: "'deleted' in _flux_addons.stdout"

- name: remove the registry's volume
  file:
    path: "{{ flux_registry_path }}"
    state: absent

- name: remove the flux CLI
  file:
    path: /usr/local/bin/flux
    state: absent
