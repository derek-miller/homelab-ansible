---
# Tasks that carry volume paths or app names are no_log, and failures name only the label.
- name: "{{ move.label }} | check {{ move.from }} and {{ move.to }} are in the run"
  assert:
    that:
      - hostvars[move.from].ansible_facts.default_ipv4 is defined
      - hostvars[move.to].ansible_facts.default_ipv4 is defined
    fail_msg: >-
      {{ move.label }}: the move reaches {{ move.from }} and {{ move.to }} by
      delegation, so both must be in the run; drop hosts= or add them. Nothing
      was changed.
    quiet: yes

- name: "{{ move.label }} | check the data disks and the transit share are mounted"
  command: "mountpoint -q {{ item.1 | quote }}"
  delegate_to: "{{ item.0 }}"
  become: true
  loop: "{{ [move.from, move.to] | product([k3s_local_storage_path | dirname, docker_migrate_transit_dir | dirname]) | list }}"
  changed_when: false

# The folders, not the volumes, so a move cut off after deleting its volumes still finds its data.
- name: "{{ move.label }} | find its folders on {{ move.from }}"
  shell: >-
    [ ! -d {{ (k3s_local_storage_path ~ '/' ~ move.label) | quote }} ] ||
    find {{ (k3s_local_storage_path ~ '/' ~ move.label) | quote }} -mindepth 2 -maxdepth 2 -type d -name data
  delegate_to: "{{ move.from }}"
  become: true
  register: _flux_move_found
  changed_when: false
  no_log: true

- name: "{{ move.label }} | read its volumes, charts and workloads"
  command: "k3s kubectl {{ item.args }} -o json"
  loop:
    - {name: pv, args: get persistentvolumes}
    - {name: hr, args: "-n {{ move.label }} get helmreleases.helm.toolkit.fluxcd.io"}
    - {name: workloads, args: "-n {{ move.label }} get deployments,statefulsets"}
  loop_control:
    label: "{{ item.name }}"
  register: _flux_move_reads
  changed_when: false
  no_log: true

- name: "{{ move.label }} | keep what it read"
  set_fact:
    _flux_move_pv_json: "{{ _flux_move_reads.results[0] }}"
    _flux_move_hr_json: "{{ _flux_move_reads.results[1] }}"
    _flux_move_workload_json: "{{ _flux_move_reads.results[2] }}"
    _flux_move_committed: false
  no_log: true

# With nothing of the label's on k3s, moving the label is the whole move.
- name: "{{ move.label }} | move its label to {{ move.to }}"
  include_tasks: place.yml
  vars:
    _flux_place_nodes: "{{ {move.label: move.to} }}"
  when: (_flux_move_volumes + _flux_move_pvs + _flux_move_workloads + _flux_move_charts) | length == 0

- name: "{{ move.label }} | move it"
  when: (_flux_move_volumes + _flux_move_pvs + _flux_move_workloads + _flux_move_charts) | length > 0
  environment:
    KUBECONFIG: "{{ _flux_kubeconfig }}"
  block:
    - name: "{{ move.label }} | check {{ move.from }} is a ready k3s node"
      assert:
        that: move.from in _flux_ready_nodes
        fail_msg: "{{ move.label }}: {{ move.from }} is not a ready k3s node, so its pods can't be stopped; nothing was changed."
        quiet: yes

    - name: "{{ move.label }} | check its volumes are on {{ move.from }}, where the provisioner puts them"
      assert:
        that:
          - item.node == move.from
          - item.path == k3s_local_storage_path ~ '/' ~ move.label ~ '/' ~ item.claim ~ '/data'
        fail_msg: "{{ move.label }}: a volume is not on {{ move.from }} at {{ k3s_local_storage_path }}/<namespace>/<claim>/data; nothing was changed."
        quiet: yes
      loop: "{{ _flux_move_pvs | selectattr('path') | list }}"
      loop_control:
        label: "{{ move.label }}"
      no_log: true

    - name: "{{ move.label }} | check its folders are empty or absent on {{ move.to }}"
      shell: >-
        [ ! -e {{ item | quote }} ] ||
        [ -z "$(find {{ item | quote }} -mindepth 1 -print -quit)" ]
      delegate_to: "{{ move.to }}"
      become: true
      loop: "{{ _flux_move_volumes }}"
      loop_control:
        label: "{{ move.label }}"
      register: _flux_move_targets
      changed_when: false
      failed_when: false
      no_log: true
      when: not _flux_move_overwrite

    - name: "{{ move.label }} | refuse to overwrite data on {{ move.to }}"
      fail:
        msg: >-
          {{ move.label }}: {{ move.to }} already has data in a volume folder. Set
          docker_migrate_force=yes to overwrite it; nothing was changed.
      when:
        - not _flux_move_overwrite
        - _flux_move_targets.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0

    - name: "{{ move.label }} | stop it, copy its volumes and move it to {{ move.to }}"
      block:
        - name: "{{ move.label }} | pause Flux"
          command: flux suspend kustomization apps -n flux-system

        - name: "{{ move.label }} | pause its charts"
          command: "flux suspend helmrelease {{ item | quote }} -n {{ move.label }}"
          loop: "{{ _flux_move_charts }}"
          loop_control:
            label: "{{ move.label }}"
          no_log: true

        - name: "{{ move.label }} | note its workloads' replicas on them"
          command: >-
            k3s kubectl -n {{ move.label }} annotate {{ item.kind }} {{ item.name | quote }}
            {{ _flux_replicas_annotation }}={{ item.replicas }} --overwrite --field-manager={{ _flux_mover_field_manager }}
          loop: "{{ _flux_move_workloads }}"
          loop_control:
            label: "{{ move.label }}"
          no_log: true

        # A pod started before the label moves would claim a volume on the old node.
        - name: "{{ move.label }} | scale its workloads to zero"
          command: "k3s kubectl -n {{ move.label }} scale {{ item.kind }} {{ item.name | quote }} --replicas=0"
          loop: "{{ _flux_move_workloads }}"
          loop_control:
            label: "{{ move.label }}"
          no_log: true

        - name: "{{ move.label }} | delete its volume claims"
          command: "k3s kubectl -n {{ move.label }} delete persistentvolumeclaim {{ item | quote }} --ignore-not-found --wait=false"
          loop: "{{ _flux_move_pvs | map(attribute='claim') | select | list }}"
          loop_control:
            label: "{{ move.label }}"
          no_log: true

        - name: "{{ move.label }} | delete its volumes"
          command: "k3s kubectl delete persistentvolume {{ item | quote }} --ignore-not-found --wait=false"
          loop: "{{ _flux_move_pvs | map(attribute='name') | list }}"
          loop_control:
            label: "{{ move.label }}"
          no_log: true

        - name: "{{ move.label }} | stop its pods"
          command: "k3s kubectl -n {{ move.label }} delete pods --all --wait=true --timeout=5m"
          no_log: true

        - name: "{{ move.label }} | wait for its volumes to be released"
          command: "k3s kubectl get persistentvolume {{ _flux_move_pvs | map(attribute='name') | join(' ') }} --ignore-not-found -o name"
          register: _flux_move_released
          until: _flux_move_released.stdout == ''
          retries: 30
          delay: 10
          changed_when: false
          no_log: true
          when: _flux_move_pvs | length > 0

        - name: "{{ move.label }} | copy its volumes through the transit share"
          when: _flux_move_volumes | length > 0
          block:
            - name: "{{ move.label }} | create the transit directory"
              file:
                path: "{{ docker_migrate_transit_dir }}"
                state: directory
              delegate_to: "{{ move.from }}"
              become: true

            - name: "{{ move.label }} | archive each volume on {{ move.from }}"
              command: >-
                tar --numeric-owner -C {{ item | quote }}
                -cf {{ (docker_migrate_transit_dir ~ '/k3s-' ~ move.label ~ '-' ~ index ~ '.tar') | quote }} .
              delegate_to: "{{ move.from }}"
              become: true
              loop: "{{ _flux_move_volumes }}"
              loop_control:
                label: "{{ move.label }}"
                index_var: index
              register: _flux_move_archives
              failed_when: false
              no_log: true

            - name: "{{ move.label }} | report a volume that would not archive"
              fail:
                msg: "{{ move.label }}: a volume could not be archived on {{ move.from }}."
              when: _flux_move_archives.results | selectattr('rc', 'ne', 0) | list | length > 0

            - name: "{{ move.label }} | restore each volume on {{ move.to }}"
              shell: >-
                set -eo pipefail;
                install -d -o root -g root -m 0700 {{ (item | dirname | dirname) | quote }} {{ (item | dirname) | quote }};
                {% if _flux_move_overwrite %}[ ! -e {{ item | quote }} ] || find {{ item | quote }} -mindepth 1 -delete;{% endif %}
                mkdir -p {{ item | quote }};
                tar --numeric-owner -xpf {{ (docker_migrate_transit_dir ~ '/k3s-' ~ move.label ~ '-' ~ index ~ '.tar') | quote }}
                -C {{ item | quote }}
              args:
                executable: /bin/bash
              delegate_to: "{{ move.to }}"
              become: true
              loop: "{{ _flux_move_volumes }}"
              loop_control:
                label: "{{ move.label }}"
                index_var: index
              register: _flux_move_restores
              failed_when: false
              no_log: true

            - name: "{{ move.label }} | report a volume that would not restore"
              fail:
                msg: "{{ move.label }}: a volume could not be restored on {{ move.to }}."
              when: _flux_move_restores.results | selectattr('rc', 'ne', 0) | list | length > 0

            - name: "{{ move.label }} | list each copy's files on both nodes"
              shell: >-
                set -o pipefail; cd {{ item.1 | quote }} &&
                find . \( -type f -printf '%P\t%s\t%U\t%G\t%m\n' \) -o -printf '%P\t-\t%U\t%G\t%m\n' | LC_ALL=C sort | sha256sum
              args:
                executable: /bin/bash
              delegate_to: "{{ item.0 }}"
              become: true
              loop: "{{ [move.from, move.to] | product(_flux_move_volumes) | list }}"
              loop_control:
                label: "{{ move.label }} on {{ item.0 }}"
              register: _flux_move_listings
              changed_when: false
              failed_when: false
              no_log: true

            - name: "{{ move.label }} | refuse a copy that differs from its original"
              fail:
                msg: "{{ move.label }}: a volume's copy on {{ move.to }} does not match the original on {{ move.from }}."
              when: >-
                _flux_move_listings.results | selectattr('rc', 'ne', 0) | list | length > 0
                or _flux_move_listings.results[:(_flux_move_volumes | length)] | map(attribute='stdout') | list
                   != _flux_move_listings.results[(_flux_move_volumes | length):] | map(attribute='stdout') | list

        - name: "{{ move.label }} | move its label to {{ move.to }}"
          include_tasks: place.yml
          vars:
            _flux_place_nodes: "{{ {move.label: move.to} }}"

        - name: "{{ move.label }} | note the move"
          set_fact:
            _flux_move_committed: true

        - include_tasks: migrate_resume.yml

        - name: "{{ move.label }} | set the old folders aside on {{ move.from }}"
          command: "mv {{ item | quote }} {{ (item ~ '.moved-' ~ now(utc=true).strftime('%Y%m%d%H%M%S')) | quote }}"
          delegate_to: "{{ move.from }}"
          become: true
          loop: "{{ _flux_move_volumes }}"
          loop_control:
            label: "{{ move.label }}"
          register: _flux_move_aside
          failed_when: false
          no_log: true

        - name: "{{ move.label }} | report old folders left in place"
          debug:
            msg: "{{ move.label }}: some old volume folders on {{ move.from }} could not be renamed; remove them by hand."
          when: _flux_move_aside.results | default([]) | selectattr('rc', 'ne', 0) | list | length > 0
      rescue:
        # Before the label moves the volumes come back on move.from, where the data still is.
        - name: "{{ move.label }} | keep its label on {{ move.from }}"
          include_tasks:
            file: place.yml
            apply:
              ignore_errors: true
          vars:
            _flux_place_nodes: "{{ {move.label: move.from} }}"
          when: not _flux_move_committed

        - include_tasks:
            file: migrate_resume.yml
            apply:
              ignore_errors: true

        - name: "{{ move.label }} | report the failed move"
          fail:
            msg: >-
              {{ (move.label ~ ' moved to ' ~ move.to ~ ' but did not come up healthy. Its data is on '
                  ~ move.to ~ ', with the original still on ' ~ move.from ~ '; `flux get all -A` on '
                  ~ inventory_hostname ~ ' says why.') if _flux_move_committed
                 else (move.label ~ ' could not move to ' ~ move.to ~ '; its apps are back on '
                       ~ move.from ~ ' with their data.') }}
      always:
        - name: "{{ move.label }} | remove the transit archives"
          file:
            path: "{{ docker_migrate_transit_dir }}/k3s-{{ move.label }}-{{ index }}.tar"
            state: absent
          delegate_to: "{{ move.from }}"
          become: true
          loop: "{{ range(_flux_move_volumes | length) | list }}"
          loop_control:
            label: "{{ move.label }}"
            loop_var: index
