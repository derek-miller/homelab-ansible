---
_flux_manifests_dir: "{{ k3s_data_dir }}/server/manifests"
_flux_manifests:
  - flux-operator
  - zot
  - flux
  - flux-sync

_flux_kubeconfig: /etc/rancher/k3s/k3s.yaml
_flux_work: /run/flux
_flux_registry_cluster_address: zot.zot.svc.cluster.local:5000
_flux_registry_auth: "{{ (flux_registry_user ~ ':' ~ flux_registry_password) | b64encode }}"
_flux_image_registry_auths: >-
  {{ {flux_image_registry.host: {'auth': (flux_image_registry.username ~ ':' ~ flux_image_registry.password) | b64encode}}
     if flux_image_registry else {} }}

_flux_charts:
  flux-operator:
    repo: controlplaneio-fluxcd/charts/flux-operator
    version: "{{ flux_operator_chart_version }}"
    namespace: flux-system
    workload: deployment/flux-operator
  zot:
    repo: project-zot/helm-charts/zot
    version: "{{ zot_chart_version }}"
    namespace: zot
    workload: statefulset/zot
_flux_chart_listings: "{{ _flux_chart_tags.results | default([]) | selectattr('json', 'defined') | list }}"
_flux_chart_tag_lists: >-
  {{ dict(_flux_chart_listings | map(attribute='item.item.key')
          | zip(_flux_chart_listings | map(attribute='json.tags'))) }}
_flux_version: "{{ _flux_applied.stdout | default('') | regex_replace('@.*$', '') | regex_replace('^v', '') }}"

_flux_inventory_nodes: >-
  {%- set out = {} -%}
  {%- for host in groups['docker_labels'] | default([]) | sort -%}
  {%- for label in (hostvars[host].docker_labels | default('')).split(',') | map('trim') | select -%}
  {%- set _ = out.update({label: host}) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ out }}
# A volume on a deleted node keeps its label there until a restore has moved the label's volumes off it.
_flux_volume_label_nodes: >-
  {%- set out = {} -%}
  {%- for line in _flux_volume_nodes.stdout_lines | default([]) -%}
  {%- set label, _, node = line.partition('=') -%}
  {%- if label and node and (label not in out or node not in _flux_nodes) -%}
  {%- set _ = out.update({label: node}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}
# Each label goes on its node twice: for its apps' node selectors, and as the
# ServiceLB pool its LoadBalancers name.
_flux_label_prefixes:
  - homelab.local
  - lbpool.svccontroller.k3s.cattle.io
_flux_labelled_nodes: >-
  {%- set out = {} -%}
  {%- for line in _flux_node_labels.stdout_lines | default([]) | sort -%}
  {%- set node, _, text = line.partition(' ') -%}
  {%- for key, value in (text | from_json if text else {}) | dictsort -%}
  {%- set prefix, _, label = key.partition('/') -%}
  {%- if prefix == _flux_label_prefixes[0] and value == 'true' and label not in out -%}
  {%- set _ = out.update({label: node}) -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ out }}
# Where each label's k3s apps run: the node carrying it, else its volumes'
# node, else the inventory.
_flux_held_nodes: >-
  {%- set out = {} -%}
  {%- for label, host in _flux_inventory_nodes.items() -%}
  {%- set _ = out.update({label: _flux_labelled_nodes.get(label)
                                 or _flux_volume_label_nodes.get(label) or host}) -%}
  {%- endfor -%}
  {{ out }}
_flux_label_nodes: "{{ _flux_held_nodes }}"
# A label gone from the inventory comes off every node.
_flux_label_placement: >-
  {%- set out = {} -%}
  {%- for label in _flux_labelled_nodes -%}
  {%- set _ = out.update({label: ''}) -%}
  {%- endfor -%}
  {{ out | combine(_flux_label_nodes) }}
# The kubectl label arguments that leave each label in _flux_place_nodes on its node alone.
_flux_place_changes: >-
  {%- set out = {} -%}
  {%- for line in _flux_place_read.stdout_lines | default([]) -%}
  {%- set node, _, text = line.partition(' ') -%}
  {%- set labels = text | from_json if text else {} -%}
  {%- set args = [] -%}
  {%- for label, wanted in _flux_place_nodes | dictsort -%}
  {%- for prefix in _flux_label_prefixes -%}
  {%- set key = prefix ~ '/' ~ label -%}
  {%- if wanted == node and labels.get(key) != 'true' -%}
  {%- set _ = args.append(key ~ '=true') -%}
  {%- elif wanted != node and key in labels -%}
  {%- set _ = args.append(key ~ '-') -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endfor -%}
  {%- if args -%}
  {%- set _ = out.update({node: args}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}

_flux_moves: >-
  {%- set out = [] -%}
  {%- for label, host in _flux_inventory_nodes | dictsort -%}
  {%- if _flux_held_nodes[label] != host -%}
  {%- set _ = out.append({'label': label, 'from': _flux_held_nodes[label], 'to': host}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}
_flux_nodes: "{{ _flux_node_status.stdout_lines | default([]) | map('regex_replace', '=.*$', '') | list }}"
_flux_ready_nodes: "{{ _flux_node_status.stdout_lines | select('match', '^[^=]+=True$') | map('regex_replace', '=True$', '') | list }}"
_flux_move_pvs: >-
  {%- set out = [] -%}
  {%- for pv in (_flux_move_pv_json.stdout | from_json)['items'] -%}
  {%- set claim = pv.spec.claimRef | default({}) -%}
  {%- if claim.namespace | default('') == move.label -%}
  {%- set _ = out.append({'name': pv.metadata.name, 'claim': claim.name | default(''),
        'path': (pv.spec.hostPath | default(pv.spec.local) | default({})).path | default(''),
        'node': pv.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0]['values'][0]
                if pv.spec.nodeAffinity is defined else ''}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}
_flux_move_volumes: "{{ _flux_move_found.stdout_lines | default([]) | sort }}"
# A label a move left stopped can only hold that move's own copy on the new node.
_flux_move_overwrite: "{{ docker_migrate_force | bool or move.label in _flux_stopped_labels }}"
_flux_move_charts: "{{ (_flux_move_hr_json.stdout | from_json)['items'] | map(attribute='metadata.name') | list }}"
_flux_move_workloads: >-
  {%- set out = [] -%}
  {%- for w in (_flux_move_workload_json.stdout | from_json)['items'] -%}
  {%- set noted = (w.metadata.annotations | default({})).get(_flux_replicas_annotation) -%}
  {%- set _ = out.append({'kind': w.kind | lower, 'name': w.metadata.name,
        'replicas': noted | int if noted is not none else w.spec.replicas | default(1)}) -%}
  {%- endfor -%}
  {{ out | selectattr('replicas', '>', 0) | list }}
# A move notes each workload's replicas here before scaling it to zero, as a
# field manager Flux leaves alone; it takes over any whose name starts with kubectl.
_flux_replicas_annotation: homelab.local/replicas
_flux_mover_field_manager: label-mover
_flux_resume_workloads: >-
  {%- set out = [] -%}
  {%- for w in (_flux_resume_reads.results[0].stdout | from_json)['items'] -%}
  {%- set noted = (w.metadata.annotations | default({})).get(_flux_replicas_annotation) -%}
  {%- if noted is not none -%}
  {%- set _ = out.append({'kind': w.kind | lower, 'name': w.metadata.name, 'replicas': noted | int}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}
_flux_resume_charts: "{{ (_flux_resume_reads.results[1].stdout | from_json)['items'] | map(attribute='metadata.name') | list }}"
# Of Flux's reconcile of the apps since they resumed: 'applied', 'failed', or '' while it runs.
_flux_resume_verdict: >-
  {%- set f = (_flux_resume_applied.stdout | default('')).split(' ') + [''] * 6 -%}
  {%- if f[0] and ((f[1] == f[0] and f[3] in ['ReconciliationSucceeded', 'HealthCheckFailed', 'HealthCheckCanceled'])
                   or (f[4] == f[0] and f[5] == 'Unknown')) -%}
  applied
  {%- elif f[0] and f[1] == f[0] and f[2] == 'False' -%}
  failed
  {%- endif -%}
_flux_stopped_labels: "{{ _flux_stopped_workloads.stdout | default('') | split | unique | sort }}"

_flux_restore_pod: restore
_flux_restore_from: "{{ _flux_held_nodes[k3s_restore_namespace] }}"
_flux_restore_to: "{{ _flux_inventory_nodes[k3s_restore_namespace] }}"
_flux_restore_lost: "{{ _flux_restore_from not in _flux_nodes }}"
_flux_restore_has_backups: "{{ _flux_restore_reads.results[4].stdout != '' }}"
_flux_restore_namespace_claims: "{{ (_flux_restore_reads.results[0].stdout | from_json)['items'] | map(attribute='metadata.name') | list }}"
_flux_restore_bound: >-
  {%- set out = {} -%}
  {%- for pvc in (_flux_restore_reads.results[0].stdout | from_json)['items'] -%}
  {%- set _ = out.update({pvc.metadata.name: pvc.spec.volumeName | default('')}) -%}
  {%- endfor -%}
  {{ out }}
# A claim on a volume that isn't on a node's disk, such as a NAS share, is restored only when named.
_flux_restore_local_claims: >-
  {{ _flux_restore_bound | dict2items | selectattr('value', 'in', _flux_move_pvs | selectattr('node') | map(attribute='name'))
     | map(attribute='key') | sort }}
_flux_restore_gone_pvs: "{{ _flux_move_pvs | selectattr('node') | rejectattr('node', 'in', _flux_nodes) | list }}"
_flux_restore_annotation: homelab.local/restore
# The volumes on the deleted node it moves: those a claim is still bound to, and those it noted before
# deleting their claims, so a run cut off in between makes the claim again. A removed app's stays behind.
_flux_restore_moving: >-
  {%- set gone = _flux_restore_gone_pvs | map(attribute='name') | list -%}
  {%- set out = [] -%}
  {%- for pv in (_flux_move_pv_json.stdout | from_json)['items'] if pv.metadata.name in gone and pv.spec.claimRef.name | default('') -%}
  {%- set claim = pv.spec.claimRef.name -%}
  {%- if _flux_restore_bound.get(claim) == pv.metadata.name or _flux_restore_annotation in pv.metadata.annotations | default({}) -%}
  {%- set _ = out.append({'name': pv.metadata.name, 'claim': claim,
        'remake': _flux_restore_bound.get(claim, pv.metadata.name) == pv.metadata.name,
        'pvc': {'apiVersion': 'v1', 'kind': 'PersistentVolumeClaim',
                'metadata': {'name': claim, 'namespace': move.label},
                'spec': {'storageClassName': pv.spec.storageClassName, 'accessModes': pv.spec.accessModes,
                         'volumeMode': pv.spec.volumeMode | default('Filesystem'),
                         'resources': {'requests': {'storage': pv.spec.capacity.storage}}}}}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}
_flux_restore_claims: >-
  {{ (_flux_restore_moving | map(attribute='claim') | unique | sort) if _flux_restore_lost
     else (k3s_restore_claims.split(',') | map('trim') | select | list or _flux_restore_local_claims) }}
_flux_restore_image: "{{ _flux_restore_reads.results[3].stdout }}"
# Each claim's newest snapshot, or its newest from before k3s_restore_before; restic's times are UTC.
_flux_restore_picks: >-
  {%- set out = [] -%}
  {%- for claim in _flux_restore_claims | sort -%}
  {%- set found = (_flux_restore_list.stdout | default('[]', true) if _flux_restore_list.rc | default(0) == 0 else '[]') | from_json | selectattr('paths', 'eq', ['/data/' ~ claim]) | list -%}
  {%- if k3s_restore_before -%}
  {%- set found = found | selectattr('time', 'lt', k3s_restore_before | string | replace(' ', 'T') | regex_replace('Z$', '')) | list -%}
  {%- endif -%}
  {%- if found -%}
  {%- set newest = found | sort(attribute='time') | last -%}
  {%- set _ = out.append({'claim': claim, 'id': newest.id, 'time': newest.time[:16] | replace('T', ' ')}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}
_flux_restore_missing: "{{ _flux_restore_claims | reject('in', _flux_restore_picks | map(attribute='claim')) | list }}"

_flux_stack_name: "{{ hostvars[groups['docker_swarm_manager'][0]].docker_stack_name }}"
_flux_copy_labels: "{{ swarm_volume_copies | map(attribute='label') | unique | sort }}"
_flux_copy_moving: "{{ _flux_moves | map(attribute='label') | select('in', _flux_copy_labels) | list }}"
_flux_copies_pending: >-
  {%- set out = [] -%}
  {%- for result in _flux_copy_state.results | default([]) if result.stdout | default('') not in ['', 'missing'] -%}
  {%- set _ = out.append(result.item | combine({'source': result.stdout,
        'dest': k3s_local_storage_path ~ '/' ~ result.item.label ~ '/' ~ result.item.claim ~ '/data'})) -%}
  {%- endfor -%}
  {{ out }}
_flux_copies_missing: >-
  {{ _flux_copy_state.results | default([]) | selectattr('stdout', 'defined') | selectattr('stdout', 'eq', 'missing')
     | map(attribute='item.label') | unique | sort }}
_flux_copy_node: "{{ _flux_held_nodes[copy_label] }}"
_flux_copy_entries: "{{ _flux_copies_pending | selectattr('label', 'eq', copy_label) | list }}"
_flux_copy_filters: >-
  {% for entry in _flux_copy_entries %}--filter volume={{ (_flux_stack_name ~ '_' ~ entry.volume) | quote }} {% endfor %}
_flux_copy_stack_users: >-
  {%- set volumes = _flux_copies_pending | map(attribute='volume') | list -%}
  {%- set out = [] -%}
  {%- for name, service in (hostvars[groups['docker_swarm_manager'][0]].docker_stack_definition.services | default({})) | dictsort -%}
  {%- for volume in service.volumes | default([]) -%}
  {%- if (volume.source | default('') if volume is mapping else volume.split(':')[0]) in volumes -%}
  {%- set _ = out.append(name) -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ out | unique | list }}
_flux_copy_services: >-
  {%- set out = {} -%}
  {%- for line in _flux_copy_replicas.stdout_lines | default([]) -%}
  {%- set name, _, replicas = line.partition(' ') -%}
  {%- set _ = out.update({name: replicas}) -%}
  {%- endfor -%}
  {{ out }}
_flux_copy_backup: "{{ _flux_stack_name }}_backup_{{ copy_label }}"
_flux_copy_apps: "{{ _flux_copy_services.keys() | reject('eq', _flux_copy_backup) | list }}"
