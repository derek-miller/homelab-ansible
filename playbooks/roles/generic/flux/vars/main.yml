---
_flux_manifests_dir: "{{ k3s_data_dir }}/server/manifests"
_flux_manifests:
  - flux-operator
  - reloader
  - zot
  - flux
  - flux-sync

_flux_kubeconfig: /etc/rancher/k3s/k3s.yaml
_flux_work: /run/flux
_flux_registry_cluster_address: zot.zot.svc.cluster.local:5000
_flux_registry_auth: "{{ (flux_registry_user ~ ':' ~ flux_registry_password) | b64encode }}"

_flux_charts:
  flux-operator:
    repo: controlplaneio-fluxcd/charts/flux-operator
    version: "{{ flux_operator_chart_version }}"
    namespace: flux-system
    workload: deployment/flux-operator
  reloader:
    repo: stakater/charts/reloader
    version: "{{ reloader_chart_version }}"
    namespace: reloader
    workload: deployment/reloader-reloader
  zot:
    repo: project-zot/helm-charts/zot
    version: "{{ zot_chart_version }}"
    namespace: zot
    workload: statefulset/zot
_flux_chart_listings: "{{ _flux_chart_tags.results | default([]) | selectattr('json', 'defined') | list }}"
_flux_chart_tag_lists: >-
  {{ dict(_flux_chart_listings | map(attribute='item.item.key')
          | zip(_flux_chart_listings | map(attribute='json.tags'))) }}
_flux_version: "{{ _flux_applied.stdout | default('') | regex_replace('@.*$', '') | regex_replace('^v', '') }}"
