---
_flux_manifests_dir: "{{ k3s_data_dir }}/server/manifests"
_flux_manifests:
  - flux-operator
  - zot
  - flux
  - flux-sync

_flux_kubeconfig: /etc/rancher/k3s/k3s.yaml
_flux_work: /run/flux
_flux_registry_cluster_address: zot.zot.svc.cluster.local:5000
_flux_registry_auth: "{{ (flux_registry_user ~ ':' ~ flux_registry_password) | b64encode }}"

_flux_charts:
  flux-operator:
    repo: controlplaneio-fluxcd/charts/flux-operator
    version: "{{ flux_operator_chart_version }}"
    namespace: flux-system
    workload: deployment/flux-operator
  zot:
    repo: project-zot/helm-charts/zot
    version: "{{ zot_chart_version }}"
    namespace: zot
    workload: statefulset/zot
_flux_chart_listings: "{{ _flux_chart_tags.results | default([]) | selectattr('json', 'defined') | list }}"
_flux_chart_tag_lists: >-
  {{ dict(_flux_chart_listings | map(attribute='item.item.key')
          | zip(_flux_chart_listings | map(attribute='json.tags'))) }}
_flux_version: "{{ _flux_applied.stdout | default('') | regex_replace('@.*$', '') | regex_replace('^v', '') }}"

_flux_inventory_nodes: >-
  {%- set out = {} -%}
  {%- for host in groups['docker_labels'] | default([]) | sort -%}
  {%- for label in (hostvars[host].docker_labels | default('')).split(',') | map('trim') | select -%}
  {%- set _ = out.update({label: host}) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ out }}
_flux_volume_label_nodes: >-
  {%- set out = {} -%}
  {%- for line in _flux_volume_nodes.stdout_lines | default([]) -%}
  {%- set label, _, node = line.partition('=') -%}
  {%- if label and node and label not in out -%}
  {%- set _ = out.update({label: node}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}
# Each label goes on its node twice: for its apps' node selectors, and as the
# ServiceLB pool its LoadBalancers name.
_flux_label_prefixes:
  - homelab.local
  - lbpool.svccontroller.k3s.cattle.io
_flux_labelled_nodes: >-
  {%- set out = {} -%}
  {%- for line in _flux_node_labels.stdout_lines | default([]) | sort -%}
  {%- set node, _, text = line.partition(' ') -%}
  {%- for key, value in (text | from_json if text else {}) | dictsort -%}
  {%- set prefix, _, label = key.partition('/') -%}
  {%- if prefix == _flux_label_prefixes[0] and value == 'true' and label not in out -%}
  {%- set _ = out.update({label: node}) -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ out }}
# Where each label's k3s apps run: the node carrying it, else its volumes'
# node, else the inventory.
_flux_held_nodes: >-
  {%- set out = {} -%}
  {%- for label, host in _flux_inventory_nodes.items() -%}
  {%- set _ = out.update({label: _flux_labelled_nodes.get(label)
                                 or _flux_volume_label_nodes.get(label) or host}) -%}
  {%- endfor -%}
  {{ out }}
_flux_label_nodes: "{{ _flux_inventory_nodes if docker_migrate_labels | bool else _flux_held_nodes }}"
# A label gone from the inventory comes off every node.
_flux_label_placement: >-
  {%- set out = {} -%}
  {%- for label in _flux_labelled_nodes -%}
  {%- set _ = out.update({label: ''}) -%}
  {%- endfor -%}
  {{ out | combine(_flux_label_nodes) }}
# The kubectl label arguments that leave each label in _flux_place_nodes on its node alone.
_flux_place_changes: >-
  {%- set out = {} -%}
  {%- for line in _flux_place_read.stdout_lines | default([]) -%}
  {%- set node, _, text = line.partition(' ') -%}
  {%- set labels = text | from_json if text else {} -%}
  {%- set args = [] -%}
  {%- for label, wanted in _flux_place_nodes | dictsort -%}
  {%- for prefix in _flux_label_prefixes -%}
  {%- set key = prefix ~ '/' ~ label -%}
  {%- if wanted == node and labels.get(key) != 'true' -%}
  {%- set _ = args.append(key ~ '=true') -%}
  {%- elif wanted != node and key in labels -%}
  {%- set _ = args.append(key ~ '-') -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endfor -%}
  {%- if args -%}
  {%- set _ = out.update({node: args}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}
