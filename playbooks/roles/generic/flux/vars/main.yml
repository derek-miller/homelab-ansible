---
_flux_manifests_dir: "{{ k3s_data_dir }}/server/manifests"
_flux_manifests:
  - flux-operator
  - zot
  - flux
  - flux-sync

_flux_kubeconfig: /etc/rancher/k3s/k3s.yaml
_flux_work: /run/flux
_flux_registry_cluster_address: zot.zot.svc.cluster.local:5000
_flux_registry_auth: "{{ (flux_registry_user ~ ':' ~ flux_registry_password) | b64encode }}"

_flux_charts:
  flux-operator:
    repo: controlplaneio-fluxcd/charts/flux-operator
    version: "{{ flux_operator_chart_version }}"
    namespace: flux-system
    workload: deployment/flux-operator
  zot:
    repo: project-zot/helm-charts/zot
    version: "{{ zot_chart_version }}"
    namespace: zot
    workload: statefulset/zot
_flux_chart_listings: "{{ _flux_chart_tags.results | default([]) | selectattr('json', 'defined') | list }}"
_flux_chart_tag_lists: >-
  {{ dict(_flux_chart_listings | map(attribute='item.item.key')
          | zip(_flux_chart_listings | map(attribute='json.tags'))) }}
_flux_version: "{{ _flux_applied.stdout | default('') | regex_replace('@.*$', '') | regex_replace('^v', '') }}"

_flux_inventory_nodes: >-
  {%- set out = {} -%}
  {%- for host in groups['docker_labels'] | default([]) | sort -%}
  {%- for label in (hostvars[host].docker_labels | default('')).split(',') | map('trim') | select -%}
  {%- set _ = out.update({label: host}) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ out }}
_flux_apps_exists: "{{ (_flux_label_record.stdout | default('')).startswith('apps ') }}"
_flux_label_record_map: >-
  {{ (_flux_label_record.stdout[5:] | from_json)
     if _flux_apps_exists and _flux_label_record.stdout[5:] | trim else {} }}
_flux_volume_label_nodes: >-
  {%- set out = {} -%}
  {%- for line in _flux_volume_nodes.stdout_lines | default([]) -%}
  {%- set label, _, node = line.partition('=') -%}
  {%- if label and node and label not in out -%}
  {%- set _ = out.update({label: node}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}
# Where each label's k3s apps run: the last applied sync manifest, else its
# volumes' node, else the inventory.
_flux_held_nodes: >-
  {%- set out = {} -%}
  {%- for label, host in _flux_inventory_nodes.items() -%}
  {%- set _ = out.update({label: _flux_label_record_map.get('node_' ~ label)
                                 or _flux_volume_label_nodes.get(label) or host}) -%}
  {%- endfor -%}
  {{ out }}
_flux_label_nodes: "{{ _flux_inventory_nodes if docker_migrate_labels | bool else _flux_held_nodes }}"
_flux_volume_list: "{{ (_flux_volume_check.stdout | from_json).volumes }}"
_flux_volume_hosts: "{{ _flux_volume_list | map(attribute='label') | map('extract', _flux_label_nodes) | unique | sort }}"
# Delegating to a host outside the run fails: its connection is set up only in the run.
_flux_volume_hosts_reached: >-
  {{ _flux_volume_hosts | select('in', groups['all'] | map('extract', hostvars)
     | selectattr('ansible_facts.default_ipv4', 'defined') | map(attribute='inventory_hostname') | list) | list }}
_flux_volumes_reached: >-
  {{ _flux_volume_list | selectattr('label', 'in', _flux_label_nodes | dict2items
     | selectattr('value', 'in', _flux_volume_hosts_reached) | map(attribute='key') | list) | list }}
