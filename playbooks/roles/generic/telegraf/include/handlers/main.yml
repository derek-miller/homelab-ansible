---
- name: restart telegraf
  service:
    name: telegraf
    state: restarted
  when: ansible_service_mgr != 'launchd'

# restarted unloads and reloads the job, so a changed plist takes effect. A
# dry run may not have the plist to find.
- name: restart telegraf (launchd)
  community.general.launchd:
    name: "{{ telegraf_launchd_label }}"
    state: restarted
  when: ansible_service_mgr == 'launchd' and not ansible_check_mode
  listen: restart telegraf
