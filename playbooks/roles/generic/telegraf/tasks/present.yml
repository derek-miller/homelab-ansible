---
# Present path: install, render config, start service.

- include_tasks: "setup-{{ ansible_os_family | lower }}.yml"

- name: ensure telegraf conf directory exists
  file:
    path: "{{ telegraf_conf_dir }}"
    state: directory
    mode: '0755'

- name: config telegraf
  template:
    src: telegraf.conf.jinja2
    dest: "{{ telegraf_conf }}"
    owner: root
    group: "{{ root_group }}"
    mode: 0644
  notify: restart telegraf

- include_tasks: cleanup-backups.yml

- include_tasks: "present-{{ ansible_os_family | lower }}.yml"
