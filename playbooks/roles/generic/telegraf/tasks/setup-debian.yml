---
# Its postinst adds a second influxdata source, influxdata.list.
- name: remove influxdata-archive-keyring
  apt:
    name: influxdata-archive-keyring
    state: absent
    purge: yes

- name: remove old influxdata source files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/influxdata.list
    - /usr/share/keyrings/influxdata-archive.gpg
    - /etc/apt/keyrings/influxdata-archive.gpg

- name: add influxdata repository
  deb822_repository:
    name: influxdata
    types: deb
    uris: https://repos.influxdata.com/debian
    suites: stable
    components: main
    signed_by: https://repos.influxdata.com/influxdata-archive.key
  register: _influxdata_repo

- name: update apt cache
  apt:
    update_cache: yes
  when: _influxdata_repo is changed

- name: install telegraf dependencies
  apt:
    name: "{{ telegraf_apt_dependencies }}"
    state: latest
  notify: restart telegraf

# telegraf recommends influxdata-archive-keyring, removed above.
- name: install telegraf
  apt:
    name: telegraf
    state: latest
    install_recommends: no
  notify: restart telegraf
