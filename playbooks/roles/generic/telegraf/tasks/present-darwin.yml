---
- name: ensure telegraf log directory exists
  file:
    path: "{{ telegraf_log_dir }}"
    state: directory
    owner: root
    group: "{{ root_group }}"
    mode: '0755'

- name: install telegraf LaunchDaemon
  template:
    src: telegraf.launchd.plist.jinja2
    dest: "/Library/LaunchDaemons/{{ telegraf_launchd_label }}.plist"
    owner: root
    group: "{{ root_group }}"
    mode: 0644
  register: _telegraf_launchd_plist
  notify: restart telegraf

# A dry run doesn't write the plist, so a first install has no job to start.
- name: start telegraf
  community.general.launchd:
    name: "{{ telegraf_launchd_label }}"
    state: started
  register: _telegraf_launchd
  failed_when: >-
    _telegraf_launchd is failed
    or (not ansible_check_mode and _telegraf_launchd.status.current_state != 'started')
  when: not (ansible_check_mode and _telegraf_launchd_plist is changed)
