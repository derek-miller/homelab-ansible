---
- name: stop and disable telegraf service
  service:
    name: telegraf
    state: stopped
    enabled: no
  failed_when: false

- name: uninstall telegraf
  apt:
    name:
      - telegraf
      - influxdata-archive-keyring
    state: absent
    purge: yes

- name: uninstall telegraf dependencies
  apt:
    name: "{{ telegraf_apt_dependencies }}"
    state: absent
    purge: yes

- name: remove influxdata repository
  deb822_repository:
    name: influxdata
    state: absent
    install_python_debian: yes
  register: _influxdata_repo

- name: remove the keyring package's influxdata source
  file:
    path: /etc/apt/sources.list.d/influxdata.list
    state: absent
  register: _influxdata_old_repo

- name: update apt cache
  apt:
    update_cache: yes
  when: _influxdata_repo is changed or _influxdata_old_repo is changed

- name: remove telegraf conf directory
  file:
    path: "{{ telegraf_conf_dir }}"
    state: absent
