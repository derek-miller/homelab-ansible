---
- name: check for the telegraf LaunchDaemon
  stat:
    path: "/Library/LaunchDaemons/{{ telegraf_launchd_label }}.plist"
  register: _telegraf_plist

- name: unload telegraf
  community.general.launchd:
    name: "{{ telegraf_launchd_label }}"
    state: unloaded
  when: _telegraf_plist.stat.exists

- name: remove telegraf LaunchDaemon
  file:
    path: "/Library/LaunchDaemons/{{ telegraf_launchd_label }}.plist"
    state: absent

- name: remove telegraf log directory
  file:
    path: "{{ telegraf_log_dir }}"
    state: absent

- name: remove telegraf conf directory
  file:
    path: "{{ telegraf_conf_dir }}"
    state: absent

- name: brew uninstall telegraf
  community.general.homebrew:
    name: telegraf
    state: absent
  become_user: "{{ mac_user }}"

# brew uninstall leaves the sample config `brew install` put in etc.
- name: remove Homebrew's telegraf config
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ homebrew_prefix }}/etc/telegraf.conf"
    - "{{ homebrew_prefix }}/etc/telegraf.conf.default"
    - "{{ homebrew_prefix }}/etc/telegraf.d"
