---
- assert:
    that: python_state == 'present'
    quiet: yes

- name: set up pip3 and venv (apt-based)
  when: ansible_os_family == 'Debian'
  block:
    - name: install pip3, venv and build dependencies
      apt:
        name:
          - python3-pip
          - python3-venv
          - build-essential
          - libssl-dev
          - libffi-dev
          - python3-cffi
          - python3-dev
          - python3-apt
        state: latest
        update_cache: yes
        cache_valid_time: 3600

    - name: probe pip3 presence (always passes --disable-pip-version-check below)
      # pip gained --disable-pip-version-check in 6.0 (released 2015). Every
      # host in this inventory runs pip far newer than that, so there's no
      # point in gating the flag on a version comparison — `changed=false`
      # here makes the downstream extra_args expression unconditionally
      # emit --disable-pip-version-check.
      command: pip3 --version
      register: pip_no_disable_pip_version_check
      changed_when: false

    - name: check if pip3 needs break-system-packages flag
      command: pip3 install --help
      register: pip_break_system_packages_check
      changed_when: false

    - name: set pip_break_system_packages var
      set_fact:
        pip_break_system_packages: "{{ ' --break-system-packages ' in pip_break_system_packages_check.stdout }}"

    - name: upgrade/downgrade setuptools and pip
      pip:
        name:
          - setuptools{{ setuptools_version_spec }}
          - pip{{ pip_version_spec }}
        executable: pip3
        extra_args: "{{ '--break-system-packages' if pip_break_system_packages else '' }} {{ '' if pip_no_disable_pip_version_check is changed else '--disable-pip-version-check' }}"
        state: latest
      when: >-
        not (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int >= 24)
        and not (ansible_distribution == 'Debian' and ansible_distribution_major_version | int >= 12)

    - name: check for a pip-installed virtualenv
      stat:
        path: /usr/local/bin/virtualenv
      register: python_pip_virtualenv

    - name: uninstall the pip-installed virtualenv
      pip:
        name: virtualenv
        executable: pip3
        extra_args: "{{ '--break-system-packages' if pip_break_system_packages else '' }} --disable-pip-version-check"
        state: absent
      when: python_pip_virtualenv.stat.exists

    # pip removes a directory outright once every file in it belongs to the
    # package, so uninstalling virtualenv can take /usr/local/bin with it, and
    # nothing else recreates it.
    - name: keep /usr/local/bin
      file:
        path: /usr/local/bin
        state: directory
        owner: root
        group: root
        mode: '0755'

# Apple's /usr/bin/python3 is 3.9; venvs build from Homebrew's Python instead.
- name: install Python via Homebrew (macOS)
  when: ansible_os_family == 'Darwin'
  block:
    # Brew can't upgrade or remove a keg holding files root wrote.
    - name: hand root-owned files in the Homebrew Python kegs back to mac_user
      command: >-
        find {{ homebrew_prefix }}/Cellar -depth 1 ! -name 'python@*' -prune
        -o -user root -print -exec chown -h {{ mac_user }} {} +
      register: _python_keg_root_files
      changed_when: _python_keg_root_files.stdout | length > 0

    - name: install the Homebrew Python formula
      community.general.homebrew:
        name: "{{ python_homebrew_formula }}"
        state: latest
      become_user: "{{ mac_user }}"

    # Compiled ahead as mac_user, root's module runs only read the bytecode.
    - name: compile the Homebrew Python standard library
      command: >-
        {{ python_base_interpreter }} -m compileall -j0 -x /test/
        {{ python_homebrew_stdlib }}
      register: _python_compileall
      changed_when: "'Compiling ' in _python_compileall.stdout"
      become_user: "{{ mac_user }}"
