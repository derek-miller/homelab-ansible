---
- assert:
    that: python_state == 'present'
    quiet: yes

- name: install pip3, venv and build dependencies
  apt:
    name:
      - python3-pip
      - python3-venv
      - build-essential
      - libssl-dev
      - libffi-dev
      - python3-cffi
      - python3-dev
      - python3-apt
    state: latest
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: uninstall the dependencies the pip-installed virtualenv left behind
  when: ansible_os_family == 'Debian'
  block:
    - name: find them in the system Python's /usr/local site-packages
      find:
        paths: /usr/local/lib/python{{ ansible_python.version.major }}.{{ ansible_python.version.minor }}/dist-packages
        patterns:
          - distlib-*.dist-info
          - filelock-*.dist-info
          - platformdirs-*.dist-info
          - python_discovery-*.dist-info
        file_type: directory
      register: _python_virtualenv_leftovers

    - name: uninstall them with the system pip
      pip:
        name: "{{ _python_virtualenv_leftovers.files | map(attribute='path') | map('basename') | map('regex_replace', '-.*', '') | list }}"
        executable: pip3
        state: absent
      environment:
        PIP_BREAK_SYSTEM_PACKAGES: '1'
      when: _python_virtualenv_leftovers.matched > 0

# Apple's /usr/bin/python3 is 3.9; venvs build from Homebrew's Python instead.
- name: install Python via Homebrew (macOS)
  when: ansible_os_family == 'Darwin'
  block:
    # Brew can't upgrade or remove a keg holding files root wrote.
    - name: hand root-owned files in the Homebrew Python kegs back to mac_user
      command: >-
        find {{ homebrew_prefix }}/Cellar -depth 1 ! -name 'python@*' -prune
        -o -user root -print -exec chown -h {{ mac_user }} {} +
      register: _python_keg_root_files
      changed_when: _python_keg_root_files.stdout | length > 0

    - name: install the Homebrew Python formula
      community.general.homebrew:
        name: "{{ python_homebrew_formula }}"
        state: latest
      become_user: "{{ mac_user }}"

    # Otherwise brew autoremove deletes it once no other formula depends on it.
    - name: mark the Homebrew Python formula as installed on request
      command: "{{ homebrew_prefix }}/bin/brew tab --installed-on-request {{ python_homebrew_formula }}"
      register: _python_tab
      changed_when: "'already marked' not in _python_tab.stdout"
      become_user: "{{ mac_user }}"

    # Compiled ahead as mac_user, root's module runs only read the bytecode.
    - name: compile the Homebrew Python standard library
      command: >-
        {{ python_base_interpreter }} -m compileall -j0 -x /test/
        {{ python_homebrew_stdlib }}
      register: _python_compileall
      changed_when: "'Compiling ' in _python_compileall.stdout"
      become_user: "{{ mac_user }}"
