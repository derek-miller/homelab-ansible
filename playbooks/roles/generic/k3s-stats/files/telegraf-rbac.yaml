---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telegraf
  namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: telegraf-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: telegraf
type: kubernetes.io/service-account-token
---
# The kubelet checks nodes/stats for /stats/summary and nodes/pods for /pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: telegraf
rules:
  - apiGroups:
      - ""
    resources:
      - nodes/stats
      - nodes/pods
    verbs:
      - get
  # Only the server's Telegraf lists these.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: telegraf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: telegraf
subjects:
  - kind: ServiceAccount
    name: telegraf
    namespace: kube-system
