---
- name: give telegraf a login on the cluster
  copy:
    src: telegraf-rbac.yaml
    dest: "{{ _k3s_stats_manifest }}"
    owner: root
    group: root
    mode: '0600'
  when: k3s_role == 'server'

# In check mode on a fresh host there is no cluster yet to read from.
- name: give telegraf its token and the cluster CA
  when: not (ansible_check_mode and _k3s_unit | default({}) is changed)
  block:
    # k3s applies the manifest and the cluster fills in the token a few seconds later.
    - name: read telegraf's token
      command: k3s kubectl -n kube-system get secret telegraf-token -o 'jsonpath={.data.token}'
      delegate_to: "{{ k3s_server_host }}"
      register: _k3s_stats_token
      until: _k3s_stats_token.stdout | length > 0
      retries: 12
      delay: 5
      changed_when: false
      check_mode: no
      no_log: true

    # Telegraf won't start with a kube_inventory conf whose token file is missing.
    - name: write telegraf's token
      copy:
        dest: "{{ k3s_stats_token_path }}"
        content: "{{ _k3s_stats_token.stdout | b64decode }}"
        owner: root
        group: telegraf
        mode: '0440'
      no_log: true

    - name: give telegraf a readable copy of the k3s CA
      copy:
        src: "{{ k3s_data_dir }}/agent/server-ca.crt"
        remote_src: yes
        dest: "{{ k3s_stats_ca_path }}"
        owner: root
        group: root
        mode: '0644'
      notify: restart telegraf

- include_role:
    name: generic/telegraf/plugin
  vars:
    telegraf_plugin_conf_src: k3s-stats.conf.jinja2
    telegraf_plugin_conf: k3s-stats.conf
    telegraf_plugin_state: present
