---
- name: stop and disable the grafana-check timer
  systemd:
    name: grafana-check.timer
    state: stopped
    enabled: no
  failed_when: false

- name: remove grafana-check
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/grafana-check.timer
    - /etc/systemd/system/grafana-check.service
    - /etc/default/grafana-check
    - /usr/local/sbin/grafana-check
    - /var/lib/grafana-check
  register: _grafana_check_files

- name: reload systemd daemon
  systemd:
    daemon_reload: yes
  when: _grafana_check_files is changed
