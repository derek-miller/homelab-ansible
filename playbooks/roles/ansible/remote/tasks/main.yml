---
# First, so the become PATH is right for every later task that runs a command
# by name; bootstrap only runs on request.
- name: keep the surrogate's sudoers entry and password lock current
  include_role:
    name: ansible/setup/bootstrap
    tasks_from: surrogate.yml

- name: install the apt modules' Python bindings (Debian)
  apt:
    name: python3-apt
    state: latest
  when: ansible_os_family == 'Debian'
  tags:
    - base

- name: create ansible remote dir
  file:
    path: "{{ ansible_python_dir }}"
    state: directory
  tags:
    - base

- name: copy ansible remote requirements.txt
  copy:
    src: requirements.txt
    dest: "{{ ansible_python_dir }}/requirements.txt"
    owner: root
    group: "{{ root_group }}"
    mode: 0644
  tags:
    - base

# Installing a lock never removes what an earlier lock pinned.
- name: list the packages in the ansible remote venv
  command: "{{ ansible_python_virtualenv }}/bin/python3 -m pip list --local --format=json --disable-pip-version-check"
  register: _remote_pip_list
  changed_when: false
  failed_when: _remote_pip_list.rc != 0 and not ansible_check_mode
  check_mode: no
  tags:
    - base

- name: remove packages the lock no longer pins
  pip:
    virtualenv: "{{ ansible_python_virtualenv }}"
    name: "{{ _unpinned }}"
    state: absent
  vars:
    _pinned: >-
      {{ lookup('ansible.builtin.file', role_path ~ '/files/requirements.txt')
         | regex_findall('(?m)^([A-Za-z0-9][A-Za-z0-9._-]*)(?:\[[^]]*\])?==')
         | map('lower') | map('regex_replace', '[-_.]+', '-') | list }}
    _unpinned: >-
      {{ _remote_pip_list.stdout | from_json | map(attribute='name')
         | map('lower') | map('regex_replace', '[-_.]+', '-')
         | reject('in', _pinned + ['pip', 'setuptools']) | list }}
  when:
    - _remote_pip_list.rc == 0
    - _unpinned | length > 0
  tags:
    - base

- name: install ansible remote dependencies
  pip:
    virtualenv: "{{ ansible_python_virtualenv }}"
    requirements: "{{ ansible_python_dir }}/requirements.txt"
    state: present
  tags:
    - base

- name: set ansible python interpreter
  set_fact:
    ansible_python_interpreter: "{{ ansible_python_virtualenv }}/bin/python3"
