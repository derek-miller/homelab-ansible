---
- name: make local ssh key dir
  file:
    path: "{{ local_ssh_key_dir }}"
    mode: 0700
    state: directory
  delegate_to: 127.0.0.1 # Run locally
  check_mode: no
  run_once: yes

- name: copy ansible surrogate user ssh private key
  copy:
    src: "{{ ansible_surrogate_private_key_file }}"
    dest: "{{ local_ssh_key_dir }}/{{ ansible_surrogate_private_key_file|basename }}"
    mode: 0600
  delegate_to: 127.0.0.1 # Run locally
  check_mode: no
  run_once: yes

- name: use ansible surrogate user
  set_fact:
    ansible_ssh_user: "{{ ansible_surrogate_user }}"
  when: ansible_ssh_user is not defined
  check_mode: no

- name: set ansible ssh private key file
  set_fact:
    ansible_ssh_private_key_file: "{{ local_ssh_key_dir }}/{{ ansible_surrogate_private_key_file|basename }}"
  when: ansible_ssh_user == ansible_surrogate_user
  check_mode: no

- name: become root
  set_fact:
    ansible_become: yes

# Before facts: until the Command Line Tools exist, /usr/bin/python3 is a stub.
- name: install the Command Line Tools (macOS)
  raw: |
    set -e
    xcode-select -p >/dev/null 2>&1 && exit 0
    trigger=/tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
    touch "$trigger"
    trap 'rm -f "$trigger"' EXIT
    label=$(softwareupdate -l | sed -n 's/^\* Label: //p' | grep 'Command Line Tools' | sort -V | tail -n1)
    softwareupdate -i "$label"
    echo installed
  register: _clt_install
  changed_when: "'installed' in _clt_install.stdout"
  when: "'macos' in group_names"

- name: set ansible hostname
  set_fact:
    ansible_hostname: "{{ inventory_hostname }}"
