---
# Proxmox VE cluster
#
#   make bootstrap-proxmox user=root   # first contact on fresh nodes
#   make run-proxmox [hosts=pve3]
#
# Does not use ansible/setup/connection: that role forces the `ansible` surrogate
# user and become-to-root, and PVE has no sudo — root@pam is its admin identity.

- name: materialise the controller ssh key
  hosts: localhost
  gather_facts: no
  vars:
    key_name: "{{ ansible_surrogate_user }}-id_ed25519"
  tasks:
    - name: make the local ssh key dir
      file:
        path: "{{ playbook_dir }}/../.ssh"
        mode: 0700
        state: directory

    - name: copy the ansible private key out of the vault
      copy:
        src: "vault/{{ key_name }}"
        dest: "{{ playbook_dir }}/../.ssh/{{ key_name }}"
        mode: 0600
  tags:
    - always

- name: connect and gather facts
  hosts: proxmox
  tasks:
    # setup does not populate ansible_facts.packages; only this does, and the
    # summary below reads pve-manager out of it. It fails the host outright when
    # no manager yields packages, so a fresh node without python3-apt would abort
    # this always-tagged play; the summary already degrades to '?' without it.
    - name: gather package facts
      package_facts:
        manager: apt
      failed_when: false

    - name: node summary
      debug:
        msg: >-
          {{ ansible_all_ipv4_addresses | join(' ') }},
          {{ ansible_distribution }} {{ ansible_distribution_version }},
          {{ ansible_processor_vcpus }} CPU(s),
          {{ ansible_memtotal_mb }} MB memory,
          pve {{ ansible_facts.packages['pve-manager'][0].version | default('?') }}
  tags:
    - always
    - connect

- name: proxmox nodes
  hosts: proxmox
  roles:
    - role: generic/proxmox
  tags:
    - proxmox
    - proxmox-node

- name: bootstrap the proxmox cluster
  hosts: proxmox
  roles:
    - role: generic/proxmox
      proxmox_scope: bootstrap
      when: bootstrap | default(false) | bool
  tags:
    - bootstrap

- name: proxmox cluster
  hosts: proxmox_primary
  roles:
    - role: generic/proxmox
      proxmox_scope: cluster
  tags:
    - proxmox
    - proxmox-cluster

- name: telegraf
  hosts: proxmox
  roles:
    - role: generic/telegraf
  tags:
    - telegraf

- name: proxmox guest templates
  hosts: proxmox
  roles:
    - role: generic/proxmox-guest
      proxmox_guest_scope: template
  tags:
    - proxmox-guest
    - proxmox-guest-template

- name: proxmox guests
  hosts: proxmox_primary
  roles:
    - role: generic/proxmox-guest
      proxmox_guest_scope: guests
  tags:
    - proxmox-guest
    - proxmox-guest-vm

# Rolling reboot, opt-in. serial/order cannot express a custom host order, hence
# running once from the controller and delegating.
#
#   make run-proxmox tags=proxmox-reboot ANSIBLE_FLAGS="-e proxmox_reboot_enabled=yes"
#
# Defaults to group order; append -e proxmox_reboot_order='["pve3","pve1"]' to change it.
- name: proxmox rolling reboot
  hosts: localhost
  gather_facts: no
  roles:
    - role: generic/proxmox-reboot
  tags:
    - proxmox-reboot

- name: reapply proxmox node config after an upgrade
  hosts: proxmox
  roles:
    - role: generic/proxmox
      proxmox_scope: node
      when: proxmox_upgrade_enabled | default(false) | bool
  tags:
    - proxmox-reboot
