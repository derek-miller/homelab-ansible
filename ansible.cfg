[defaults]
collections_path = playbooks/collections
inject_facts_as_vars = True
interpreter_python = /usr/bin/python3
force_valid_group_names = ignore
forks = 100
gathering = smart
host_key_checking = True
local_tmp = ~/.ansible/tmp
merge_multiple_cli_tags = True
no_target_syslog = True
remote_tmp = ~/.ansible/tmp
retry_files_enabled = False
show_custom_stats = True
timeout = 30

[ssh_connection]
control_path_dir = ~/.ansible/cp
pipelining = True
retries = 3
# make decrypts .ssh/known_hosts from playbooks/files/vault/known_hosts before every run.
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o HostKeyAlgorithms=ssh-ed25519,ssh-rsa -o UserKnownHostsFile=.ssh/known_hosts -o StrictHostKeyChecking=yes
