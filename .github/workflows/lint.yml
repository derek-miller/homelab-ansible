---
name: Lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pin=$(grep -E '^yamllint==' requirements.txt)
          python -m venv .venv
          source .venv/bin/activate
          pip install "$pin"
          make lint
          make test
