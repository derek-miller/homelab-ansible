---
name: Lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: |
          pin=$(grep -oE '^yamllint==[^ ]+' requirements.txt)
          python -m venv .venv
          source .venv/bin/activate
          pip install "$pin"
          make lint
          make vault-check
          make test
