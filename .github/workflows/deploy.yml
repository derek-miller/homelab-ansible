---
name: Deploy

on:
  push:
    branches: [master]
  # Weekly, so floating images and the CI runner never fall more than a week behind.
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      hosts:
        description: Limit to specific host(s)
        required: false
      tags:
        description: Run specific tag(s)
        required: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_PAUSED != 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Write vault passwords
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
          VAULT_PASS_INFRA: ${{ secrets.VAULT_PASS_INFRA }}
          VAULT_PASS_APP: ${{ secrets.VAULT_PASS_APP }}
        run: |
          if [ -n "$VAULT_PASS" ]; then printf '%s\n' "$VAULT_PASS" > .vault_pass; fi
          if [ -n "$VAULT_PASS_INFRA" ]; then printf '%s\n' "$VAULT_PASS_INFRA" > .vault_pass_infra; fi
          if [ -n "$VAULT_PASS_APP" ]; then printf '%s\n' "$VAULT_PASS_APP" > .vault_pass_app; fi

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          make after-git-pull

      - name: Run playbook
        env:
          HOSTS: ${{ inputs.hosts }}
          TAGS: ${{ inputs.tags }}
          SKIP_HOSTS: ${{ vars.DEPLOY_SKIP_HOSTS }}
        run: |
          source .venv/bin/activate
          limit="${HOSTS:-all}"
          for host in ${SKIP_HOSTS//,/ }; do
            limit="$limit:!$host"
          done
          args=()
          if [ "$limit" != all ]; then
            args+=("hosts=$limit")
          fi
          if [ -n "$TAGS" ]; then
            args+=("tags=$TAGS")
          fi
          make run "${args[@]}"

      # Post steps run after this, so none of them can read the vault password or key.
      - name: Remove secrets
        if: always()
        run: rm -f .vault_pass .vault_pass_infra .vault_pass_app .ssh/ansible-id_ed25519
