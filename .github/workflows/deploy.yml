---
name: Deploy

on:
  push:
    branches: [master]
  # Weekly, so floating images and the CI runner never fall more than a week behind.
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      hosts:
        description: Limit to specific host(s)
        required: false
      tags:
        description: Run specific tag(s)
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_PAUSED != 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Write vault password
        run: echo "${{ secrets.VAULT_PASS }}" > .vault_pass

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          make after-git-pull

      - name: Run playbook
        env:
          HOSTS: ${{ inputs.hosts }}
          TAGS: ${{ inputs.tags }}
          SKIP_HOSTS: ${{ vars.DEPLOY_SKIP_HOSTS }}
        run: |
          source .venv/bin/activate
          limit="${HOSTS:-all}"
          for host in ${SKIP_HOSTS//,/ }; do
            limit="$limit:!$host"
          done
          args=()
          if [ "$limit" != all ]; then
            args+=("hosts=$limit")
          fi
          if [ -n "$TAGS" ]; then
            args+=("tags=$TAGS")
          fi
          make run "${args[@]}"
