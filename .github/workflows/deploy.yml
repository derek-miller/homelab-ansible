---
name: Deploy

on:
  push:
    branches: [master]
  # Weekly, so floating images and the CI runner never fall more than a week behind.
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      hosts:
        description: Limit to specific host(s)
        required: false
      tags:
        description: Run specific tag(s)
        required: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_PAUSED != 'true'
    runs-on: ubuntu-26.04
    # Its secrets are only released to runs from master.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Write vault password
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: printf '%s\n' "$VAULT_PASS" > .vault_pass

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          make after-git-pull

      - name: Run playbook
        env:
          HOSTS: ${{ inputs.hosts }}
          TAGS: ${{ inputs.tags }}
          SKIP_HOSTS: ${{ vars.DEPLOY_SKIP_HOSTS }}
        run: |
          # The Makefile puts these inside single quotes on a shell command line.
          allowed='^[]A-Za-z0-9_.,:!*&~[-]*$'
          if [[ ! "$HOSTS,$TAGS,$SKIP_HOSTS" =~ $allowed ]]; then
            echo "hosts, tags and DEPLOY_SKIP_HOSTS may hold only letters, digits and _ . , : ! * & ~ [ ] -" >&2
            exit 1
          fi
          source .venv/bin/activate
          limit="${HOSTS:-all}"
          for host in ${SKIP_HOSTS//,/ }; do
            limit="$limit:!$host"
          done
          args=()
          if [ "$limit" != all ]; then
            args+=("hosts=$limit")
          fi
          if [ -n "$TAGS" ]; then
            args+=("tags=$TAGS")
          fi
          make run "${args[@]}"

      # Post steps run after this, so none of them can read the vault password or key.
      - name: Remove secrets
        if: always()
        run: rm -f .vault_pass .ssh/ansible-id_ed25519
